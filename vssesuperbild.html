<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windows 11</title>
<style>
/* ================= BASE ================= */
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000}
body{
  font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Noto Sans',Arial,sans-serif;
  font-size:14px;color:var(--txt);-webkit-font-smoothing:antialiased;user-select:none;
}
body.theme-dark{color-scheme:dark}
:root{
  --accent:#0078d4;--accent-fg:#fff;
  --txt:#101010;--txt2:#5b5b5b;--txt3:#8b8b8b;
  --stroke:rgba(0,0,0,.09);--stroke2:rgba(0,0,0,.17);
  --surface:rgba(243,243,243,.72);--surface2:rgba(255,255,255,.55);
  --solid:#f3f3f3;--card:rgba(255,255,255,.72);
  --hover:rgba(0,0,0,.05);--press:rgba(0,0,0,.09);
  --field:#ffffff;--field-stroke:rgba(0,0,0,.12);
  --shadow:0 30px 60px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.16);
  --blur:blur(36px) saturate(1.7);
}
body.theme-dark{
  --surface:rgba(28,28,28,.68);--surface2:rgba(60,60,60,.42);
  --solid:#1f1f1f;--card:rgba(43,43,43,.6);
  --hover:rgba(255,255,255,.06);--press:rgba(255,255,255,.1);
  --field:rgba(255,255,255,.05);--field-stroke:rgba(255,255,255,.1);
  --txt:#f0f0f0;--txt2:#c6c6c6;--txt3:#9a9a9a;
  --stroke:rgba(255,255,255,.09);--stroke2:rgba(255,255,255,.18);
  --shadow:0 30px 70px rgba(0,0,0,.55),0 2px 12px rgba(0,0,0,.45);
}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:default;padding:0}
input,textarea{font:inherit}
.ic{width:24px;height:24px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.solid{fill:currentColor;stroke:none}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--txt3);border:4px solid transparent;background-clip:content-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--txt2);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.hide{display:none!important}

/* ================= BOOT / LOCK ================= */
#boot{position:fixed;inset:0;background:#000;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:opacity .6s}
#boot .logo{width:96px;height:96px;color:#fff}
#boot .ring{position:absolute;bottom:22vh;width:44px;height:44px;animation:spin 1.6s linear infinite}
#boot .ring circle{fill:none;stroke:#fff;stroke-width:3;opacity:.9;stroke-dasharray:60 200}
@keyframes spin{to{transform:rotate(360deg)}}
#lock{position:fixed;inset:0;z-index:8500;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .45s cubic-bezier(.3,0,.2,1),opacity .45s;color:#fff;text-align:center}
#lock .lt{font-size:104px;font-weight:600;line-height:1;letter-spacing:-3px;text-shadow:0 4px 40px rgba(0,0,0,.45);font-weight:300}
#lock .ld{font-size:30px;font-weight:400;margin-top:8px;text-shadow:0 2px 20px rgba(0,0,0,.4)}
#lock .lhint{position:absolute;bottom:8vh;font-size:14px;opacity:.85}
#lock.lifting{transform:translateY(-90px);opacity:0}
#lockSub{position:fixed;inset:0;z-index:8600;display:none;align-items:center;justify-content:center;color:#fff;cursor:pointer}
#lockSub .box{display:flex;flex-direction:column;align-items:center;gap:16px}
#lockSub .av{width:132px;height:132px;border-radius:50%;background:linear-gradient(140deg,#3b82f6,#8b5cf6);display:grid;place-items:center;font-size:52px;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#lockSub .nm{font-size:30px;font-weight:400}
#lockSub .pw{width:280px;display:flex;align-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 10px;backdrop-filter:blur(10px)}
#lockSub .pw input{flex:1;background:none;border:0;outline:0;color:#fff;padding:9px 6px;font-size:14px}
#lockSub .pw input::placeholder{color:rgba(255,255,255,.75)}
#lockSub .hint{font-size:13px;opacity:.85}
#black{position:fixed;inset:0;background:#000;z-index:9500;display:none;align-items:center;justify-content:center;color:#d0d0d0;font-size:20px;flex-direction:column;gap:18px;text-align:center;padding:20px}

/* ================= DESKTOP ================= */
#os{position:fixed;inset:0;overflow:hidden}
#wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 180px rgba(0,0,0,.28)}
#icons{position:absolute;inset:0 0 48px 0;padding:8px 6px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:2px}
.dicon{width:88px;padding:8px 4px 6px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;cursor:default;border:1px solid transparent}
.dicon .lbl{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);line-height:1.25;max-width:100%;word-break:break-word}
.dicon:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18)}
.dicon.sel{background:rgba(0,120,215,.35);border-color:rgba(120,180,255,.5)}
.dicon.sel:hover{background:rgba(0,120,215,.45)}

/* ================= TASKBAR ================= */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;z-index:600;display:flex;align-items:center;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--stroke2)}
#tbLeft{width:220px;display:flex;align-items:center;gap:4px;padding-left:8px}
#tbRight{margin-left:auto;display:flex;align-items:center;height:100%}
#tbCenter{position:absolute;left:50%;top:0;height:48px;transform:translateX(-50%);display:flex;align-items:center;gap:2px}
.tbi{width:40px;height:40px;display:grid;place-items:center;border-radius:5px;position:relative;color:var(--txt)}
.tbi:hover{background:var(--hover)}
.tbi:active{background:var(--press);transform:scale(.94)}
.tbi.on{background:var(--hover)}
.tbi .ic{width:24px;height:24px}
.tbi.win-app{width:44px;height:40px;display:flex;align-items:center;justify-content:center}
.tbi.win-app img,.tbi.win-app .ic{width:24px;height:24px}
.tbi.win-app .u{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);height:3px;border-radius:2px;background:var(--txt);width:6px;transition:width .18s,width .18s}
.tbi.win-app.run .u{width:16px}
.tbi.win-app.act .u{width:17px;background:var(--accent)}
.tbi.win-app.min .u{width:6px;background:var(--txt3);height:2px;bottom:4px}
.tbi.start svg{width:22px;height:22px}
#traybtn{display:flex;align-items:center;gap:12px;height:48px;padding:0 10px 0 12px;border-radius:0}
#traybtn:hover{background:var(--hover)}
#tray{height:100%;padding:0 10px 0 8px}
#tray .grp{display:flex;align-items:center;gap:10px;padding:0 8px;height:100%}
#tray .grp:hover{background:var(--hover)}
#tray svg{width:16px;height:16px}
#clock{text-align:right;line-height:1.35;padding:0 8px;height:100%;display:flex;flex-direction:column;justify-content:center}
#clock .d{font-size:12px;color:var(--txt2)}
#showdesk{width:10px;height:100%;border-left:1px solid var(--stroke2)}
#showdesk:hover{background:var(--hover)}
.tbsep{width:1px;height:22px;background:var(--stroke2);margin:0 2px}
.peek{position:absolute;z-index:700;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke2);border-radius:8px;box-shadow:var(--shadow);color:var(--txt)}

/* ================= START ================= */
#start{position:absolute;bottom:58px;left:50%;transform:translateX(-50%) translateY(14px);width:640px;height:min(730px,calc(100vh - 90px));z-index:650;border-radius:8px;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke2);box-shadow:var(--shadow);display:none;flex-direction:column;opacity:0;transition:opacity .16s,transform .16s}
#start.open{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
#startSearch{margin:32px 56px 22px;height:36px;border-radius:18px;background:var(--field);border:1px solid var(--field-stroke);display:flex;align-items:center;gap:10px;padding:0 14px}
#startSearch input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:14px}
#startSearch .ic{width:17px;height:17px;color:var(--txt2)}
#startBody{flex:1;overflow:auto;padding:0 56px 8px}
#startFoot{height:64px;display:flex;align-items:center;padding:0 56px;background:var(--surface2);border-top:1px solid var(--stroke);border-radius:0 0 8px 8px}
#startFoot .who{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:5px;flex:1}
#startFoot .who:hover{background:var(--hover)}
#startFoot .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#3b82f6,#8b5cf6);display:grid;place-items:center;color:#fff;font-weight:600}
.sHead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.sHead b{font-size:14px;font-weight:600}
.sHead .all{padding:5px 12px;border-radius:5px;background:var(--surface2);border:1px solid var(--stroke);font-size:12px;color:var(--txt2)}
.sHead .all:hover{background:var(--hover)}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.pitem{height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:5px;padding:6px 2px;text-align:center}
.pitem:hover{background:var(--hover)}
.pitem:active{background:var(--press);transform:scale(.97)}
.pitem .ic{width:32px;height:32px}
.pitem span{font-size:12px;line-height:1.2;max-width:100%}
.rec{display:flex;align-items:center;gap:12px;height:52px;padding:0 10px;border-radius:5px}
.rec:hover{background:var(--hover)}
.rec .ic{width:30px;height:30px}
.rec .t{font-size:13px}
.rec .s{font-size:11px;color:var(--txt3)}
#powerMenu{position:absolute;bottom:6px;right:6px;z-index:700;min-width:210px;background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--stroke2);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:none}
#powerMenu .mi{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:5px;width:100%;text-align:left}
#powerMenu .mi:hover{background:var(--hover)}
#powerMenu .mi .ic{width:17px;height:17px}

/* ================= PANELS ================= */
#qset{position:absolute;right:8px;bottom:58px;width:364px;z-index:650;border-radius:8px;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke2);box-shadow:var(--shadow);padding:18px 16px;display:none;transform:translateY(12px);opacity:0;transition:.16s}
#qset.open{display:block;transform:none;opacity:1}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.qbtn{height:62px;border-radius:5px;background:var(--surface2);border:1px solid var(--stroke);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--txt2)}
.qbtn .ic{width:18px;height:18px}
.qbtn:hover{background:var(--hover)}
.qbtn.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.slider{display:flex;align-items:center;gap:12px;height:36px;padding:0 8px;border-radius:5px}
.slider:hover{background:var(--hover)}
.slider .ic{width:17px;height:17px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--stroke2);flex:1;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:4px solid var(--solid);box-shadow:0 0 0 1px var(--stroke2);cursor:default}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--solid)}
#notif{position:absolute;right:8px;bottom:58px;width:364px;max-height:min(640px,calc(100vh - 90px));z-index:650;border-radius:8px;background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--stroke2);box-shadow:var(--shadow);display:none;flex-direction:column;transform:translateY(12px);opacity:0;transition:.16s}
#notif.open{display:flex;transform:none;opacity:1}
.ncard{background:var(--card);border:1px solid var(--stroke);border-radius:6px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px}
.ncard .ic{width:22px;height:22px}
.ncard .t{font-size:13px;font-weight:600}
.ncard .s{font-size:12px;color:var(--txt2)}
#calHead{display:flex;align-items:center;gap:6px;padding:12px 12px 8px}
#calHead b{flex:1;text-align:center;font-weight:600}
.calNav{width:30px;height:30px;border-radius:5px;display:grid;place-items:center}
.calNav:hover{background:var(--hover)}
#calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 12px 14px;text-align:center}
#calGrid .dw{font-size:12px;color:var(--txt3);padding:4px 0}
#calGrid .d{height:36px;display:grid;place-items:center;border-radius:50%;font-size:13px;position:relative}
#calGrid .d:hover{background:var(--hover)}
#calGrid .d.off{color:var(--txt3);opacity:.55}
#calGrid .d.today{background:var(--accent);color:var(--accent-fg);font-weight:600}
#calGrid .d.sel{outline:1px solid var(--accent)}
#calTime{padding:0 12px 16px;font-size:13px;color:var(--txt2);text-align:center}
#widgets{position:absolute;left:8px;bottom:58px;width:436px;max-height:min(660px,calc(100vh - 90px));z-index:650;border-radius:8px;background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--stroke2);box-shadow:var(--shadow);display:none;flex-direction:column;transform:translateY(12px);opacity:0;transition:.16s}
#widgets.open{display:flex;transform:none;opacity:1}
#wHead{display:flex;align-items:center;padding:14px 16px 10px;font-size:15px;font-weight:600}
.wcard{margin:0 12px 12px;border-radius:8px;padding:14px;background:var(--card);border:1px solid var(--stroke);position:relative;overflow:hidden}
.weather{display:flex;align-items:center;gap:14px}
.weather .t{font-size:38px;line-height:1}
.weather .l{font-size:13px;color:var(--txt2)}
.spark{display:flex;align-items:flex-end;gap:6px;height:60px;margin-top:10px}
.spark i{flex:1;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,var(--accent),rgba(0,120,215,.25))}
.wlist .wi{display:flex;gap:12px;align-items:flex-start;padding:9px 4px;border-radius:6px}
.wlist .wi:hover{background:var(--hover)}
.wlist .ic{width:20px;height:20px;color:var(--accent)}
#searchp{position:absolute;bottom:58px;left:50%;transform:translateX(-50%) translateY(14px);width:680px;max-height:min(680px,calc(100vh - 90px));z-index:650;border-radius:8px;background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--stroke2);box-shadow:var(--shadow);display:none;flex-direction:column;opacity:0;transition:.16s}
#searchp.open{display:flex;opacity:1;transform:translateX(-50%)}
#searchp .bar{margin:26px 40px 18px;height:38px;border-radius:19px;background:var(--field);border:1px solid var(--field-stroke);display:flex;align-items:center;gap:10px;padding:0 16px}
#searchp .bar input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:14px}
#searchp .res{padding:0 26px 20px;overflow:auto}
#searchp .rs{display:flex;align-items:center;gap:14px;height:56px;padding:0 12px;border-radius:5px}
#searchp .rs:hover,.#searchp .rs.hl{background:var(--hover)}
#searchp .rs .ic{width:26px;height:26px}
#searchp .rs .t{font-size:13px}
#searchp .rs .s{font-size:11px;color:var(--txt3)}

/* ================= TASK VIEW ================= */
#taskview{position:absolute;inset:0;z-index:640;display:none;background:rgba(0,0,0,.32);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);flex-direction:column;padding:70px 60px 20px}
#tvGrid{flex:1;display:flex;flex-wrap:wrap;gap:22px;align-content:center;justify-content:center;overflow:auto}
.tvcard{width:280px;border-radius:8px;padding:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);cursor:default;transition:.12s}
.tvcard:hover{background:rgba(255,255,255,.2);outline:2px solid rgba(255,255,255,.5)}
.tvthumb{height:160px;border-radius:5px;background:var(--solid);border:1px solid var(--stroke2);overflow:hidden;display:flex;flex-direction:column}
.tvthumb .h{height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:11px;border-bottom:1px solid var(--stroke)}
.tvthumb .b{flex:1;padding:8px;font-size:11px;color:var(--txt2);overflow:hidden}
.tvcard .cap{display:flex;align-items:center;gap:8px;padding:8px 4px 2px;color:#fff;font-size:12px}
.tvcard .cap .x{margin-left:auto;width:22px;height:22px;border-radius:4px;display:grid;place-items:center}
.tvcard .cap .x:hover{background:rgba(255,255,255,.2)}
#tvDesks{display:flex;align-items:center;justify-content:center;gap:20px;padding:16px}
#tvDesks .dk{width:170px;height:96px;border-radius:6px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.5);background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-size:12px}
#tvDesks .add{width:170px;height:96px;border-radius:6px;border:1px dashed rgba(255,255,255,.5);display:grid;place-items:center;color:#fff;gap:2px}

/* ================= WINDOWS ================= */
#windows{position:absolute;inset:0 0 48px 0;z-index:200;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;border-radius:8px;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke2);box-shadow:var(--shadow);overflow:hidden;min-width:260px;min-height:140px}
.win.op{animation:winIn .18s cubic-bezier(.2,.8,.3,1)}
@keyframes winIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.win.mini{animation:winOut .16s ease-in forwards}
@keyframes winOut{to{opacity:0;transform:scale(.9) translateY(40px)}}
.tbar{height:34px;display:flex;align-items:center;flex:0 0 34px;position:relative;background:var(--surface2);border-bottom:1px solid var(--stroke)}
.tbar .ti{width:32px;display:grid;place-items:center;color:var(--txt2)}
.tbar .ti .ic{width:16px;height:16px}
.ttitle{flex:1;text-align:center;font-size:12px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;pointer-events:none}
.tbtns{display:flex;height:100%;margin-left:auto}
.tbtns button{width:46px;height:100%;display:grid;place-items:center;color:var(--txt)}
.tbtns button:hover{background:var(--hover)}
.tbtns button.cl:hover{background:#c42b1c;color:#fff}
.tbtns svg{width:11px;height:11px;stroke-width:1.3}
.tbtns button svg{fill:none;stroke:currentColor}
.rsh{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:5}
.rsh:after{content:'';position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-right:1.5px solid var(--txt3);border-bottom:1.5px solid var(--txt3)}
.wbody{flex:1;overflow:auto;background:var(--solid);color:var(--txt);position:relative}
.win.noResize .rsh{display:none}
#snapzones{position:absolute;inset:0;z-index:800;pointer-events:none}
#snapzones div{position:absolute;background:rgba(0,120,215,.28);border:2px solid rgba(120,190,255,.8);border-radius:8px;opacity:0;transition:opacity .12s}
#snapzones div.on{opacity:1}
#snapfly{position:absolute;z-index:900;background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--stroke2);border-radius:8px;box-shadow:var(--shadow);padding:12px;display:none;gap:12px}
.lay{display:grid;gap:3px;width:104px;height:66px;padding:4px;border-radius:5px}
.lay i{background:var(--txt3);border-radius:3px;transition:.1s}
.lay:hover i{background:var(--hover)}
.lay i:hover{background:var(--accent)!important}
.lay.on{background:var(--hover)}
#dragline{position:absolute;top:0;left:0;right:0;height:6px;z-index:850;display:none}
#dragline.on{display:block;background:var(--accent)}

/* ================= CONTEXT MENU ================= */
#ctx{position:absolute;z-index:1000;min-width:220px;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke2);border-radius:8px;box-shadow:var(--shadow);padding:6px;display:none}
#ctx .mi{display:flex;align-items:center;gap:12px;height:34px;padding:0 12px;border-radius:5px;width:100%;text-align:left;font-size:13px}
#ctx .mi:hover{background:var(--hover)}
#ctx .mi .ic{width:16px;height:16px;color:var(--txt2)}
#ctx .mi.dis{opacity:.45;pointer-events:none}
#ctx .sep{height:1px;background:var(--stroke);margin:5px 10px}
#ctx .acc{color:var(--txt3);font-size:11px;margin-left:auto}
#ctx .mk{width:12px;text-align:center;font-size:11px}

/* ================= RUN / TOAST ================= */
#run{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;z-index:1100;border-radius:8px;background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--stroke2);box-shadow:var(--shadow);display:none;flex-direction:column}
#run .hd{font-size:19px;padding:24px 24px 6px}
#run .bd{padding:0 24px 20px;display:flex;align-items:center;gap:12px}
#run input{flex:1;height:32px;border-radius:4px;border:1px solid var(--field-stroke);background:var(--field);color:var(--txt);padding:0 10px;outline:0}
#run .ft{display:flex;gap:8px;padding:14px 24px;background:var(--surface2);border-top:1px solid var(--stroke);border-radius:0 0 8px 8px}
.btn{height:32px;padding:0 18px;border-radius:4px;border:1px solid var(--stroke2);background:var(--card);font-size:13px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
#toasts{position:absolute;right:12px;bottom:60px;z-index:1200;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{width:330px;background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--stroke2);border-radius:8px;box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:12px;animation:winIn .2s}
.toast .ic{width:20px;height:20px;color:var(--accent)}
.toast .t{font-size:13px;font-weight:600}
.toast .s{font-size:12px;color:var(--txt2)}

/* ================= APPS CSS ================= */
.pad{padding:16px}
.hstack{display:flex;align-items:center;gap:8px}
.vsep{width:1px;height:20px;background:var(--stroke2)}
.tbtn{height:30px;padding:0 10px;border-radius:4px;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txt)}
.tbtn:hover{background:var(--hover)}
.tbtn.on{background:var(--press)}
.tbtn .ic{width:15px;height:15px}
.tfield{height:30px;border-radius:4px;background:var(--field);border:1px solid var(--field-stroke);display:flex;align-items:center;gap:8px;padding:0 10px;flex:1;min-width:0}
.tfield input{background:none;border:0;outline:0;color:var(--txt);flex:1;min-width:0;font-size:13px}
.tfield .ic{width:14px;height:14px;color:var(--txt2)}
.appbar{height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--stroke);background:var(--solid);position:sticky;top:0;z-index:2}
.statusbar{height:26px;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--stroke);font-size:11px;color:var(--txt2);background:var(--solid);position:absolute;left:0;right:0;bottom:0}
.menu{position:absolute;z-index:30;background:var(--surface);backdrop-filter:var(--blur);border:1px solid var(--stroke2);border-radius:8px;box-shadow:var(--shadow);padding:6px;min-width:200px;display:none}

/* notepad */
.np-area{width:100%;height:100%;border:0;outline:0;resize:none;background:var(--field);color:var(--txt);padding:10px 12px;font-family:'Cascadia Mono',Consolas,'Courier New',monospace;font-size:14px;line-height:1.45;user-select:text;caret-color:var(--txt)}

/* explorer */
.ex{display:flex;height:100%}
.ex-side{width:200px;flex:0 0 200px;border-right:1px solid var(--stroke);padding:8px;overflow:auto;background:var(--solid)}
.ex-nav{display:flex;align-items:center;gap:12px;height:32px;padding:0 10px;border-radius:4px;font-size:13px;cursor:default}
.ex-nav:hover{background:var(--hover)}
.ex-nav.on{background:var(--hover);font-weight:600}
.ex-nav .ic{width:16px;height:16px;color:var(--accent)}
.ex-main{flex:1;display:flex;flex-direction:column;min-width:0}
.ex-list{flex:1;overflow:auto;padding:6px}
.ex-item{display:flex;align-items:center;gap:12px;height:44px;padding:0 10px;border-radius:4px;cursor:default}
.ex-item:hover{background:var(--hover)}
.ex-item.sel{background:var(--press)}
.ex-item .ic{width:26px;height:26px}
.ex-item .n{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-item .d{font-size:12px;color:var(--txt3);width:130px;text-align:right}
.ex-head{display:flex;align-items:center;gap:12px;height:32px;padding:0 10px;font-size:12px;color:var(--txt2);border-bottom:1px solid var(--stroke)}
.ex-head .n{flex:1}

/* calculator */
.calc{display:flex;flex-direction:column;height:100%;background:var(--solid)}
.calc-disp{padding:10px 14px 14px;text-align:right}
.calc-disp .hist{font-size:12px;color:var(--txt2);height:18px;white-space:nowrap;overflow:hidden}
.calc-disp .val{font-size:44px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden}
.calc-mem{display:flex;gap:2px;padding:0 10px 6px}
.calc-mem b{flex:1;height:30px;display:grid;place-items:center;font-size:12px;color:var(--txt2);border-radius:4px}
.calc-mem b:hover{background:var(--hover)}
.calc-pad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:0 6px 6px}
.calc-pad.sci{grid-template-columns:repeat(5,1fr)}
.ck{border-radius:4px;display:grid;place-items:center;font-size:17px;background:var(--card);border:1px solid var(--stroke)}
.ck:hover{background:var(--hover)}
.ck.fn{background:transparent;border-color:transparent;font-size:15px}
.ck.fn:hover{background:var(--hover)}
.ck.eq{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.ck.eq:hover{filter:brightness(1.1)}
.calc-membar{display:flex;gap:2px;padding:0 6px 4px}
.calc-membar b{flex:1;height:28px;display:grid;place-items:center;font-size:12px;border-radius:4px;color:var(--txt2)}
.calc-membar b:hover{background:var(--hover)}

/* terminal */
.term{height:100%;background:#0c0c0c;color:#cccccc;font-family:'Cascadia Mono',Consolas,'Courier New',monospace;font-size:13px;line-height:1.35;padding:8px 10px;overflow:auto;user-select:text;display:flex;flex-direction:column}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term .g{color:#16c60c}.term .b{color:#3b78ff}.term .y{color:#f9f1a5}.term .c{color:#61d6d6}.term .m{color:#c586c0}.term .r{color:#e74856}
.term-in{display:flex;gap:6px;align-items:center}
.term-in input{flex:1;background:none;border:0;outline:0;color:#ccc;font:inherit;caret-color:#ccc;user-select:text}
.term-tab{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border-top:1px solid #1f1f1f;background:#0c0c0c;color:#ccc;font-size:12px}

/* edge */
.edge{display:flex;flex-direction:column;height:100%;background:var(--solid)}
.edge-bar{display:flex;align-items:center;gap:6px;padding:6px 8px}
.edge-url{flex:1;height:30px;border-radius:15px;background:var(--field);border:1px solid var(--field-stroke);display:flex;align-items:center;gap:8px;padding:0 12px}
.edge-url input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:13px}
.edge-url .ic{width:14px;height:14px;color:var(--txt2)}
.edge-view{flex:1;overflow:auto;background:#fff;color:#111}
body.theme-dark .edge-view{background:#1c1c1c;color:#eee}
.edge-hero{padding:56px 30px;text-align:center;background:linear-gradient(135deg,#0f6cbd,#3b2f8f);color:#fff}
.edge-hero h1{font-size:40px;margin:0 0 8px;font-weight:600}
.edge-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px;padding:24px}
.etile{height:92px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#555;background:#f1f1f1;border:1px solid #e3e3e3}
body.theme-dark .etile{background:#2a2a2a;color:#bbb;border-color:#333}
.etile:hover{background:#e6e6e6}
.etile .dot{width:32px;height:32px;border-radius:8px}
.edge-page{padding:40px;line-height:1.7;max-width:760px;margin:0 auto}
.edge-page h1{font-size:28px;margin:0 0 6px}
.edge-page a{color:#0f6cbd;cursor:default}
.edge-404{text-align:center;padding:60px 20px}

/* settings */
.set{display:flex;height:100%}
.set-nav{width:290px;flex:0 0 290px;padding:10px 8px;overflow:auto;border-right:1px solid var(--stroke)}
.set-user{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:8px}
.set-user .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,#3b82f6,#8b5cf6);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:600}
.set-main{flex:1;overflow:auto;padding:26px 34px 40px;min-width:0}
.set-main h1{font-size:26px;font-weight:600;margin:0 0 20px}
.set-nav .ni{display:flex;align-items:center;gap:14px;height:38px;padding:0 12px;border-radius:5px;position:relative;font-size:13px;cursor:default}
.set-nav .ni:hover{background:var(--hover)}
.set-nav .ni.on{background:var(--hover)}
.set-nav .ni.on:before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.set-nav .ni .ic{width:17px;height:17px;color:var(--txt)}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:6px;padding:14px 16px;margin-bottom:6px;display:flex;align-items:center;gap:16px;cursor:default}
.card:hover{background:var(--hover)}
.card .tx{flex:1;min-width:0}
.card .t1{font-size:14px}
.card .t2{font-size:12px;color:var(--txt2);margin-top:3px}
.card h3{font-size:14px;margin:26px 0 10px}
.sw{width:42px;height:22px;border-radius:11px;background:var(--field);border:1px solid var(--stroke2);position:relative;flex:0 0 42px;transition:.15s}
.sw:after{content:'';position:absolute;left:4px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--txt2);transition:.15s}
.sw.on{background:var(--accent);border-color:transparent}
.sw.on:after{left:24px;background:#fff}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0}
.sw2{width:38px;height:38px;border-radius:5px;border:2px solid transparent;position:relative}
.sw2.on:after{content:'';position:absolute;inset:-6px;border:2px solid var(--txt);border-radius:8px}
.walls{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.wall{height:82px;border-radius:6px;background-size:cover;background-position:center;border:2px solid transparent;position:relative}
.wall.on{border-color:var(--accent)}
.wall.on:after{content:'✓';position:absolute;right:6px;bottom:4px;background:#fff;color:#000;border-radius:50%;width:18px;height:18px;display:grid;place-items:center;font-size:12px}
.hero{display:flex;align-items:center;gap:20px;padding:20px;border-radius:8px;background:var(--card);border:1px solid var(--stroke);margin-bottom:18px}
.hero .dev{width:96px;height:96px;border-radius:6px;background:linear-gradient(140deg,#1f6feb,#7c3aed);display:grid;place-items:center;color:#fff}
.hero .dev .ic{width:56px;height:56px;stroke-width:1.2}
.spec{display:flex;font-size:13px;padding:7px 0;border-bottom:1px solid var(--stroke)}
.spec .k{width:210px;color:var(--txt2);flex:0 0 210px}
.spec .v{flex:1}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tgl{height:44px;border-radius:5px;background:var(--card);border:1px solid var(--stroke);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px}
.tgl.on{background:var(--press);border-color:var(--accent)}
.tgl:hover{background:var(--hover)}

/* task manager */
.tm{display:flex;height:100%}
.tm-side{width:180px;flex:0 0 180px;padding:8px;border-right:1px solid var(--stroke)}
.tm-nav{height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:4px;font-size:13px;cursor:default}
.tm-nav:hover{background:var(--hover)}
.tm-nav.on{background:var(--hover);font-weight:600}
.tm-main{flex:1;display:flex;flex-direction:column;min-width:0}
.tm-head{display:flex;font-size:12px;color:var(--txt2);padding:8px 14px;border-bottom:1px solid var(--stroke);gap:10px}
.tm-head .n{flex:1}
.tm-head .c{width:80px;text-align:right}
.tm-rows{flex:1;overflow:auto}
.tm-row{display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;font-size:13px;cursor:default}
.tm-row:hover{background:var(--hover)}
.tm-row .ic{width:18px;height:18px}
.tm-row .n{flex:1;display:flex;align-items:center;gap:10px}
.tm-row .u{width:80px;text-align:right;font-size:12px;color:var(--txt2)}
.tm-row .c{width:80px;text-align:right;font-size:12px;color:var(--txt2)}
.graph{height:90px;border:1px solid var(--stroke);border-radius:4px;position:relative;overflow:hidden;background:var(--field)}
.graph canvas{position:absolute;inset:0;width:100%;height:100%}
.gside{width:260px;flex:0 0 260px;border-left:1px solid var(--stroke);padding:18px 16px;display:flex;flex-direction:column;gap:4px}
.gside .big{font-size:34px;font-weight:300}
.gside .lbl{font-size:12px;color:var(--txt2)}
.gside .h{font-size:13px;font-weight:600;margin-top:12px}
.gside .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--txt2);padding:3px 0}
.pie{width:120px;height:120px;border-radius:50%;margin:6px auto;background:conic-gradient(#0f6cbd 0 22%,#e3742e 22% 38%,#16a34a 38% 52%,#a855f7 52% 64%,#64748b 64% 78%,#cbd5e1 78% 100%);position:relative}
.pie:after{content:'';position:absolute;inset:26px;background:var(--solid);border-radius:50%}

/* photos */
.ph{display:flex;height:100%}
.ph-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:12px;overflow:auto;align-content:start}
.ph-i{aspect-ratio:1;border-radius:6px;overflow:hidden;cursor:default;position:relative}
.ph-i:hover{outline:2px solid var(--accent)}
.ph-i span{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:.15s}
.ph-i:hover span{opacity:1}
.ph-view{position:absolute;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:14px}
.ph-view .p{width:70%;height:70%;border-radius:8px}
.ph-view .c{color:#fff;font-size:13px}

/* this pc / drives */
.drive{display:flex;align-items:center;gap:14px;padding:12px;border-radius:6px;cursor:default}
.drive:hover{background:var(--hover)}
.drive .ic{width:44px;height:44px}
.drive .n{font-size:14px}
.drive .s{font-size:12px;color:var(--txt2)}
.bar{height:8px;border-radius:4px;background:var(--stroke2);margin-top:6px;overflow:hidden;width:150px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#5aa9ff)}

/* ================= LAYOUT FIXES ================= */
.wbody{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.statusbar{position:static;flex:0 0 26px}
.ex,.tm,.set,.ph{flex:1;min-height:0}
.calc,.edge,.term,.np-wrap{flex:1;min-height:0}
.edge-view{flex:1;min-height:0}
.ph-grid{flex:1;min-height:0}
.np-area{flex:1}
.ex-list{flex:1;min-height:0}
.tm-rows{flex:1;min-height:0}
.set-nav{overflow:auto}
.set-main{overflow:auto;min-width:0}
.term{display:flex}
.sz-lg .dicon{width:112px}
.sz-lg .lbl{font-size:13px}
.sz-sm .dicon{width:74px;padding:4px 2px}
.sz-sm .lbl{font-size:11px}
.reslist{display:flex;gap:4px;padding:0 34px;flex-wrap:wrap}
#lock{background:var(--wall) no-repeat center center/cover}
#lockSub{background:var(--wall) no-repeat center center/cover}
.appbar .tfield{min-width:60px}
.wall,.sw2,.etile{cursor:default}

/* ---------- обновлённые приложения ---------- */
.ph-sel{outline:2px solid var(--accent)!important}
.ph-lb{position:absolute;inset:0;background:rgba(0,0,0,.93);z-index:25;display:none;flex-direction:column}
.ph-lb img{max-width:80%;max-height:70%;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.ph-lb .cap{color:#fff;font-size:13px;display:flex;gap:10px;align-items:center}
.ph-lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:60px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.08);border-radius:6px;font-size:20px;cursor:default}
.ph-lb .nav:hover{background:rgba(255,255,255,.18)}
.ph-lb .pL{left:12px}.ph-lb .pR{right:12px}
.ph-toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mask-btn{height:30px;padding:0 12px;border-radius:4px;font-size:12px;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--stroke)}
.mask-btn:hover{background:var(--hover)}
.st-card{position:relative;overflow:hidden}
.st-card .inst{position:absolute;right:14px;bottom:14px;width:82px}
.st-prog{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff;font-size:13px}
.st-prog .pbar{width:70%;max-width:220px;height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.st-prog .pbar i{display:block;height:100%;width:0;background:#7ddc3c;transition:width .15s}
.ml-pane{width:300px;flex:0 0 300px;transition:flex .2s;overflow:auto}
.ml-form input,.ml-form textarea{width:100%;border:1px solid var(--stroke2);background:var(--field);color:var(--txt);border-radius:5px;padding:8px 10px;font-size:13px;outline:0;margin-top:6px}
.ml-form textarea{height:130px;resize:none}
.ml-item.unread{background:var(--field)}
.ml-item.unread .t2{font-weight:600;color:var(--txt)}
.ml-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 8px}
.ml-tabs{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--stroke)}
.ml-tabs b{padding:12px 2px;font-size:13px;color:var(--txt2);cursor:default}
.ml-tabs b.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.cam-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-live{position:relative;flex:1;background:#111;overflow:hidden}
.cam-snap{position:absolute;right:14px;bottom:14px;width:150px;height:112px;border-radius:6px;border:2px solid rgba(255,255,255,.7);object-fit:cover;background:#000;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.ck-tabs{display:flex;gap:6px;justify-content:center;padding:10px}
.ck-tabs b{height:34px;padding:0 16px;border-radius:18px;display:grid;place-items:center;font-size:12px;font-weight:500;color:var(--txt2);cursor:default}
.ck-tabs b.on{background:var(--accent);color:#fff}
.ck-body{flex:1;overflow:auto;padding:0 22px 22px;text-align:center}
.ck-big{font-size:64px;font-weight:200;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.ck-dig{width:230px;height:230px;margin:6px auto 0}
.ck-row{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--stroke)}
.ck-row .tm{font-size:22px;font-variant-numeric:tabular-nums;width:92px}
.ck-ring{color:#16a34a}
.mus-wrap{flex:1;display:flex;flex-direction:column;overflow:auto}
.mus-vis{height:120px;margin:8px 18px 0;border-radius:8px;background:linear-gradient(180deg,var(--field),var(--solid));border:1px solid var(--stroke);position:relative;overflow:hidden}
.mus-vis canvas{position:absolute;inset:0;width:100%;height:100%}
.mus-row{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:default;border-bottom:1px solid var(--stroke)}
.mus-row:hover{background:var(--hover)}
.mus-row.on{background:var(--press)}
.mus-row.on .n{color:var(--accent)}
.mus-ctl{display:flex;gap:18px;justify-content:center;align-items:center;padding:14px}
.mus-ctl b{display:grid;place-items:center;font-size:18px;color:var(--txt)}
.mus-ctl .pp{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px}
.mus-ctl b:hover{color:var(--accent)}
.mapcv{flex:1;width:100%;display:block;min-height:240px;cursor:grab;touch-action:none}
.mapcv:active{cursor:grabbing}
.wx-head{display:flex;align-items:center;gap:12px;padding:14px 18px}
.wx-ic{width:120px;height:120px;position:relative;margin:0 auto}
.wx-sun{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#ffe259,#ffa751);box-shadow:0 0 40px 10px rgba(255,200,80,.6);left:8px;top:8px}
.wx-cloud{position:absolute;width:84px;height:26px;border-radius:20px;background:rgba(255,255,255,.85);left:-10px;top:56px}

/* ================= Портированные приложения (DeepSeek) ================= */
.dsapp{--text:#101010;--text-dim:#5b5b5b;--text-dim2:#8b8b8b;--border:rgba(0,0,0,.09);--border-s:rgba(0,0,0,.17);
  --card:rgba(255,255,255,.72);--card-h:rgba(0,0,0,.05);--panel-solid:#f3f3f3;--win-head:rgba(255,255,255,.55);
  --r6:6px;--r10:10px;--r14:14px;--tr:.15s cubic-bezier(.2,.8,.2,1);--sh-md:0 4px 14px rgba(0,0,0,.18);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
body.theme-dark .dsapp{--text:#f0f0f0;--text-dim:#c6c6c6;--text-dim2:#9a9a9a;--border:rgba(255,255,255,.09);
  --border-s:rgba(255,255,255,.18);--card:rgba(43,43,43,.6);--card-h:rgba(255,255,255,.06);
  --panel-solid:#1f1f1f;--win-head:rgba(255,255,255,.05);--sh-md:0 4px 14px rgba(0,0,0,.5)}
@keyframes pulse {0%,100%{opacity:.4}50%{opacity:1}}
.dsapp .flyout.open{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.dsapp .tile.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dsapp .pane{padding:16px;overflow:auto;flex:1}
.dsapp .toolbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);
  background:var(--win-head);flex-shrink:0;flex-wrap:wrap}
.dsapp .btn{padding:7px 13px;border-radius:var(--r6);background:var(--card);border:1px solid var(--border);
  font-size:12.5px;transition:all var(--tr);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dsapp .btn:hover{background:var(--card-h);border-color:var(--border-s)}
.dsapp .btn:active{transform:scale(.97)}
.dsapp .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.dsapp .btn.pri:hover{filter:brightness(1.12)}
.dsapp .btn.dan{background:#ff453a;border-color:#ff453a;color:#fff}
.dsapp .btn:disabled{opacity:.5;cursor:not-allowed}
.dsapp .inp{padding:8px 12px;border-radius:var(--r6);background:var(--card);border:1px solid var(--border);
  font-size:13px;width:100%;transition:border-color var(--tr)}
.dsapp .inp:focus{border-color:var(--accent)}
.dsapp select.inp{cursor:pointer}
.dsapp select.inp option{background:var(--panel-solid);color:var(--text)}
.dsapp .field{margin-bottom:12px}
.dsapp .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px}
.dsapp .row{display:flex;gap:10px;align-items:center}
.dsapp .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dsapp .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dsapp .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r10);padding:14px}
.dsapp .card h4{font-size:13px;font-weight:600;margin-bottom:10px}
.dsapp .muted{color:var(--text-dim);font-size:12px}
.dsapp .center{display:grid;place-items:center;flex:1;text-align:center;padding:30px}
.dsapp .tabs{display:flex;gap:3px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
  overflow-x:auto;background:var(--win-head)}
.dsapp .tab{padding:7px 13px;border-radius:var(--r6);font-size:12.5px;color:var(--text-dim);white-space:nowrap;transition:all var(--tr);cursor:pointer}
.dsapp .tab:hover{background:var(--card);color:var(--text)}
.dsapp .tab.on{background:var(--accent);color:#fff}
.dsapp .split{display:flex;flex:1;overflow:hidden}
.dsapp .side{width:200px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:9px}
.dsapp .side .si{padding:8px 11px;border-radius:var(--r6);font-size:12.5px;cursor:pointer;display:flex;align-items:center;
  gap:8px;transition:background var(--tr);color:var(--text-dim)}
.dsapp .side .si:hover{background:var(--card);color:var(--text)}
.dsapp .side .si.on{background:var(--card-h);color:var(--text);font-weight:500}
.dsapp .main{flex:1;overflow:auto;padding:16px}
.dsapp .empty-note{color:var(--text-dim2);font-size:12.5px;text-align:center;padding:24px}
.dsapp .bankcard{border-radius:var(--r14);padding:18px;color:#fff;position:relative;overflow:hidden;
  min-height:158px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--sh-md)}
.dsapp .bankcard .cnum{font-size:15px;letter-spacing:2.5px;font-family:Consolas,monospace;opacity:.95}
.dsapp .bankcard .cb{font-size:23px;font-weight:600;letter-spacing:-.5px}
.dsapp .bankcard .cl{font-size:10.5px;opacity:.75;text-transform:uppercase;letter-spacing:1px}
.dsapp .bankcard .cbrand{position:absolute;top:16px;right:18px;font-size:15px;font-weight:700;font-style:italic}
.dsapp .bankcard .csh{position:absolute;right:-40px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1)}
.dsapp .op{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.dsapp .op:last-child{border-bottom:none}
.dsapp .op .oi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:15px}
.dsapp .op .ob{flex:1;min-width:0}
.dsapp .op .ot{font-size:12.5px;font-weight:500}
.dsapp .op .od{font-size:10.5px;color:var(--text-dim2)}
.dsapp .op .oa{font-size:13px;font-weight:600;white-space:nowrap}
.dsapp .op .oa.plus{color:#30d158}
.dsapp .op .oa.minus{color:#ff453a}
.dsapp .ck.op{color:var(--accent);font-weight:500}
.dsapp .scard .si{font-size:34px;flex-shrink:0}
.dsapp .prog{height:5px;border-radius:3px;background:var(--card-h);overflow:hidden;margin-bottom:8px}
.dsapp .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .18s linear;border-radius:3px}
.dsapp .gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px}
.dsapp .gcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r10);padding:20px;
  display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:all var(--tr)}
.dsapp .gcard:hover{background:var(--card-h);transform:translateY(-2px)}
.dsapp .gcard .gi{font-size:38px}
.dsapp .gcard .gn{font-size:12.5px;font-weight:500}
.dsapp .msgrid{display:grid;gap:2px;background:var(--border);padding:2px;border-radius:var(--r6)}
.dsapp .msc{width:30px;height:30px;background:var(--card);border-radius:3px;display:grid;place-items:center;
  font-size:14px;cursor:pointer;transition:background .1s;font-weight:600}
.dsapp .msc:hover{background:var(--card-h)}
.dsapp .msc.open{background:var(--panel-solid);cursor:default}
.dsapp .msc.mine{background:#ff453a;color:#fff}
.dsapp .msc.flag{color:#ff9f0a}
.dsapp .g2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);padding:8px;
  border-radius:var(--r10);width:min(340px,100%);margin:auto}
.dsapp .g2048 .cell{aspect-ratio:1;border-radius:var(--r6);display:grid;place-items:center;font-size:22px;font-weight:700;
  background:rgba(255,255,255,.05);transition:all .12s}
.dsapp .memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(360px,100%);margin:auto}
.dsapp .memc{aspect-ratio:1;border-radius:var(--r10);background:var(--card);border:1px solid var(--border);
  display:grid;place-items:center;font-size:29px;cursor:pointer;transition:all .18s;color:transparent}
.dsapp .memc.flip{background:var(--accent);color:#fff}
.dsapp .memc.done{background:rgba(48,209,88,.22);border-color:#30d158;color:#fff}
.dsapp .ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:min(280px,100%);margin:auto}
.dsapp .tttc{aspect-ratio:1;border-radius:var(--r10);background:var(--card);border:1px solid var(--border);
  display:grid;place-items:center;font-size:42px;cursor:pointer;transition:all var(--tr)}
.dsapp .tttc:hover{background:var(--card-h)}
.dsapp .wallitem.on{border-color:var(--accent)}
.dsapp .accentdot.on{border-color:var(--text)}
@media (max-width:900px) {.dsapp .side{width:150px}}
</style>
</head>

const wins=[];let zTop=200;let focused=null;let flyCheck=null,flyBtn=null,flyX=-99,flyY=-99;
const area=()=>{const r=$('#windows').getBoundingClientRect();return{w:r.width,h:r.height}};
function flyAutoHide(){

function createWindow(app,opts){
  opts=opts||{};
  const A=APPS[app];
  const ar=area();
  const w=Math.min(opts.w||A.w||760,ar.w-20), h=Math.min(opts.h||A.h||520,ar.h-20);
  const n=wins.length;
  const x=opts.x!=null?opts.x:Math.max(10,Math.round((ar.w-w)/2)+((n%6)-2)*26);
  const y=opts.y!=null?opts.y:Math.max(10,Math.round((ar.h-h)/2.2)+((n%5)-2)*22);
  const el=document.createElement('div');
  el.className='win op '+(app==='term'?'noResize ':'');
  el.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;z-index:'+(++zTop);
  el.dataset.app=app;
  el.innerHTML='<div class="tbar"><div class="ti">'+ic(A.icon,16)+'</div><div class="ttitle">'+esc(A.title)+'</div>'+
    '<div class="tbtns"><button class="mn" title="Свернуть">'+ic('winMin',11)+'</button>'+
    '<button class="mx" title="Развернуть">'+ic('winMax',11)+'</button>'+
    '<button class="cl" title="Закрыть">'+ic('winClose',11)+'</button></div></div>'+
    '<div class="wbody"></div><div class="rsh"></div>';
  const o={id:'w'+Date.now()+Math.random().toString(36).slice(2,6),app,el,x,y,w,h,min:false,max:false,body:$('.wbody',el),title:A.title,data:{}};
  el.__win=o;wins.push(o);
  $('#windows').appendChild(el);
  const build=A.build;if(build)A.build(o,opts.arg);
  setTimeout(()=>el.classList.remove('op'),220);
  const t=el.querySelector('.tbar');
  t.addEventListener('mousedown',e=>{if(e.target.closest('.tbtns'))return;drag(o,e)});
  t.addEventListener('dblclick',e=>{if(!e.target.closest('.tbtns'))toggleMax(o)});
  $('.mx',el).addEventListener('mouseenter',()=>snapFly(o));
  $('.mx',el).addEventListener('click',()=>toggleMax(o));
  $('.mn',el).addEventListener('click',()=>minimize(o));
  $('.cl',el).addEventListener('click',()=>closeWin(o));
  $('.rsh',el).addEventListener('mousedown',e=>resize(o,e));
  el.addEventListener('mousedown',()=>focusWin(o),true);
  focusWin(o);
  renderTaskbar();
  return o;
}
function focusWin(o){o.el.style.zIndex=++zTop;if(focused&&focused!==o&&!focused.min){focused.el.classList.remove('focused')}focused=o;o.el.classList.add('focused');renderTaskbar()}
function closeWin(o){
  if(o.onClose)try{o.onClose()}catch(e){}
  o.el.remove();const i=wins.indexOf(o);if(i>=0)wins.splice(i,1);
  if(focused===o){focused=null;const t=wins.filter(v=>!v.min).pop();if(t)focusWin(t)}
  renderTaskbar();
}
function minimize(o){o.min=true;o.el.style.display='none';if(focused===o){focused=null;const t=wins.filter(v=>!v.min).pop();if(t)focusWin(t)}renderTaskbar()}
function restore(o){o.min=false;o.el.style.display='';focusWin(o)}
function toggleMax(o){
  if(o.max){o.max=false;o.el.classList.remove('max');o.el.style.left=o.r0.x+'px';o.el.style.top=o.r0.y+'px';o.el.style.width=o.r0.w+'px';o.el.style.height=o.r0.h+'px';$('.mx',o.el).innerHTML=ic('winMax',11)}
  else{o.r0={x:o.x,y:o.y,w:o.w,h:o.h};const a=area();o.max=true;o.el.classList.add('max');o.el.style.left='0px';o.el.style.top='0px';o.el.style.width=a.w+'px';o.el.style.height=a.h+'px';$('.mx',o.el).innerHTML=ic('winRest',11)}
}
function snapTo(o,side){
  const a=area();o.r0=o.r0||{x:o.x,y:o.y,w:o.w,h:o.h};o.max=false;o.el.classList.remove('max');
  if(side==='L'){o.x=0;o.y=0;o.w=Math.floor(a.w/2);o.h=a.h}
  else if(side==='R'){o.x=Math.floor(a.w/2);o.y=0;o.w=Math.floor(a.w/2);o.h=a.h}
  else{o.x=0;o.y=0;o.w=a.w;o.h=a.h;o.max=true;o.el.classList.add('max')}
  Object.assign(o.el.style,{left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px'});
  $('.mx',o.el).innerHTML=ic(o.max?'winRest':'winMax',11);
}
function drag(o,e){
  focusWin(o);
  const sx=e.clientX,sy=e.clientY,ox=o.x,oy=o.y,ar=area();
  let zl=null,zr=null,zt=null;
  function mv(ev){
    let nx=ox+ev.clientX-sx,ny=oy+ev.clientY-sy;
    if(o.max){const k=(ev.clientX-sx)/Math.max(1,o.r0.w);o.max=false;o.el.classList.remove('max');o.w=o.r0.w;o.h=o.r0.h;o.x=Math.min(10,Math.max(0,ox*k+(ev.clientX-sx)*0));o.y=Math.max(0,oy);nx=ev.clientX-o.w/2;ny=Math.max(0,ev.clientY-16);$('.mx',o.el).innerHTML=ic('winMax',11)}
    o.x=Math.max(-o.w+120,Math.min(ar.w-120,nx));
    o.y=Math.max(0,Math.min(ar.h-40,ny));
    o.el.style.left=o.x+'px';o.el.style.top=o.y+'px';
    zl=zr=zt=null;
    zoneOff();
    if(ev.clientY<6){zt=1;zone(2,{x:0,y:0,w:ar.w,h:ar.h})}
    else if(ev.clientX<12){zl=1;zone(0,{x:0,y:0,w:Math.floor(ar.w/2),h:ar.h})}
    else if(ev.clientX>innerWidth-12){zr=1;zone(1,{x:Math.floor(ar.w/2),y:0,w:Math.floor(ar.w/2),h:ar.h})}
  }
  function up(){
    document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    if(zt)snapTo(o,'T');else if(zl)snapTo(o,'L');else if(zr)snapTo(o,'R');
    zoneOff();
  }
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
}
function resize(o,e){
  focusWin(o);
  const sx=e.clientX,sy=e.clientY,ow=o.w,oh=o.h,ar=area();
  function mv(ev){
    o.w=Math.max(260,Math.min(ow+ev.clientX-sx,ar.w-o.x));
    o.h=Math.max(150,Math.min(oh+ev.clientY-sy,ar.h-o.y));
    o.el.style.width=o.w+'px';o.el.style.height=o.h+'px';
  }
  function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)}
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
}

const LAYOUTS=[
 {n:'Две половины',cols:2,r:[[4,1],[4,1]]},
 {n:'Половина + две четверти',cols:2,r:[[4,1],[2,1],[2,1]]},
 {n:'Две четверти + половина',cols:2,r:[[2,1],[2,1],[4,1]]},
 {n:'Четыре четверти',cols:2,r:[[2,1],[2,1],[2,1],[2,1]]},
 {n:'Три трети',cols:3,r:[[4,1],[4,1],[4,1]]},
 {n:'3/4 + 1/4 + половина',cols:2,r:[[3,1],[1,1],[4,1],[4,1]]}
];
const ZIDS=['#szL','#szR','#szT','#szB'];
function zone(i,rect){const z=$(ZIDS[i]);z.style.display='block';z.style.left=rect.x+'px';z.style.top=rect.y+'px';z.style.width=rect.w+'px';z.style.height=rect.h+'px';z.classList.add('on')}
function zoneOff(){ZIDS.forEach(id=>{const z=$(id);z.classList.remove('on');z.style.display='none'})}
function zoneRects(lay,cols){
  const kids=Array.from(lay.children).map(c=>c.getBoundingClientRect());
  if(!kids.length)return [];
  const L=Math.min.apply(null,kids.map(r=>r.left)),T=Math.min.apply(null,kids.map(r=>r.top));
  const W=Math.max.apply(null,kids.map(r=>r.right))-L,H=Math.max.apply(null,kids.map(r=>r.bottom))-T;
  const ar=area(),g=parseFloat(getComputedStyle(lay).columnGap)||3;
  const W2=W+g,H2=H+g,cellW=W2/cols,cellH=H2/4;
  return kids.map(r=>({
    x:Math.round((r.left-L)/cellW)*cellW/W2*ar.w,
    y:Math.round((r.top-T)/cellH)*cellH/H2*ar.h,
    w:(r.width+g)/W2*ar.w,
    h:(r.height+g)/H2*ar.h
  }));
}
function snapFly(o){
  const f=$('#snapfly');
  f.innerHTML=LAYOUTS.map((L,i)=>'<div class="lay" data-i="'+i+'" title="'+L.n+'" style="grid-template-rows:repeat(4,1fr);grid-template-columns:repeat('+L.cols+',1fr)">'+L.r.map(c=>'<i style="grid-row:span '+c[0]+';grid-column:span '+c[1]+'"></i>').join('')+'</div>').join('');
  $$('.lay',f).forEach((lay,i)=>{
    let hovered=0;
    const cols=LAYOUTS[i].cols;
    lay.addEventListener('mouseenter',()=>zoneRects(lay,cols).forEach((r,k)=>zone(k,r)));
    lay.addEventListener('mouseleave',zoneOff);
    Array.from(lay.children).forEach((z,k)=>z.addEventListener('mouseenter',()=>hovered=k));
    lay.addEventListener('click',()=>{
      const r=zoneRects(lay,cols)[hovered];
      o.r0=o.r0||{x:o.x,y:o.y,w:o.w,h:o.h};o.max=false;o.el.classList.remove('max');
      o.x=Math.round(r.x);o.y=Math.round(r.y);o.w=Math.round(r.w);o.h=Math.round(r.h);
      Object.assign(o.el.style,{left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px'});
      zoneOff();f.style.display='none';
    });
  });
  const r=o.el.querySelector('.mx').getBoundingClientRect();
  flyBtn=o.el.querySelector('.mx');
  f.style.cssText='display:flex;visibility:hidden;position:fixed;left:0;top:0;z-index:900;background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--stroke2);border-radius:8px;box-shadow:var(--shadow);padding:12px;gap:12px';
  const fw=f.offsetWidth,fh=f.offsetHeight;
  const left=Math.max(8,Math.min(r.right-fw,innerWidth-fw-8));
  let top=r.top-fh-6;
  if(top<8)top=Math.min(innerHeight-fh-8,r.bottom+6);
  f.style.left=left+'px';f.style.top=top+'px';f.style.visibility='visible';
  flyAutoHide();
}

  const seen=[];
  PINNED.concat(wins.map(w=>w.app)).forEach(app=>{if(seen.indexOf(app)<0)seen.push(app)});
  seen.forEach(app=>{
    const A=APPS[app];if(!A)return;
    const running=wins.filter(w=>w.app===app);
    const b=mkTbi(A.icon,24,'win-app',' '+(A.title),()=>{
      const list=wins.filter(w=>w.app===app);
      if(!list.length){createWindow(app);return}

      if(vis.length){const t=vis[vis.length-1];if(focused===t)minimize(t);else restore(t)}
      else restore(list[list.length-1]);

    if(running.length){b.classList.add('run');b.appendChild(Object.assign(document.createElement('div'),{className:'u'}));
      if(focused&&focused.app===app&&!focused.min)b.classList.add('act');
      if(running.every(w=>w.min))b.classList.add('min');

  const lum=(parseInt(hex.slice(0,2),16)*299+parseInt(hex.slice(2,4),16)*587+parseInt(hex.slice(4,6),16)*114)/1000;
  document.documentElement.style.setProperty('--accent-fg',lum>150?'#000':'#fff');

document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(e.key==='Meta'&&!e.repeat){setTimeout(()=>{if(!keyCombo)toggleStart()},30);return}
  if(e.ctrlKey&&e.altKey&&(k==='t'||k==='е')){}
  if(e.ctrlKey&&e.shiftKey&&e.key==='Escape'){e.preventDefault();createWindow('taskmgr');return}
  if(e.key==='Escape'){closeOtherPanels();$('#ctx').style.display='none';if($('#run').style.display==='flex')$('#run').style.display='none';if($('#taskview').style.display==='flex')$('#taskview').style.display='none';return}
  if(e.key==='F5'){e.preventDefault();renderIcons()}
  if(e.ctrlKey&&e.altKey&&k==='delete'){return}
  if(e.metaKey||e.ctrlKey){
    if(k==='e'){e.preventDefault();createWindow('explorer')}
    else if(k==='i'){e.preventDefault();createWindow('settings')}
    else if(k==='r'){e.preventDefault();runDlg()}
    else if(k==='d'){e.preventDefault();toggleDesk()}
    else if(k==='l'){e.preventDefault();lock()}
    else if(k==='arrowup'){e.preventDefault();focused&&focused.min?restore(focused):toggleMax(focused||wins[0])}
    else if(k==='arrowleft'&&focused){e.preventDefault();snapTo(focused,'L')}
    else if(k==='arrowright'&&focused){e.preventDefault();snapTo(focused,'R')}
    else if(k==='tab'){e.preventDefault();toggleTaskView()}
  }else if(e.altKey&&e.key==='F4'){e.preventDefault();focused?closeWin(focused):blackout('Завершение работы…')}
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='F5'){e.preventDefault()}
});

let AC=null;
const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}};
function beep(freq,dur,type,vol){
  const c=ac();if(!c)return;
  try{const o=c.createOscillator(),g=c.createGain();
    o.type=type||'square';o.frequency.value=freq||880;
    g.gain.setValueAtTime(Math.max(.001,(vol||.15)*(cfg.volume/100)),c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(dur||.3));
    o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+(dur||.3));}catch(e){}
}
const ring=()=>{for(let i=0;i<3;i++)setTimeout(()=>beep(880,.18,'square',.2),i*260)};

function savePhoto(url,cbname){
  const d=new Date(),p=photoData();
  p.unshift({id:'c'+Date.now(),n:(cbname||'Фото')+' '+p2(d.getHours())+'-'+p2(d.getMinutes())+'-'+p2(d.getSeconds())+'.jpg',u:url,d:d.toLocaleDateString('ru-RU')});
  while(p.length>24)p.pop();
  save();return p[0];
}
function weatherGen(city){
  let s=0;const nm=(city||'').toLowerCase();
  for(let i=0;i<nm.length;i++)s=(s*31+nm.charCodeAt(i))>>>0;if(!s)s=42;
  const rnd=()=>{s=(s*1664525+1013904223)>>>0;return(s>>>0)/4294967296};
  const conds=['Ясно','Солнечно','Малооблачно','Переменная облачность','Облачно','Пасмурно','Дождь','Гроза'];
  const ci=Math.floor(rnd()*6),temp=Math.round((ci*3+14)+rnd()*14-7);
  const day=d=>({t:['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][(new Date().getDay()+d)%7],c:conds[Math.floor((rnd()*conds.length))%conds.length],
    hi:temp+Math.round(rnd()*6+1),lo:temp-Math.round(rnd()*7+1)});
  return {city:city||'Москва',temp,cond:conds[ci%conds.length],feels:temp-2+Math.floor(rnd()*4),wind:Math.round(2+rnd()*9),hum:Math.round(38+rnd()*52),days:[day(0),day(1),day(2),day(3),day(4),day(5),day(6)]};
}

  pad.innerHTML=keys.flat().map(k=>'<div class="ck'+(k==='='?' eq':(k==='fn'?' fn':''))+'" data-k="'+k+'">'+k+'</div>').join('');

  const get=()=>parseFloat(val.textContent.replace(',','.'))||0;
  const show=n=>{if(!isFinite(n)){val.textContent='Деление на ноль невозможно';return}let s=String(+n.toPrecision(12));if(s.includes('e'))s=String(n);val.textContent=s.replace('.',',')};
  const calc=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?(b===0?NaN:a/b):o==='%'?a*b/100:b;
  pad.addEventListener('click',e=>{
    const b=e.target.closest('.ck');if(!b)return;
    const k=b.dataset.k,v=val.textContent.replace(',','.');
    if(/[0-9]/.test(k)){val.textContent=fresh||v==='0'?k:v+k;fresh=false;hist.textContent='';return}
    if(k===','){if(fresh){val.textContent='0,';fresh=false}else if(!val.textContent.includes(','))val.textContent+=(v.endsWith('.')?'':',')}
    else if(k==='C'){val.textContent='0';hist.textContent='';acc=null;op=null;fresh=true}
    else if(k==='CE'){val.textContent='0';fresh=true}
    else if(k==='⌫'){val.textContent=v.length>1?v.slice(0,-1):'0'}
    else if(k==='+/−'){val.textContent=String(-get())}
    else if(k==='%'){show(get()/100);fresh=true}
    else if(k==='1/x'){show(1/get());fresh=true}
    else if(k==='x²'){show(get()*get());fresh=true}
    else if(k==='√x'){show(Math.sqrt(get()));fresh=true}
    else if('+−×÷'.indexOf(k)>=0){
      if(op&&!fresh){const r=calc(acc,get(),op);show(r);acc=r}else acc=get();
      op=k;hist.textContent=String(val.textContent).replace(',','.')+' '+k;fresh=true
    }
    else if(k==='='){
      if(op){const b2=get();const r=calc(acc,b2,op);hist.textContent=acc+' '+op+' '+b2+' =';acc=r;show(r);op=null;fresh=true}
      else if(lastOp){const r=calc(get(),lastOp.b,lastOp.o);show(r)}
    }
    if('+−×÷'.indexOf(k)>=0||k==='1/x'||k==='x²')lastOp={b:get(),o:k};
  });
  o.body.querySelector('.calc-mem').addEventListener('click',e=>{
    const b=e.target.closest('b');if(!b)return;const k=b.dataset.m;
    if(k==='MC')mem=0;if(k==='MR'){show(mem)}if(k==='M+')mem+=get();if(k==='M-')mem-=get();if(k==='MS')mem=get();
  });
}},

edge:{title:'Новая вкладка — Microsoft Edge',icon:'edgeGlobe',color:'#0f6cbd',w:940,h:620,kw:'edge браузер интернет',build(o,arg){
  o.body.innerHTML='<div class="app"><div class="edge-bar"><button class="tbtn" data-b="back">'+ic('arrowL',15)+'</button><button class="tbtn" data-b="fwd">'+ic('arrowR',15)+'</button><button class="tbtn" data-b="reload">'+ic('refresh',15)+'</button>'+
   '<div class="edge-url">'+ic('lock',13)+'<input spellcheck="false" placeholder="Поиск или ввод веб-адреса"><span style="font-size:12px;color:var(--txt3)">Ctrl+D</span></div>'+

  let hist=[''],hi=0;
  const tiles=[['example.com','#0f6cbd'],['goodwin64.com','#16a34a'],['wikipedia.org','#475569'],['github.com','#111827'],
   ['youtube.com','#dc2626'],['mail.ru','#2563eb'],['weather.com','#0891b2'],['rutracker.org','#16a34a']];
  const pages={
   '':()=>'<div class="edge-hero"><h1>Microsoft Edge</h1><div>Быстрее, безопаснее, удобнее</div></div>'+
    '<div class="edge-tiles">'+tiles.map(t=>'<div class="etile" data-u="'+t[0]+'"><div class="dot" style="background:'+t[1]+'"></div>'+t[0]+'</div>').join('')+'</div>',
   'example.com':()=>'<div class="edge-page"><h1>Example Domain</h1><p>Этот домен используется в документации. Вы можете использовать его в примерах.</p>'+
    '<p><a data-u="example.com">Подробнее…</a></p></div>',
   'goodwin64.com':()=>'<div class="edge-hero" style="background:linear-gradient(135deg,#0067c0,#0a2540)"><h1>GoodWin OS</h1><div>Сборки Windows для старых и новых ПК</div></div>'+
    '<div class="edge-page"><h1>Подборка сборок Windows</h1><p>Облегчённые, игровые и полные версии под разный объём оперативной памяти.</p><p><a data-u="example.com">Скачать Windows 11 Pro 25H2</a></p></div>'
  };
  const go=(u)=>{
    u=(u||'').trim();
    if(u.indexOf('search:')===0)u=u.slice(7);
    if(!u){hist=hist.slice(0,hi+1);hist.push('');hi=hist.length-1;view.innerHTML=pages['']();st.textContent='about:newtab';url.value='';bind();return}
    if(u.indexOf('search ')>0)u=u.split('search ').slice(1).join(' ');
    const isUrl=/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(u)||u.indexOf('http')===0;
    if(!isUrl){
      hist=hist.slice(0,hi+1);hist.push(u);hi=hist.length-1;
      view.innerHTML='<div class="edge-page"><h1>Результаты поиска: '+esc(u)+'</h1><p style="color:var(--txt2)">Найдено примерно 3 240 000 результатов (0,42 сек.)</p>'+
       ['example.com — Example Domain','goodwin64.com — Сборки Windows','wikipedia.org — Энциклопедия','github.com — Хостинг'].map((r,i)=>
       '<div style="padding:10px 0;border-bottom:1px solid #8883"><a data-u="'+['example.com','goodwin64.com','wikipedia.org','github.com'][i]+'">'+r.split(' — ')[1]+'</a>'+
       '<div style="color:#0a7d32;font-size:13px">'+r.split(' — ')[0]+'</div><div style="font-size:13px;color:#555">Демонстрационная страница в браузере Windows 11…</div></div>').join('')+'</div>';
      st.textContent='Поиск: '+u;url.value=u;bind();return
    }
    hist=hist.slice(0,hi+1);hist.push(u);hi=hist.length-1;
    const f=pages[u]||pages[u.replace(/^https?:\/\//,'').split('/')[0]];
    view.innerHTML=f?f():'<div class="edge-404"><div style="font-size:56px">🙂</div><h2>Не удалось найти страницу</h2><p style="color:#666">Проверьте правильность адреса и повторите попытку.</p><div style="margin-top:14px"><button class="btn" data-u="">Вернуться на главную</button></div></div>';
    st.textContent=u;url.value=u;bind();
  };
  const bind=()=>$$('[data-u]',view).forEach(e=>e.addEventListener('click',()=>go(e.dataset.u)));
  o.body.querySelector('.edge-bar').addEventListener('click',e=>{
    const b=e.target.closest('[data-b]');if(!b)return;
    const a=b.dataset.b;
    if(a==='back'&&hi>0){hi--;go(hist[hi])}
    if(a==='fwd'&&hi<hist.length-1){hi++;go(hist[hi])}
    if(a==='reload')go(url.value||'');
    if(a==='home')go('');
    if(a==='fav')toast('star','Добавлено в избранное',url.value||'Новая вкладка');
    if(a==='menu')ctxMenu(innerWidth-260,b.getBoundingClientRect().bottom+6,[{l:'Новая вкладка',icon:'plus' in P?'plus':'x',f:()=>go('')},{l:'Избранное',icon:'star',f:()=>toast('star','Избранное','Пока пусто')},{l:'Журнал',icon:'clock',f:()=>toast('clock','Журнал',hist.filter(Boolean).join('\n')||'Пусто')},{sep:1},{l:'Печать',icon:'doc',f:()=>toast('doc','Печать','Принтер не найден')},{l:'Параметры и другое',icon:'gear',f:()=>toast('gear','Параметры','Демо-версия')}]);
  });
  url.addEventListener('keydown',e=>{if(e.key==='Enter'){o.data.url=url.value;go(url.value)}});
  o.body.querySelector('[data-b="menu"]').innerHTML=ic('gear',15);
  if(typeof arg==='object'&&arg&&arg.url)go(arg.url);else go('');
}},

clockApp:{title:'Часы',icon:'clockApp',color:'#4a9eff',w:540,h:560,kw:'часы будильник таймер секундомер',build(o){
  o.body.innerHTML='<div class="app"><div class="ck-tabs">'+[['clock','Часы','clockApp'],['world','Мировые часы','globe'],['alarm','Будильник','alarm'],['timer','Таймер','timer'],['stop','Секундомер','stopwatch']].map((t,i)=>
   '<b class="'+(i===0?'on':'')+'" data-v="'+t[0]+'">'+ic(t[2] in P?t[2]:'clockApp',14)+' '+t[1]+'</b>').join('')+'</div><div class="ck-body"></div></div>';
  const body=$('.ck-body',o.body),AL=alarmData();
  const tabs=$$('[data-v]',o.body),cur={v:'clock'};
  const drawClock=()=>{body.innerHTML='<div style="padding-top:14px"><div class="ck-big" data-now>--:--:--</div>'+
    '<div style="font-size:13px;color:var(--txt2)" data-date>—</div>'+
    '<canvas class="ck-dig" width="460" height="460"></canvas></div>';
    const cv=$('canvas',body),ctx=cv.getContext('2d');
    const tick=()=>{const d=new Date();
      $('[data-now]',body).textContent=p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
      $('[data-date]',body).textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      const cx=230,cy=230;
      ctx.clearRect(0,0,460,460);
      for(let i=0;i<60;i++){const a=i*Math.PI/30-Math.PI/2;ctx.strokeStyle='rgba(120,140,180,.4)';ctx.lineWidth=i%5?1:2.4;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*200,cy+Math.sin(a)*200);ctx.lineTo(cx+Math.cos(a)*(i%5?192:184),cy+Math.sin(a)*(i%5?192:184));ctx.stroke()}
      const hand=(ang,len,w,cl)=>{ctx.strokeStyle=cl;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ang)*len,cy+Math.sin(ang)*len);ctx.stroke()};
      hand((d.getHours()%12+d.getMinutes()/60)*Math.PI/6-Math.PI/2,110,7,'rgba(240,244,255,.9)');
      hand((d.getMinutes()+d.getSeconds()/60)*Math.PI/30-Math.PI/2,160,4,'rgba(220,228,250,.85)');
      hand((d.getSeconds()+d.getMilliseconds()/1000)*Math.PI/30-Math.PI/2,180,2,'#e8743c');
      ctx.fillStyle='#7cf';ctx.beginPath();ctx.arc(cx,cy,6,0,7);ctx.fill()};
    tick();const iv=setInterval(()=>{if(!document.body.contains(o.el))return clearInterval(iv);if(cur.v!=='clock')return;tick()},1000);
};
  const drawAlarm=()=>{
    body.innerHTML='<div style="padding-top:6px;max-width:340px;margin:0 auto">'+
     '<div style="display:flex;gap:8px"><input type="time" value="07:30" data-t="time" style="flex:1;background:var(--field);border:1px solid var(--stroke2);color:var(--txt);border-radius:5px;padding:8px;font-size:15px">'+
     '<button class="btn" data-t="add" style="background:var(--accent);color:#fff">Добавить</button></div><div data-list style="margin-top:10px;text-align:left"></div></div>';
    const list=$('[data-list]',body);
    const drawList=()=>{list.innerHTML=AL.length?AL.map((a,i)=>
      '<div class="ck-row"><span class="tm">'+a.t+'</span><span style="flex:1;color:var(--txt2);font-size:12px">'+(a.on?'Активен':'Выключен')+'</span>'+
      '<button class="tbtn" data-tgl="'+i+'">'+(a.on?'Выкл':'Вкл')+'</button><button class="tbtn" data-del2="'+i+'">'+ic('bin',15)+'</button></div>').join('')
      :'<div style="color:var(--txt3);text-align:center;padding:20px">Будильников нет</div>';
      $$('[data-tgl]',list).forEach(b=>b.addEventListener('click',()=>{AL[+b.dataset.tgl].on=!AL[+b.dataset.tgl].on;save();drawList()}));
      $$('[data-del2]',list).forEach(b=>b.addEventListener('click',()=>{AL.splice(+b.dataset.del2,1);save();drawList()}))};
    $('[data-t=add]',body).addEventListener('click',()=>{const v=$('[data-t=time]',body).value;if(!v)return;
      AL.push({t:v,on:true});AL.sort((a,b)=>a.t<b.t?-1:1);save();drawList();toast('alarm','Будильник','Установлен на '+v)});
    drawList();
    const iv=setInterval(()=>{if(!document.body.contains(o.el))return clearInterval(iv);if(cur.v!=='alarm')return;
      const now=p2(new Date().getHours())+':'+p2(new Date().getMinutes());
      AL.forEach(a=>{if(a.on&&a.t===now&&a._r!==now){a._r=now;ring();toast('alarm','Будильник','Время '+a.t+'!' )}})},1000);
  };
  const drawTimer=()=>{
    let left=300,run=0,iv=null,total=300;
    body.innerHTML='<div style="padding-top:34px"><div class="ck-big" data-tm>05:00</div>'+
     '<div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:16px"><button class="tbtn" data-m="-1">-1м</button><button class="tbtn" data-m="1">+1м</button></div>'+
     '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="btn pri" data-a="go" style="background:var(--accent);color:#fff">Пуск</button><button class="tbtn" data-a="reset">Сброс</button></div></div>';
    const tm=$('[data-tm]',body);
    const fmt=s=>p2(Math.floor(s/60))+':'+p2(s%60);
    const paint=()=>tm.textContent=fmt(left);
    $('[data-m="1"]',body).addEventListener('click',()=>{total=Math.min(9900,total+60);left=total;paint()});
    $('[data-m="-1"]',body).addEventListener('click',()=>{total=Math.max(60,total-60);left=total;paint()});
    $('[data-a=go]',body).addEventListener('click',e=>{
      if(run){clearInterval(iv);run=0;e.target.textContent='Продолжить';return}
      run=1;e.target.textContent='Пауза';
      iv=setInterval(()=>{if(cur.v!=='timer')return clearInterval(iv);
        if(left<=0){clearInterval(iv);left=total;run=0;e.target.textContent='Пуск';ring();toast('alarm','Таймер','Время вышло!');paint();return}
        left--;paint()},1000)});
    $('[data-a=reset]',body).addEventListener('click',()=>{clearInterval(iv);run=0;left=total;paint();$('[data-a=go]',body).textContent='Пуск'});
  };
  const drawStop=()=>{
    let ms=0,last=0,iv=null,run=0,laps=[];
    body.innerHTML='<div style="padding-top:34px"><div class="ck-big" data-sw>00:00.0</div>'+
     '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="btn pri" data-a="go" style="background:var(--accent);color:#fff">Старт</button><button class="tbtn" data-a="lap">Круг</button><button class="tbtn" data-a="reset">Сброс</button></div>'+
     '<div data-l style="margin:16px auto 0;max-width:260px;text-align:left"></div></div>';
    const sw=$('[data-sw]',body),go=$('[data-a=go]',body),ll=$('[data-l]',body);
    const fmt=()=>{const s=ms/1000;return p2(Math.floor(s/60))+':'+p2(Math.floor(s%60))+'.'+Math.floor(s*10%10)};
    $('[data-a=go]',body).addEventListener('click',()=>{
      if(run){clearInterval(iv);run=0;go.textContent='Продолжить';return}
      run=1;go.textContent='Пауза';last=performance.now();
      iv=setInterval(()=>{if(cur.v!=='stop')return clearInterval(iv);if(run){ms+=performance.now()-last;last=performance.now();sw.textContent=fmt()}},50)});
    $('[data-a=lap]',body).addEventListener('click',()=>{if(!run)return;laps.unshift(fmt());ll.innerHTML=laps.map((l,i)=>'<div class="ck-row"><span class="tm" style="width:auto;font-size:15px">Круг '+(i+1)+'</span><span style="flex:1;text-align:right;font-variant-numeric:tabular-nums">'+l+'</span></div>').join('')});
    $('[data-a=reset]',body).addEventListener('click',()=>{clearInterval(iv);run=0;ms=0;laps=[];ll.innerHTML='';sw.textContent='00:00.0';go.textContent='Старт'});
  };
  const drawWorld=()=>{
    const CITIES=[['Москва','Europe/Moscow'],['Санкт-Петербург','Europe/Moscow'],['Калининград','Europe/Kaliningrad'],['Екатеринбург','Asia/Yekaterinburg'],['Новосибирск','Asia/Novosibirsk'],['Владивосток','Asia/Vladivostok'],['Лондон','Europe/London'],['Париж','Europe/Paris'],['Берлин','Europe/Berlin'],['Нью-Йорк','America/New_York'],['Лос-Анджелес','America/Los_Angeles'],['Дубай','Asia/Dubai'],['Пекин','Asia/Shanghai'],['Токио','Asia/Tokyo']];
    body.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px;overflow:auto">'+CITIES.map(c=>
      '<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px"><div>'+
      '<div style="font-weight:600;font-size:13px">'+c[0]+'</div>'+
      '<div style="font-size:10.5px;color:var(--txt2);margin-top:2px">'+c[1]+'</div></div>'+
      '<div style="font-size:19px;font-weight:200;font-variant-numeric:tabular-nums" data-wc="'+c[1]+'">--:--</div></div>').join('')+'</div>';
    const f=tz=>{try{return new Intl.DateTimeFormat('ru-RU',{timeZone:tz,hour:'2-digit',minute:'2-digit'}).format(new Date())}catch(e){return '--:--'}};
    $$('[data-wc]',body).forEach(x=>x.textContent=f(x.dataset.wc));
    const iv=setInterval(()=>{if(!document.body.contains(o.el))return clearInterval(iv);if(cur.v!=='world')return;$$('[data-wc]',body).forEach(x=>x.textContent=f(x.dataset.wc))},1000);
  };
  const show=v=>{cur.v=v;tabs.forEach(t=>t.classList.toggle('on',t.dataset.v===v));
    if(v==='clock')drawClock();else if(v==='world')drawWorld();else if(v==='alarm')drawAlarm();else if(v==='timer')drawTimer();else drawStop()};
  tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.v)));
  drawClock();
}},

weatherApp:{title:'Погода',icon:'weather',color:'#2aa8c5',w:480,h:580,kw:'погода',build(o){
  o.body.innerHTML='<div class="app"><div class="appbar"><div class="tfield" style="max-width:240px">'+ic('search',14)+'<input placeholder="Город, например Москва"></div>'+
   '<button class="tbtn" data-go="1">Найти</button></div><div class="wx" data-wx style="padding:6px 22px 22px;overflow:auto;flex:1"><div style="color:var(--txt3)">Загрузка…</div></div></div>';
  const wxp=$('[data-wx]',o.body),inp=o.body.querySelector('input');
  const days=['вс','пн','вт','ср','чт','пт','сб'];
  const hotOf=c=>c>=22?'#e8743c':c>=10?'#f4b400':'#4a9eff';
  const icOf=c=>c>=24?'sun':c>=14?'cloudSun':'cloud';
  const descOf=c=>c>=24?'Ясно, жарко':c>=14?'Переменная облачность':'Облачно, прохладно';
  const render=c=>{
    const wd=new Date().getDay(),q=c/(Math.abs(c)+5)/1.4;
    const sgn=n=>Math.max(-2,Math.min(2,n));
    wxp.innerHTML='<div class="wx-fr"><span class="wx-i">'+ic(icOf(c),54)+'</span><span style="font-size:13px;color:var(--txt2)">'+esc(wxp.dataset.city)+'</span></div>'+
     '<div style="font-size:54px;font-weight:200;color:'+hotOf(c)+'">'+Math.round(c)+'°</div>'+
     '<div style="font-size:13px;margin-bottom:16px;color:var(--txt2)">'+descOf(c)+' · ощущается '+Math.round(c-1)+'°</div>'+
     '<div class="wx-grid">'+Array.from({length:7},(_,i)=>{const cc=c-sgn(Math.sin(wd+i*2.4))*3+(Math.cos((wd+i)*1.1)>0?2:-2);
      return '<div class="wx-cell"><div>'+days[(wd+i)%7]+'</div><div style="font-size:20px">'+ic(icOf(cc),20)+'</div><div style="font-weight:600">'+Math.round(cc)+'°</div></div>'}).join('')+'</div>'+
     '<div style="display:flex;justify-content:space-between;gap:10px;margin-top:16px">'+
     '<div class="wx-st">'+ic('drop',24)+'<div>Влажность</div><b>'+Math.round(40+Math.abs(q)*30)+'%</b></div>'+
     '<div class="wx-st">'+ic('wind',24)+'<div>Ветер</div><b>'+(2+Math.round(Math.abs(q*6)))+' м/с</b></div>'+
     '<div class="wx-st">'+ic('sun',24)+'<div>УФ</div><b>'+Math.round(Math.max(1,Math.min(9,Math.abs(q)*6)))+'</b></div></div>'+
     '<div style="margin-top:14px;padding:10px;border:1px solid var(--stroke);border-radius:8px;font-size:12px;color:var(--txt2)">координаты: '+wxp.dataset.coord.replace(' ',' · ')+' · источник: '+(wxp.dataset.live==='1'?'meteo-сервис (open-meteo)':'локальная симуляция')+'</div>';
  };
  const simCity=name=>{let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000};return {c:6+Math.round(rnd()*16+rnd()*6)} };
  const load=async q=>{
    q=(q||'').trim()||'Москва';
    wxp.dataset.city=q;wxp.dataset.coord='55.7558° с.ш., 37.6173° в.д.';wxp.dataset.live='0';
    wxp.innerHTML='<div style="color:var(--txt3)">Загрузка прогноза…</div>';
    const proto=typeof location!=='undefined'?location.protocol:'file:';
    if((proto==='https:'||proto==='http:')&&navigator.onLine!==false){
      try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current=temperature_2m&daily=temperature_2m_max,weather_code&timezone=auto&forecast_days=7');
        if(r.ok){const j=await r.json();if(j.current&&j.current.temperature_2m!=null){wxp.dataset.live='1';render(j.current.temperature_2m);return}}}catch(e){}} 
    render(simCity(q));
  };
  o.body.querySelector('[data-go]').addEventListener('click',()=>load(inp.value));
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')load(inp.value)});
  load('Москва');
}},
