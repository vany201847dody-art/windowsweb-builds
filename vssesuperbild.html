  APPS.qr={title:'QR-код',icon:'qr',color:'#4a9eff',w:640,h:640,kw:'qr код генератор',build(o){
    const body=o.body;port(o);
    let type='text';
    const FIELDS={text:{label:'Текст',ph:'Введите текст'},url:{label:'Ссылка',ph:'https://...'},
      phone:{label:'Телефон',ph:'+7 999...'},email:{label:'E-mail',ph:'user@example.com'},
      wifi:{label:'Wi-Fi (SSID;пароль)',ph:'MyWiFi;password'},pay:{label:'Платёж (тел;сумма)',ph:'+79991234567;1000'}};
    body.innerHTML=
      '<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;overflow:auto;flex:1">'+
        '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center" id="qr-types">'+
          Object.keys(FIELDS).map(k=>'<button class="btn'+(k===type?' pri':'')+'" data-t="'+k+'">'+
            {text:'Текст',url:'URL',phone:'Тел',email:'Email',wifi:'Wi-Fi',pay:'Платёж'}[k]+'</button>').join('')+
        '</div>'+
        '<div class="field" style="width:100%;max-width:440px">'+
          '<label id="qr-lbl">'+FIELDS[type].label+'</label>'+
          '<input class="inp" id="qr-inp" placeholder="'+FIELDS[type].ph+'">'+
        '</div>'+
        '<button class="btn pri" id="qr-gen" style="min-width:180px;justify-content:center">Сгенерировать</button>'+
        '<canvas id="qr-cv" width="300" height="300" style="border-radius:12px;background:#fff;padding:8px"></canvas>'+
        '<div class="muted" id="qr-desc" style="text-align:center;max-width:440px;word-break:break-all"></div>'+
      '</div>';
    function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
    function pseudo(seed){let s=seed;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
    function gen(){
      const val=$('#qr-inp',body).value.trim();
      if(!val){notify('Ошибка','Введите данные');return;}
      const cv=$('#qr-cv',body),ctx=cv.getContext('2d');
      const N=25,cell=cv.width/N;
      ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
      const m=Array.from({length:N},()=>Array(N).fill(0));
      const rnd=pseudo(hash(val||'win11'));
      function finder(r0,c0){
        for(let r=0;r<7;r++)for(let c=0;c<7;c++){
          const edge=(r===0||r===6||c===0||c===6);
          const inner=(r>=2&&r<=4&&c>=2&&c<=4);
          m[r0+r][c0+c]=(edge||inner)?1:0;
        }
      }
      finder(0,0);finder(0,N-7);finder(N-7,0);
      for(let i=8;i<N-8;i++){m[6][i]=i%2===0?1:0;m[i][6]=i%2===0?1:0;}
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){
        const inF=(r<9&&c<9)||(r<9&&c>N-10)||(r>N-10&&c<9);
        if(inF)continue;
        if(r===6||c===6)continue;
        m[r][c]=rnd()>0.48?1:0;
      }
      m[N-8][8]=1;
      ctx.fillStyle='#000';
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){
        if(m[r][c])ctx.fillRect(Math.round(c*cell),Math.round(r*cell),Math.ceil(cell),Math.ceil(cell));
      }
      let desc=val;
      if(type==='wifi'){const [s,p]=val.split(';');desc='Wi-Fi: '+s+' · пароль: '+(p||'—');}
      else if(type==='pay'){const [ph,sum]=val.split(';');desc='Платёж на '+ph+' · '+sum+' ₽';}
      else if(type==='phone')desc='tel:'+val.replace(/\s/g,'');
      else if(type==='email')desc='mailto:'+val;
      else if(type==='url')desc=/^https?:/.test(val)?val:'https://'+val;
      $('#qr-desc',body).textContent=desc;
      notify('QR-код','Сгенерирован');
    }
    body.addEventListener('click',e=>{
      const t=e.target.closest('[data-t]');
      if(t){type=t.dataset.t;$$('[data-t]',body).forEach(x=>x.classList.toggle('pri',x.dataset.t===type));
        $('#qr-lbl',body).textContent=FIELDS[type].label;
        $('#qr-inp',body).placeholder=FIELDS[type].ph;return;}
      if(e.target.id==='qr-gen')gen();
    });
    $('#qr-inp',body).value='Windows 11';
    setTimeout(gen,60);
  }},

        (r.blobUrl?'<audio controls src="'+r.blobUrl+'" style="width:100%;height:32px"></audio>'
                   :'<div class="muted" style="font-size:11px">Аудио недоступно после перезагрузки</div>')+
        '</div>').join('');
    }
    drawList();
    function toggleRec(){
      if(mr&&mr.state==='recording'){mr.stop();return;}
      navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
        stream=s;chunks=[];
        mr=new MediaRecorder(s);
        mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
        mr.onstop=()=>{
          const blob=new Blob(chunks,{type:'audio/webm'});
          const url=URL.createObjectURL(blob);
          const d=new Date();
          recs.unshift({name:'Запись '+(recs.length+1),date:d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),
            dur:pad2(Math.floor(sec/60))+':'+pad2(sec%60),size:(blob.size/1024).toFixed(0)+' КБ',blobUrl:url});
          LS.set('recordings_meta',recs.map(r=>({n:r.name,d:r.date,u:r.dur,s:r.size})));
          drawList();notify('Диктофон','Запись сохранена');
          if(stream)stream.getTracks().forEach(t=>t.stop());
          $('#rc-btn',body).style.animation='';
          $('#rc-hint',body).textContent='Нажмите, чтобы начать запись';
          clearInterval(iv);
        };
        mr.start();sec=0;
        $('#rc-time',body).textContent='00:00';
        $('#rc-btn',body).style.animation='pulse 1.2s infinite';
        $('#rc-hint',body).textContent='Идёт запись...';
        iv=setInterval(()=>{sec++;$('#rc-time',body).textContent=pad2(Math.floor(sec/60))+':'+pad2(sec%60);},1000);
      }).catch(()=>notify('Диктофон','Нет доступа к микрофону'));
    }
    $('#rc-btn',body).addEventListener('click',toggleRec);
    body.addEventListener('click',e=>{
      const dl=e.target.closest('[data-dl]');
      if(dl){const r=recs[+dl.dataset.dl];if(r.blobUrl){const a=document.createElement('a');a.href=r.blobUrl;a.download=r.name+'.webm';a.click();}}
      const del=e.target.closest('[data-del]');
      if(del){recs.splice(+del.dataset.del,1);LS.set('recordings_meta',recs.map(r=>({n:r.name,d:r.date,u:r.dur,s:r.size})));drawList();}
    });
    o.onClose=()=>{if(mr&&mr.state==='recording')mr.stop();if(stream)stream.getTracks().forEach(t=>t.stop());clearInterval(iv);};
    o.body.querySelector('#rc-btn').addEventListener('click',toggleRec);
  }},

  APPS.notes={title:'Заметки',icon:'notes',color:'#ff9f0a',w:820,h:580,kw:'заметки записи текст заметка',build(o){

          '<textarea class="inp" id="nt-body" placeholder="Текст заметки..." style="flex:1;border:none;border-radius:0;background:transparent;resize:none;padding:16px 20px;line-height:1.65;font-size:13.5px"></textarea>'+

            '<span class="muted" id="nt-date" style="font-size:11px"></span>'+

        '</div>'+

    function drawList(){
      $('#nt-list',body).innerHTML=notes.length?notes.map(n=>
        '<div class="si'+(n.id===cur?' on':'')+'" data-n="'+n.id+'" style="flex-direction:column;align-items:flex-start;gap:3px">'+
        '<div style="font-size:12.5px;font-weight:500;color:var(--text);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(n.title||'Без названия')+'</div>'+
        '<div style="font-size:10.5px;color:var(--text-dim2);width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc((n.body||'').slice(0,40)||'Пусто')+'</div></div>').join('')
        :'<div class="empty-note">Нет заметок</div>';
    }
    function loadNote(){
      const n=notes.find(x=>x.id===cur);
      if(!n){$('#nt-title',body).value='';$('#nt-body',body).value='';$('#nt-date',body).textContent='';return;}
      $('#nt-title',body).value=n.title;$('#nt-body',body).value=n.body;
      $('#nt-date',body).textContent='Изменено: '+(n.date||'');
    }
    function sync(){
      const n=notes.find(x=>x.id===cur);if(!n)return;
      n.title=$('#nt-title',body).value;n.body=$('#nt-body',body).value;
      n.date=new Date().toLocaleString('ru-RU');
      save();drawList();$('#nt-date',body).textContent='Изменено: '+n.date;
    }
    body.addEventListener('click',e=>{
      if(e.target.id==='nt-new'){
        const n={id:Date.now(),title:'Новая',body:'',date:new Date().toLocaleString('ru-RU')};
        notes.unshift(n);cur=n.id;save();drawList();loadNote();$('#nt-title',body).focus();
      }
      if(e.target.id==='nt-del'){
        notes=notes.filter(x=>x.id!==cur);cur=notes[0]?notes[0].id:null;
        save();drawList();loadNote();
      }
      const it=e.target.closest('[data-n]');
      if(it){cur=+it.dataset.n;drawList();loadNote();}
    });
    let t;
    ['nt-title','nt-body'].forEach(id=>$('#'+id,body).addEventListener('input',()=>{clearTimeout(t);t=setTimeout(sync,400);}));
    drawList();loadNote();
  }},

  APPS.games={title:'Игры',icon:'games',color:'#bf5af2',w:820,h:640,kw:'игры сапёр змейка 2048 память крестики нолики',build(o){
    const body=o.body;port(o);
    const GAMES=[['mines','Сапёр','M'],['snake','Змейка','S'],['g2048','2048','2'],
      ['memory','Память','P'],['ttt','Крестики-нолики','X']];
    let leave=null;
    function menu(){
      body.innerHTML=
        '<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--win-head);flex-shrink:0;flex-wrap:wrap"><h3 style="font-size:14px;font-weight:600">Игровой центр</h3></div>'+
        '<div class="gamegrid">'+GAMES.map(g=>
          '<div class="gcard" data-g="'+g[0]+'"><div class="gi">'+g[2]+'</div><div class="gn">'+g[1]+'</div></div>').join('')+'</div>';
    }
    function header(title){
      body.innerHTML='<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--win-head);flex-shrink:0;flex-wrap:wrap"><button class="btn" id="g-back">'+ic('arrowL',13)+' Назад</button>'+
        '<h3 style="font-size:14px;font-weight:600;margin-left:8px">'+title+'</h3>'+
        '<span style="flex:1"></span><span id="g-info" class="muted"></span></div>'+
        '<div id="g-area" style="padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"></div>';
      $('#g-back',body).onclick=()=>{if(leave)leave();leave=null;menu();};
    }
    body.addEventListener('click',e=>{
      const g=e.target.closest('[data-g]');
      if(g){const id=g.dataset.g;if(id==='mines')mines();else if(id==='snake')snake();else if(id==='g2048')g2048();else if(id==='memory')memory();else ttt();}
    });
    function mines(){
      header('Сапёр');
      const area=$('#g-area',body);
      const N=9,M=10;
      let board=[],open=[],flags=[],over=false,started=false;
      function init(){
        board=Array.from({length:N},()=>Array(N).fill(0));
        open=Array.from({length:N},()=>Array(N).fill(false));
        flags=Array.from({length:N},()=>Array(N).fill(false));
        over=false;started=false;render();
      }
      function place(fr,fc){
        let placed=0;
        while(placed<M){
          const r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);
          if(board[r][c]===-1)continue;
          if(Math.abs(r-fr)<=1&&Math.abs(c-fc)<=1)continue;
          board[r][c]=-1;placed++;
        }
        for(let r=0;r<N;r++)for(let c=0;c<N;c++){
          if(board[r][c]===-1)continue;
          let n=0;
          for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
            const rr=r+dr,cc=c+dc;
            if(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===-1)n++;
          }
          board[r][c]=n;
        }
      }
      function reveal(r,c){
        if(r<0||r>=N||c<0||c>=N||open[r][c]||flags[r][c])return;
        open[r][c]=true;
        if(board[r][c]===0){
          for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)reveal(r+dr,c+dc);
        }
      }
      function render(){
        const left=M-flags.flat().filter(Boolean).length;
        $('#g-info',body).textContent='Мины: '+left;
        area.innerHTML='<div class="msgrid" id="mgrid" style="grid-template-columns:repeat('+N+',1fr)"></div>'+
          '<div id="gmsg" style="font-size:16px;font-weight:600;margin-top:8px;min-height:22px"></div>'+
          '<button class="btn" id="mrst">Новая игра</button>';
        const gr=$('#mgrid',area);
        for(let r=0;r<N;r++)for(let c=0;c<N;c++){
          const d=el('div','msc');
          if(open[r][c]){
            d.classList.add('open');
            if(board[r][c]===-1){d.classList.add('mine');d.textContent='*';}
            else if(board[r][c]>0)d.textContent=board[r][c];
          } else if(flags[r][c]){d.classList.add('flag');d.textContent='!';}
          d.dataset.r=r;d.dataset.c=c;gr.appendChild(d);
        }
        $('#mrst',area).onclick=init;
      }
      area.addEventListener('click',e=>{
        const c=e.target.closest('.msc');if(!c||over)return;
        const r=+c.dataset.r,col=+c.dataset.c;
        if(!started){started=true;place(r,col);}
        if(board[r][col]===-1){
          open=open.map((row,i)=>row.map((v,j)=>v||board[i][j]===-1));
          over=true;render();
          $('#gmsg',area).innerHTML='<span style="color:#ff453a">Проиграли!</span>';
          return;
        }
        reveal(r,col);
        if(open.flat().filter(Boolean).length===N*N-M){
          over=true;render();
          $('#gmsg',area).innerHTML='<span style="color:#30d158">Победа!</span>';
          return;
        }
        render();
      });
      area.addEventListener('contextmenu',e=>{
        const c=e.target.closest('.msc');if(!c||over)return;
        e.preventDefault();
        const r=+c.dataset.r,col=+c.dataset.c;
        if(open[r][col])return;
        flags[r][col]=!flags[r][col];render();
      });
      init();
    }
    function snake(){
      header('Змейка');
      const area=$('#g-area',body);
      area.innerHTML='<canvas id="sn-cv" width="360" height="360" style="border-radius:10px;background:#111;border:1px solid var(--border)"></canvas>'+
        '<div class="muted">Стрелки / WASD</div>'+
        '<button class="btn pri" id="sn-go">Начать</button>';
      const cv=$('#sn-cv',area),ctx=cv.getContext('2d');
      const G=18,CS=20;
      let sn,dir,food,iv=null,score=0,started=false;
      function reset(){
        sn=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir={x:1,y:0};score=0;started=true;placeFood();draw();
      }
      function placeFood(){
        do{food={x:Math.floor(Math.random()*G),y:Math.floor(Math.random()*G)};}
        while(sn.some(s=>s.x===food.x&&s.y===food.y));
      }
      function draw(){
        ctx.fillStyle='#111';ctx.fillRect(0,0,360,360);
        ctx.strokeStyle='rgba(255,255,255,.04)';
        for(let i=0;i<=G;i++){ctx.beginPath();ctx.moveTo(i*CS,0);ctx.lineTo(i*CS,360);ctx.stroke();
          ctx.beginPath();ctx.moveTo(0,i*CS);ctx.lineTo(360,i*CS);ctx.stroke();}
        const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0a84ff';
        ctx.fillStyle='#ff453a';
        ctx.beginPath();ctx.arc(food.x*CS+CS/2,food.y*CS+CS/2,CS/2-2,0,Math.PI*2);ctx.fill();
        sn.forEach((s,i)=>{ctx.fillStyle=i===0?acc:'rgba(10,132,255,.55)';ctx.fillRect(s.x*CS+1,s.y*CS+1,CS-2,CS-2);});
        ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.fillText('Счёт: '+score,10,20);
      }
      function step(){
        const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
        if(h.x<0||h.x>=G||h.y<0||h.y>=G||sn.some(s=>s.x===h.x&&s.y===h.y)){
          clearInterval(iv);iv=null;
          $('#g-info',body).textContent='Игра окончена. Счёт: '+score;
          $('#sn-go',area).textContent='Заново';started=false;return;
        }
        sn.unshift(h);
        if(h.x===food.x&&h.y===food.y){score++;placeFood();}else sn.pop();
        draw();
      }
      $('#sn-go',area).onclick=()=>{
        if(!started){reset();clearInterval(iv);iv=setInterval(step,130);$('#sn-go',area).textContent='Пауза';return;}
        if(iv){clearInterval(iv);iv=null;$('#sn-go',area).textContent='Продолжить';}
        else{iv=setInterval(step,130);$('#sn-go',area).textContent='Пауза';}
      };
      function key(e){
        if(!document.body.contains(o.el))return;
        if(!started)return;
        const k=e.key.toLowerCase();
        if(['arrowup','w'].includes(k)&&dir.y===0){dir={x:0,y:-1};e.preventDefault();}
        if(['arrowdown','s'].includes(k)&&dir.y===0){dir={x:0,y:1};e.preventDefault();}
        if(['arrowleft','a'].includes(k)&&dir.x===0){dir={x:-1,y:0};e.preventDefault();}
        if(['arrowright','d'].includes(k)&&dir.x===0){dir={x:1,y:0};e.preventDefault();}
      }
      document.addEventListener('keydown',key);
      leave=()=>{clearInterval(iv);document.removeEventListener('keydown',key);};
      reset();
    }
    function g2048(){
      header('2048');
      const area=$('#g-area',body);
      let g,score=0;
      const COLORS={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',
        128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
      function init(){g=Array.from({length:4},()=>Array(4).fill(0));score=0;add();add();draw();}
      function add(){
        const empty=[];
        for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!g[r][c])empty.push([r,c]);
        if(!empty.length)return;
        const [r,c]=empty[Math.floor(Math.random()*empty.length)];
        g[r][c]=Math.random()<0.9?2:4;
      }
      function draw(){
        $('#g-info',body).textContent='Счёт: '+score;
        area.innerHTML='<div class="g2048" id="b2048"></div>'+
          '<div class="muted" style="margin-top:6px">Стрелки</div>'+
          '<button class="btn" id="g-new" style="margin-top:8px">Новая игра</button>';
        const b=$('#b2048',area);
        for(let r=0;r<4;r++)for(let c=0;c<4;c++){
          const v=g[r][c];
          const d=el('div','cell',v?String(v):'');
          if(v){d.style.background=COLORS[v]||'#3c3a32';d.style.color=v>4?'#fff':'#776e65';}
          b.appendChild(d);
        }
        $('#g-new',area).onclick=init;
      }
      function move(dr,dc){
        const before=JSON.stringify(g);
        const line=arr=>{
          const f=arr.filter(x=>x);
          for(let i=0;i<f.length-1;i++){
            if(f[i]===f[i+1]){f[i]*=2;score+=f[i];f.splice(i+1,1);}
          }
          while(f.length<4)f.push(0);
          return f;
        };
        if(dr){
          for(let c=0;c<4;c++){
            const col=[0,1,2,3].map(r=>g[r][c]);
            const ordered=dr<0?col:col.slice().reverse();
            const merged=line(ordered);
            const fin=dr<0?merged:merged.reverse();
            for(let r=0;r<4;r++)g[r][c]=fin[r];
          }
        } else {
          for(let r=0;r<4;r++){
            const row=g[r].slice();
            const ordered=dc<0?row:row.slice().reverse();
            const merged=line(ordered);
            g[r]=dc<0?merged:merged.reverse();
          }
        }
        if(JSON.stringify(g)!==before){add();draw();}
      }
      function key(e){
        if(!document.body.contains(o.el))return;
        const k=e.key;
        if(k==='ArrowUp'){move(-1,0);e.preventDefault();}
        if(k==='ArrowDown'){move(1,0);e.preventDefault();}
        if(k==='ArrowLeft'){move(0,-1);e.preventDefault();}
        if(k==='ArrowRight'){move(0,1);e.preventDefault();}
      }
      document.addEventListener('keydown',key);
      leave=()=>document.removeEventListener('keydown',key);
      init();
    }
    function memory(){
      header('Память');
      const area=$('#g-area',body);
      const ICONS=['1','2','3','4','5','6','7','8'];
      let deck=[],flipped=[],matched=0,moves=0,lock=false,startT=0,iv=null;
      function init(){
        deck=ICONS.concat(ICONS).map(v=>({v,open:false,done:false})).sort(()=>Math.random()-0.5);
        flipped=[];matched=0;moves=0;lock=false;startT=Date.now();
        clearInterval(iv);
        iv=setInterval(()=>{
          $('#g-info',body).textContent='Ходы: '+moves+' · Время: '+Math.floor((Date.now()-startT)/1000)+'с · '+matched+'/8';
        },300);
        draw();
      }
      function draw(){
        area.innerHTML='<div class="memgrid" id="mg">'+deck.map((c,i)=>
          '<div class="memc'+(c.done?' done':(c.open?' flip':''))+'" data-i="'+i+'">'+c.v+'</div>').join('')+'</div>'+
          '<button class="btn" id="mm-new" style="margin-top:12px">Новая игра</button>';
        $('#mm-new',area).onclick=init;
      }
      area.addEventListener('click',e=>{
        const c=e.target.closest('.memc');if(!c||lock)return;
        const i=+c.dataset.i;
        if(deck[i].open||deck[i].done)return;
        deck[i].open=true;flipped.push(i);draw();
        if(flipped.length===2){
          moves++;lock=true;
          const [a,b]=flipped;
          if(deck[a].v===deck[b].v){
            deck[a].done=deck[b].done=true;matched++;
            flipped=[];lock=false;draw();
            if(matched===8){clearInterval(iv);notify('Память','Победа! Ходов: '+moves);}
          } else {
            setTimeout(()=>{deck[a].open=deck[b].open=false;flipped=[];lock=false;draw();},720);
          }
        }
      });
      leave=()=>clearInterval(iv);
      init();
    }
    function ttt(){
      header('Крестики-нолики');
      const area=$('#g-area',body);
      let b,over,stats=LS.get('ttt_stats',{w:0,l:0,d:0});
      const saveStats=()=>LS.set('ttt_stats',stats);
      const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      function init(){b=Array(9).fill('');over=false;draw();}
      function winner(bd){
        for(const l of LINES){const [a,c,d]=l;if(bd[a]&&bd[a]===bd[c]&&bd[a]===bd[d])return bd[a];}
        return bd.every(x=>x)?'draw':null;
      }
      function ai(){
        const empty=b.map((v,i)=>v?null:i).filter(i=>i!==null);
        const tryWin=p=>{for(const i of empty){const t=b.slice();t[i]=p;if(winner(t)===p)return i;}return -1;};
        let m=tryWin('O');if(m>=0)return m;
        m=tryWin('X');if(m>=0)return m;
        if(b[4]==='')return 4;
        const corners=[0,2,6,8].filter(i=>b[i]==='');
        if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
        return empty[Math.floor(Math.random()*empty.length)];
      }
      function draw(){
        const w=winner(b);
        $('#g-info',body).textContent='Победы: '+stats.w+' · Поражения: '+stats.l+' · Ничьи: '+stats.d;
        area.innerHTML='<div class="ttt" id="tg">'+b.map((v,i)=>
          '<div class="tttc" data-i="'+i+'">'+v+'</div>').join('')+'</div>'+
          '<div style="font-size:16px;font-weight:600;margin-top:10px;min-height:22px" id="tmsg">'+
          (w==='X'?'<span style="color:#30d158">Победа!</span>':w==='O'?'<span style="color:#ff453a">Компьютер победил</span>':w==='draw'?'Ничья!':'Ваш ход (X)')+
          '</div><button class="btn" id="tn" style="margin-top:10px">Новая игра</button>';
        $('#tn',area).onclick=init;
      }
      area.addEventListener('click',e=>{
        const c=e.target.closest('.tttc');if(!c||over)return;
        const i=+c.dataset.i;
        if(b[i])return;
        b[i]='X';
        let w=winner(b);
        if(w){over=true;if(w==='X'){stats.w++;saveStats();}else if(w==='draw'){stats.d++;saveStats();}draw();return;}
        setTimeout(()=>{
          const m=ai();
          if(m>=0)b[m]='O';
          w=winner(b);
          if(w){over=true;if(w==='O'){stats.l++;saveStats();}else if(w==='draw'){stats.d++;saveStats();}}
          draw();
        },260);
        draw();
      });
      init();
    }
    menu();
    o.onClose=()=>{if(leave)leave();};
  }}
})();

/* регистрация перемещена: ALLAPPS/deskIcons/PINNED */
(function(){
  ['bank','qr','recorder','notes','games'].forEach(id=>{if(ALLAPPS.indexOf(id)<0)ALLAPPS.push(id)});
  deskIcons.push(
    {id:'d9',n:'NovaBank',i:'bank',app:'bank'},
    {id:'d10',n:'QR-код',i:'qr',app:'qr'},
    {id:'d11',n:'Диктофон',i:'rec',app:'recorder'},
    {id:'d12',n:'Заметки',i:'notes',app:'notes'},
    {id:'d13',n:'Игры',i:'games',app:'games'});
  if(PINNED.indexOf('bank')<0)PINNED.push('bank');
})();

document.addEventListener('mousemove',e=>{flyX=e.clientX;flyY=e.clientY;if($('#snapfly').style.display==='flex')flyAutoHide()},{passive:true});
document.addEventListener('mousedown',e=>{
  if($('#snapfly').style.display==='flex'&&!e.target.closest('#snapfly')&&!e.target.closest('.tbtns .mx'))$('#snapfly').style.display='none';
},true);
addEventListener('resize',()=>{$('#snapfly').style.display='none'});
applyCfg();renderIcons();renderTaskbar();bindStart();tick();setInterval(tick,1000);
setTimeout(()=>{
  const b=$('#boot');b.style.opacity='0';setTimeout(()=>b.remove(),700);
  $('#lock').style.display='flex';
},1500);
setTimeout(()=>{if($('#os').style.display!=='none')toast('user','Добро пожаловать, '+cfg.user,'Win + E — Проводник, Win + I — Параметры, ПКМ по фону — меню',6000)},4200);
</script>
