<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="NovaDev">
<meta name="copyright" content="© 2026 NovaDev">

<title>NovaOS v1.0</title>
<style>
:root{
  --accent:#0a84ff;
  --bg-window:#1c1c1e;
  --bg-panel:rgba(28,28,30,.75);
  --bg-desktop:#000;
  --text:#ffffff;
  --text-gray:rgba(255,255,255,.6);
  --border:rgba(255,255,255,.09);
  --shadow-sm:0 2px 8px rgba(0,0,0,.2);
  --shadow-md:0 8px 24px rgba(0,0,0,.3);
  --shadow-xl:0 24px 64px rgba(0,0,0,.4);
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --tray-h:48px;
  --wallpaper:url('https://images.unsplash.com/photo-1451177559227-676f22e9883b?w=1920&q=80');
  --icon-size:72px;
  --anim:1;
}
[data-theme="light"]{
  --bg-window:#f2f2f7;
  --bg-panel:rgba(250,250,252,.82);
  --text:#1c1c1e;
  --text-gray:rgba(0,0,0,.5);
  --border:rgba(0,0,0,.08);
  --shadow-sm:0 2px 8px rgba(0,0,0,.1);
  --shadow-md:0 8px 24px rgba(0,0,0,.15);
  --shadow-xl:0 24px 64px rgba(0,0,0,.2);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--text);user-select:none;-webkit-user-select:none}
body{background:#000}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.4);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.6)}

/* Boot Screen */
#boot{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
.boot-logo{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;width:64px;height:64px;animation:bootLogo 1.5s ease-out}
.boot-logo div{background:var(--accent);border-radius:4px;animation:bootTile 1.5s ease-out;box-shadow:0 0 12px var(--accent)}
.boot-logo div:nth-child(1){animation-delay:0s}
.boot-logo div:nth-child(2){animation-delay:.1s}
.boot-logo div:nth-child(3){animation-delay:.2s}
.boot-logo div:nth-child(4){animation-delay:.3s}
@keyframes bootLogo{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bootTile{0%{opacity:0}100%{opacity:1}}
.boot-spinner{margin-top:32px;width:32px;height:32px;border:3px solid transparent;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-text{position:absolute;bottom:60px;color:#666;font-size:14px;letter-spacing:.5px}

/* Lock Screen */
#lock{position:fixed;inset:0;background-size:cover;background-position:center;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#lock::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.3)}
.lock-clock{font-size:120px;font-weight:100;letter-spacing:-2px;text-shadow:0 4px 24px rgba(0,0,0,.5);z-index:1}
.lock-date{font-size:22px;font-weight:300;margin-top:8px;text-shadow:0 2px 12px rgba(0,0,0,.5);z-index:1}
.lock-weather{position:absolute;bottom:100px;right:60px;z-index:1;background:rgba(0,0,0,.3);backdrop-filter:blur(20px);padding:16px 24px;border-radius:14px;text-align:center}
.lock-weather .temp{font-size:36px;font-weight:600}
.lock-weather .city{font-size:14px;opacity:.8}
.lock-hint{position:absolute;bottom:60px;z-index:1;font-size:16px;opacity:.7;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.9}}

/* Desktop */
#desktop{position:fixed;inset:0;background:var(--wallpaper);background-size:cover;background-position:center;display:none;overflow:hidden}
#desktop-icons{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px;height:calc(100% - var(--tray-h) - 24px);max-width:100%}
.desk-icon{width:var(--icon-size);padding:8px 4px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:background .15s}
.desk-icon .emoji{font-size:36px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.desk-icon .label{font-size:12px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:var(--icon-size);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desk-icon:hover{background:rgba(255,255,255,.1)}
.desk-icon.selected{background:rgba(10,132,255,.3);outline:1px solid rgba(10,132,255,.6)}
.desk-icon.selected .emoji{transform:scale(1.05)}

/* Windows */
.window{position:absolute;background:var(--bg-window);border-radius:10px;box-shadow:var(--shadow-xl);border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;min-width:300px;min-height:200px;transition:opacity .22s cubic-bezier(.2,.8,.2,1),transform .22s cubic-bezier(.2,.8,.2,1)}
.window.opening{opacity:0;transform:scale(.96) translateY(8px)}
.window.minimized{display:none}
.window.maximized{border-radius:0}
.window.inactive{box-shadow:var(--shadow-md);opacity:.96}
.win-titlebar{height:36px;display:flex;align-items:center;padding:0 8px;gap:8px;background:var(--bg-panel);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);cursor:default;flex-shrink:0}
.win-titlebar .win-icon{font-size:16px}
.win-titlebar .win-title{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-btns{display:flex;gap:4px}
.win-btn{width:32px;height:28px;border:none;background:transparent;color:var(--text);border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;opacity:.6;transition:opacity .15s,background .15s}
.win-btn:hover{background:rgba(255,255,255,.1);opacity:1}
.win-btn.close:hover{background:#e81123;color:#fff}
.win-body{flex:1;overflow:auto;position:relative}
.resize-handle{position:absolute;z-index:10}
.rh-e{right:0;top:0;width:6px;height:100%;cursor:e-resize}
.rh-w{left:0;top:0;width:6px;height:100%;cursor:w-resize}
.rh-s{bottom:0;left:0;width:100%;height:6px;cursor:s-resize}
.rh-n{top:0;left:0;width:100%;height:6px;cursor:n-resize}
.rh-se{bottom:0;right:0;width:12px;height:12px;cursor:se-resize}
.rh-sw{bottom:0;left:0;width:12px;height:12px;cursor:sw-resize}
.rh-ne{top:0;right:0;width:12px;height:12px;cursor:ne-resize}
.rh-nw{top:0;left:0;width:12px;height:12px;cursor:nw-resize}

/* Taskbar */
#taskbar{position:fixed;bottom:0;left:0;right:0;height:var(--tray-h);background:var(--bg-panel);backdrop-filter:blur(40px);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 8px;gap:6px;z-index:5000}
.tb-start{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;width:32px;height:32px;padding:2px;cursor:pointer;transition:transform .15s}
.tb-start div{background:var(--accent);border-radius:3px;transition:transform .15s}
.tb-start:hover{transform:scale(1.1)}
.tb-search{height:34px;border:1px solid var(--border);border-radius:17px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:8px;padding:0 14px;width:200px;cursor:text;transition:width .2s}
.tb-search:focus-within{width:260px;border-color:var(--accent)}
.tb-search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;flex:1}
.tb-search .ico{font-size:14px;opacity:.6}
.tb-apps{display:flex;gap:4px;margin-left:8px}
.tb-app{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;position:relative;transition:background .15s}
.tb-app:hover{background:rgba(255,255,255,.08)}
.tb-app.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:16px;height:3px;background:var(--accent);border-radius:2px}
.tb-app.minimized::after{width:6px;height:3px}
.tb-tray{margin-left:auto;display:flex;align-items:center;gap:4px;height:40px;padding:0 4px}
.tb-tray .tray-ico{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:background .15s;position:relative}
.tb-tray .tray-ico:hover{background:rgba(255,255,255,.1)}
.tb-clock{padding:0 10px;height:36px;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:background .15s;font-size:12px;line-height:1.3}
.tb-clock:hover{background:rgba(255,255,255,.1)}
.tb-bell-badge{position:absolute;top:2px;right:2px;min-width:14px;height:14px;background:#e81123;border-radius:7px;font-size:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;padding:0 3px}
.tb-bell-badge.hidden{display:none}

/* Start Menu */
#start-menu{position:fixed;bottom:calc(var(--tray-h) + 8px);left:50%;transform:translateX(-50%);width:640px;max-height:560px;background:var(--bg-panel);backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-xl);z-index:6000;display:none;flex-direction:column;padding:24px;transition:transform .2s,opacity .2s}
#start-menu.show{display:flex;animation:slideUp .2s ease-out}
@keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.sm-search{height:40px;border:1px solid var(--border);border-radius:20px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;padding:0 16px;margin-bottom:16px}
.sm-search input{background:none;border:none;outline:none;color:var(--text);font-size:14px;flex:1}
.sm-search .ico{opacity:.5}
.sm-section-title{font-size:13px;font-weight:600;margin-bottom:12px;opacity:.8}
.sm-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;overflow-y:auto;flex:1}
.sm-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:10px;cursor:pointer;transition:background .15s}
.sm-item:hover{background:rgba(255,255,255,.08)}
.sm-item .emoji{font-size:32px}
.sm-item .name{font-size:11px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-power{margin-top:16px;display:flex;justify-content:flex-end;gap:8px}
.sm-power-btn{width:36px;height:36px;border-radius:8px;border:none;background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-size:18px;transition:background .15s}
.sm-power-btn:hover{background:rgba(255,255,255,.12)}

/* Flyouts */
.flyout{position:fixed;bottom:calc(var(--tray-h) + 8px);right:8px;background:var(--bg-panel);backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-xl);z-index:6000;display:none;padding:16px;min-width:280px}
.flyout.show{display:block;animation:slideUp .2s ease-out}
#flyout-cal{width:340px}
.flyout-big-time{font-size:42px;font-weight:300;margin-bottom:4px}
.flyout-date{font-size:14px;opacity:.7;margin-bottom:12px}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-nav button{background:none;border:none;color:var(--text);font-size:16px;cursor:pointer;opacity:.7}
.cal-nav span{font-size:13px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:11px;text-align:center;opacity:.5;padding:4px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:13px;cursor:pointer}
.cal-day:hover{background:rgba(255,255,255,.1)}
.cal-day.today{background:var(--accent);color:#fff;font-weight:600}
.cal-day.other-month{opacity:.3}
#flyout-vol{width:320px}
.vol-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.vol-emoji{font-size:28px}
.vol-slider{width:100%;height:6px;background:rgba(255,255,255,.15);border-radius:3px;position:relative;cursor:pointer}
.vol-fill{height:100%;background:var(--accent);border-radius:3px;width:50%}
.vol-handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#flyout-notif{width:380px;max-height:500px;display:flex;flex-direction:column}
.notif-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.notif-header h3{font-size:15px;font-weight:600}
.notif-clear{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer}
.notif-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.notif-tile{background:rgba(255,255,255,.06);border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:background .15s}
.notif-tile:hover{background:rgba(255,255,255,.1)}
.notif-tile.active{background:var(--accent);color:#fff}
.notif-tile .emoji{font-size:20px}
.notif-tile .lbl{font-size:11px}
.notif-sliders{margin-bottom:12px}
.notif-slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.notif-slider-row .emoji{font-size:16px;opacity:.7}
.notif-list{flex:1;overflow-y:auto;max-height:200px}
.notif-item{background:rgba(255,255,255,.06);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;gap:10px}
.notif-item .emoji{font-size:20px;flex-shrink:0}
.notif-item .body{flex:1}
.notif-item .title{font-size:13px;font-weight:600}
.notif-item .text{font-size:12px;opacity:.7}
.notif-item .time{font-size:10px;opacity:.5}
.notif-empty{text-align:center;opacity:.5;font-size:13px;padding:20px}

/* Context Menu */
#ctx-menu{position:fixed;background:var(--bg-panel);backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-xl);z-index:8000;padding:6px;min-width:180px;display:none}
#ctx-menu.show{display:block}
.ctx-item{padding:8px 14px;border-radius:6px;font-size:13px;cursor:pointer;transition:background .12s}
.ctx-item:hover{background:var(--accent);color:#fff}
.ctx-sep{height:1px;background:var(--border);margin:4px 8px}

/* Notifications (Toast) */
#notif-container{position:fixed;bottom:calc(var(--tray-h) + 16px);right:16px;z-index:7000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg-panel);backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-md);padding:14px 18px;display:flex;gap:12px;min-width:280px;max-width:360px;pointer-events:auto;animation:slideInRight .3s ease-out}
@keyframes slideInRight{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.hide{animation:slideOutRight .3s ease-in forwards}
@keyframes slideOutRight{to{transform:translateX(400px);opacity:0}}
.toast .emoji{font-size:22px;flex-shrink:0}
.toast .body .title{font-size:13px;font-weight:600}
.toast .body .text{font-size:12px;opacity:.7;margin-top:2px}

/* Snap Preview */
#snap-preview{position:fixed;background:rgba(10,132,255,.2);border:2px solid var(--accent);border-radius:10px;z-index:100;pointer-events:none;display:none;transition:all .15s}

/* Power Screen */
#power-screen{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .5s}
#power-screen.show{opacity:1}

/* Common App Styles */
.app-pad{padding:16px}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);font-size:13px;cursor:pointer;transition:background .15s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn-accent{background:var(--accent);border-color:var(--accent)}
.btn-accent:hover{filter:brightness(1.1)}
.btn-danger{background:#e81123;border-color:#e81123}
.input{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);font-size:13px;outline:none}
.input:focus{border-color:var(--accent)}

/* File Explorer */
.fe-root{display:flex;height:100%}
.fe-sidebar{width:200px;padding:12px 8px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.fe-sidebar-item{padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer;transition:background .12s;display:flex;gap:8px;align-items:center}
.fe-sidebar-item:hover,.fe-sidebar-item.active{background:rgba(255,255,255,.1)}
.fe-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.fe-crumb{padding:8px 16px;border-bottom:1px solid var(--border);font-size:13px;opacity:.7;display:flex;gap:6px;align-items:center}
.fe-grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;align-content:flex-start}
.fe-file{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:8px;cursor:pointer;transition:background .12s}
.fe-file:hover{background:rgba(255,255,255,.08)}
.fe-file .emoji{font-size:40px}
.fe-file .name{font-size:12px;text-align:center;word-break:break-word}

/* Notepad */
.np-root{display:flex;flex-direction:column;height:100%}
.np-menu{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--border);flex-shrink:0}
.np-menu-item{padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.np-menu-item:hover{background:rgba(255,255,255,.1)}
.np-textarea{flex:1;border:none;outline:none;resize:none;padding:16px;font-family:'Cascadia Code','Consolas','Courier New',monospace;font-size:14px;background:var(--bg-window);color:var(--text);line-height:1.6}

/* Calculator */
.calc-root{display:flex;flex-direction:column;height:100%;padding:12px}
.calc-display{flex:1;min-height:80px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:16px}
.calc-prev{font-size:14px;opacity:.6;min-height:20px}
.calc-cur{font-size:40px;font-weight:300;word-break:break-all;text-align:right}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-btn{padding:16px;border-radius:10px;border:none;font-size:18px;cursor:pointer;transition:filter .1s,background .12s;background:rgba(255,255,255,.08);color:var(--text)}
.calc-btn:hover{filter:brightness(1.2)}
.calc-btn:active{filter:brightness(.8)}
.calc-btn.op{background:rgba(10,132,255,.2);color:var(--accent)}
.calc-btn.eq{background:var(--accent);color:#fff}

/* Terminal */
.term-root{height:100%;background:#0c0c0c;color:#e0e0e0;font-family:'Cascadia Code','Consolas','Courier New',monospace;font-size:13px;padding:12px;overflow-y:auto}
.term-output{white-space:pre-wrap;line-height:1.5}
.term-input-line{display:flex;gap:4px}
.term-prompt{color:var(--accent)}
.term-input{background:none;border:none;outline:none;color:#e0e0e0;font-family:inherit;font-size:13px;flex:1}
.term-cmd{color:#fff}
.term-info{color:#5fa}
.term-err{color:#f55}

/* Browser */
.br-root{display:flex;flex-direction:column;height:100%}
.br-toolbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--border);align-items:center;flex-shrink:0}
.br-btn{width:32px;height:32px;border-radius:6px;border:none;background:transparent;color:var(--text);font-size:16px;cursor:pointer;transition:background .12s}
.br-btn:hover{background:rgba(255,255,255,.1)}
.br-url{flex:1;height:34px;border-radius:17px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--text);padding:0 16px;outline:none;font-size:13px}
.br-url:focus{border-color:var(--accent)}
.br-home{flex:1;overflow-y:auto;padding:32px;display:flex;flex-direction:column;align-items:center}
.br-logo{font-size:48px;font-weight:200;margin-bottom:24px;letter-spacing:-1px}
.br-engines{display:flex;gap:12px;margin-bottom:32px}
.br-engine{padding:12px 24px;border-radius:12px;border:1px solid var(--border);cursor:pointer;font-size:14px;transition:background .12s}
.br-engine:hover{background:rgba(255,255,255,.08)}
.br-links{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%;max-width:600px}
.br-link{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border-radius:12px;cursor:pointer;transition:background .12s}

.bank-tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.bank-tab{padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .12s}
.bank-tab.active{background:var(--accent);color:#fff}

.bank-content{flex:1;overflow-y:auto;padding:20px}

.bank-card-grad .b-bal{font-size:24px;font-weight:600;margin-bottom:8px}
.bank-card-grad .b-type{position:absolute;top:20px;right:20px;font-size:12px;opacity:.8}

/* App Store */
.as-root{display:flex;flex-direction:column;height:100%}
.as-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-shrink:0}
.as-cats{display:flex;gap:8px}
.as-cat{padding:6px 12px;border-radius:16px;font-size:12px;cursor:pointer;background:rgba(255,255,255,.06);transition:background .12s}
.as-cat.active{background:var(--accent);color:#fff}
.as-grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.as-card{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}
.as-card .emoji{font-size:36px}
.as-card .info{flex:1}
.as-card .name{font-size:14px;font-weight:600}
.as-card .desc{font-size:12px;opacity:.6}
.as-card .size{font-size:11px;opacity:.5}
.as-card .btn{font-size:12px;padding:6px 14px}

/* Clocks */
.clk-tabs{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--border)}
.clk-tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:background .12s}
.clk-tab.active{background:var(--accent);color:#fff}
.clk-analog{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px}

/* QR */
.qr-root{display:flex;flex-direction:column;height:100%;padding:16px;gap:16px;overflow-y:auto}
.qr-types{display:flex;gap:8px;flex-wrap:wrap}
.qr-type-btn{padding:8px 14px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--border);cursor:pointer;font-size:12px}

.qr-canvas-wrap{display:flex;justify-content:center}
.qr-decoded{font-size:12px;opacity:.7;text-align:center;word-break:break-all}

/* Music */
.mu-root{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;padding:24px}
.mu-cover{width:200px;height:200px;border-radius:16px;box-shadow:var(--shadow-md)}
.mu-info{text-align:center}
.mu-title{font-size:20px;font-weight:600}
.mu-artist{font-size:14px;opacity:.7}
.mu-prog{width:100%;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.mu-prog-fill{height:100%;background:var(--accent);width:30%;transition:width .3s}
.mu-times{display:flex;justify-content:space-between;width:100%;font-size:11px;opacity:.6}

.mu-btn{font-size:28px;cursor:pointer;opacity:.8}

.mu-play{font-size:40px;width:64px;height:64px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}

.mu-vis div{width:4px;background:var(--accent);border-radius:2px;animation:vis 1s ease-in-out infinite alternate}

/* Games */
.gm-tabs{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--border)}
.gm-tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:background .12s}
.gm-tab.active{background:var(--accent);color:#fff}

/* Settings */
.st-root{display:flex;height:100%}
.st-sidebar{width:220px;padding:12px 8px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.st-sb-item{padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer;transition:background .12s;display:flex;gap:8px;align-items:center}
.st-sb-item:hover,.st-sb-item.active{background:rgba(255,255,255,.1)}
.st-main{flex:1;overflow-y:auto;padding:24px}
.st-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.st-label{font-size:14px}
.st-color-pick{display:flex;gap:8px;flex-wrap:wrap}
.st-color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s}
.st-color-swatch:hover{transform:scale(1.15)}
.st-color-swatch.active{border-color:#fff}
.st-wp-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:400px}
.st-wp{width:100%;height:60px;border-radius:8px;cursor:pointer;background-size:cover;border:2px solid transparent}
.st-wp.active{border-color:var(--accent)}
.toggle{width:40px;height:22px;background:rgba(255,255,255,.2);border-radius:11px;cursor:pointer;position:relative;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s}
.toggle.on .knob{left:20px}

/* Task Manager */
.tm-root{padding:16px;height:100%;overflow-y:auto}
.tm-table{width:100%;border-collapse:collapse}
.tm-table th{text-align:left;font-size:12px;opacity:.6;padding:8px;border-bottom:1px solid var(--border)}
.tm-table td{padding:8px;font-size:13px;border-bottom:1px solid var(--border)}
.tm-kill{color:#f55;cursor:pointer;font-size:12px}

/* About */
.ab-root{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;padding:32px;text-align:center}
.ab-logo{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;width:80px;height:80px}

.ab-name{font-size:32px;font-weight:300}
.ab-ver{font-size:14px;opacity:.7}
.ab-info{font-size:13px;line-height:1.8;opacity:.8}
.ab-license{margin-top:20px;font-size:12px;opacity:.5}
.ab-rights{margin-top:16px;font-size:16px;font-weight:600}

.pt-toolbar{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--border);align-items:center;flex-shrink:0}
.pt-canvas-wrap{flex:1;overflow:hidden;position:relative;background:#fff}
.pt-canvas{position:absolute;inset:0;cursor:crosshair}

/* Weather */

.wt-now{display:flex;align-items:center;gap:20px;margin-bottom:24px}
.wt-now .temp{font-size:56px;font-weight:200}
.wt-now .icon{font-size:48px}
.wt-forecast{display:flex;gap:12px;overflow-x:auto}

/* Notes */
.nt-root{display:flex;height:100%}
.nt-sidebar{width:200px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.nt-new{margin:8px;width:calc(100% - 16px)}
.nt-list-item{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);transition:background .12s}
.nt-list-item:hover,.nt-list-item.active{background:rgba(255,255,255,.08)}
.nt-main{flex:1;overflow-y:auto;padding:16px}
.nt-title{font-size:18px;font-weight:600;border:none;outline:none;background:none;color:var(--text);width:100%;margin-bottom:12px}
.nt-body{width:100%;min-height:300px;border:none;outline:none;resize:none;background:none;color:var(--text);font-size:14px;line-height:1.6;font-family:inherit}

/* Photos */
.ph-root{padding:16px;overflow-y:auto;height:100%}
.ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* Dictaphone */
.dc-root{display:flex;flex-direction:column;height:100%;padding:24px;gap:16px;align-items:center}
.dc-btn{width:80px;height:80px;border-radius:50%;background:#e81123;color:#fff;font-size:32px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.dc-btn.recording{animation:dcPulse 1s ease-in-out infinite}
@keyframes dcPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(232,17,35,.4)}50%{transform:scale(1.05);box-shadow:0 0 0 12px rgba(232,17,35,0)}}
.dc-timer{font-size:24px;font-weight:300}
.dc-list{width:100%;flex:1;overflow-y:auto}
.dc-item{background:rgba(255,255,255,.06);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.dc-item audio{height:32px}
.dc-item .size{font-size:11px;opacity:.5}
.dc-download{cursor:pointer;font-size:18px;opacity:.7}
.dc-download:hover{opacity:1}

/* Camera */
.cam-root{display:flex;flex-direction:column;height:100%}
.cam-toolbar{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--border);align-items:center;flex-shrink:0}
.cam-vid{flex:1;position:relative;overflow:hidden;background:#000}
.cam-vid video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-vid.mirror-none video{transform:none}
.cam-corner{position:absolute;width:40px;height:40px;border-color:var(--accent);border-style:solid;border-width:0}
.cam-tl{top:10px;left:10px;border-top-width:3px;border-left-width:3px;border-top-left-radius:8px}
.cam-tr{top:10px;right:10px;border-top-width:3px;border-right-width:3px;border-top-right-radius:8px}
.cam-bl{bottom:10px;left:10px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:8px}
.cam-br{bottom:10px;right:10px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:8px}
.cam-rec{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(232,17,35,.9);color:#fff;padding:4px 12px;border-radius:12px;font-size:12px;display:none}
.cam-rec.show{display:flex;align-items:center;gap:6px}
.cam-gallery{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;max-height:120px;overflow-y:auto}
.cam-thumb{width:50px;height:50px;border-radius:6px;border:1px solid var(--border);object-fit:cover;cursor:pointer}
.cam-err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.cam-flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:5}
.cam-flash.flash{animation:flashAnim .3s}
@keyframes flashAnim{0%{opacity:.8}100%{opacity:0}}

/* Misc */
.hidden{display:none!important}
.glass{background:var(--bg-panel);backdrop-filter:blur(20px)}
.muted{opacity:.6}
.center{text-align:center}

.gap-12{gap:12px}
.gap-16{gap:16px}
.mt-8{margin-top:8px}
.mt-16{margin-top:16px}
.w-full{width:100%}
</style>

</head>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════
   NovaOS v1.0 — Core JavaScript
   ═══════════════════════════════════════════════════════ */
const OS = {
  name: 'NovaOS', version: '1.0', build: '10.0.99999', year: '2026', author: 'NovaDev',
  windows: {}, zIndex: 100, activeWindow: null,
  settings: {},
  notifications: [],
  notifTiles: {wifi:true, bt:false, airplane:false, night:false, focus:false, rec:false},
  volume: 50, brightness: 80,
  calMonth: new Date().getMonth(), calYear: new Date().getFullYear(),
};

/* ── Settings ── */
function loadSettings(){
  const d = localStorage.getItem('NovaOS_settings');
  if(d) OS.settings = JSON.parse(d);
  else OS.settings = {theme:'dark',accent:'#0a84ff',wallpaper:0,timeformat:24,seconds:true,iconsize:'normal',animations:true};
}
function saveSettings(){localStorage.setItem('NovaOS_settings',JSON.stringify(OS.settings));}
function applySettings(){
  document.documentElement.dataset.theme = OS.settings.theme;
  document.documentElement.style.setProperty('--accent',OS.settings.accent);
  const wps = [
    'https://images.unsplash.com/photo-1451177559227-676f22e9883b?w=1920&q=80',
    'https://images.unsplash.com/photo-1506744038136-46273834b3da?w=1920&q=80',
    'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1920&q=80',
    'https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?w=1920&q=80',
    'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1920&q=80',
    'https://images.unsplash.com/photo-1455218876972-8b19e6c6c7c4?w=1920&q=80',
    'https://images.unsplash.com/photo-1472214103451-9374bd1c7986?w=1920&q=80',
    'https://images.unsplash.com/photo-1447752875215-b2761d3d530c?w=1920&q=80'
  ];
  const wp = wps[OS.settings.wallpaper] || wps[0];
  document.documentElement.style.setProperty('--wallpaper',`url('${wp}')`);
  document.getElementById('desktop').style.background = `url('${wp}')`;
  const sz = OS.settings.iconsize==='large'?90:OS.settings.iconsize==='small'?56:72;
  document.documentElement.style.setProperty('--icon-size',sz+'px');
  saveSettings();
}

/* ── Time / Date ── */
function updateTime(){
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const timeStr = OS.settings.timeformat===12 ? to12h(now) : `${h}:${m}`;
  const timeFull = OS.settings.seconds ? `${h}:${m}:${s}` : `${h}:${m}`;
  document.getElementById('lock-time').textContent = timeStr;
  document.getElementById('tray-time').textContent = timeStr;
  document.getElementById('flyout-time').textContent = timeFull;
  const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const dateStr = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
  document.getElementById('lock-date').textContent = dateStr;
  document.getElementById('flyout-date').textContent = dateStr;
  document.getElementById('tray-date').textContent = `${String(now.getDate()).padStart(2,'0')}.${String(now.getMonth()+1).padStart(2,'0')}.${now.getFullYear()}`;
}
function to12h(d){
  let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');
  const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${m} ${ap}`;
}

/* ── Boot Sequence ── */
function bootSequence(){
  loadSettings();
  applySettings();
  updateTime();
  setInterval(updateTime,1000);
  renderDesktopIcons();
  renderStartMenu();
  renderTaskbarPinned();
  setTimeout(()=>{
    const boot=document.getElementById('boot');
    boot.style.opacity='0';
    setTimeout(()=>{boot.style.display='none';},400);
  },2500);
  document.getElementById('lock').addEventListener('click',()=>{

    },400);
  });
}

/* ── Desktop Icons ── */

        {label:'Обновить',action:()=>renderDesktopIcons()},
        {label:'Параметры',action:()=>openApp('settings')},
        {sep:true},
        {label:'Сменить обои',action:()=>openApp('settings')}

/* ── Taskbar ── */
function renderTaskbarPinned(){
  const c=document.getElementById('tb-pinned');c.innerHTML='';
  PINNED_APPS.forEach(id=>{
    const app=APPS.find(a=>a.id===id);
    const d=document.createElement('div');d.className='tb-app';d.dataset.app=id;d.title=app.name;
    d.innerHTML=app.icon;
    d.addEventListener('click',e=>{
      e.stopPropagation();
      const w=findWindowByApp(id);
      if(w){if(w===OS.activeWindow)minimizeWindow(w.id);else{unminimizeWindow(w.id);focusWindow(w.id);}}
      else openApp(id);
    });
    d.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();
      const w=findWindowByApp(id);
      const items=[];
      if(w){items.push({label:'Свернуть',action:()=>minimizeWindow(w.id)});
        items.push({label:'Развернуть',action:()=>{unminimizeWindow(w.id);focusWindow(w.id);}});
        items.push({sep:true});
        items.push({label:'Закрыть',action:()=>closeWindow(w.id)});}
      else items.push({label:'Открыть',action:()=>openApp(id)});
      showContextMenu(e.clientX,e.clientY,items);
    });
    c.appendChild(d);
  });
}
function updateTaskbarRunning(){
  const c=document.getElementById('tb-running');c.innerHTML='';
  Object.keys(OS.windows).forEach(wid=>{
    const w=OS.windows[wid];
    if(PINNED_APPS.includes(w.appId)){
      const p=document.querySelector(`.tb-pinned .tb-app[data-app="${w.appId}"]`);
      if(p){
        if(w.minimized)p.classList.add('minimized'),p.classList.remove('active');
        else if(OS.activeWindow===w.id)p.classList.add('active'),p.classList.remove('minimized');
        else p.classList.remove('active','minimized');
        return;
      }
    }
    const app=APPS.find(a=>a.id===w.appId);
    const d=document.createElement('div');d.className='tb-app';d.dataset.app=w.appId;d.title=app.name;
    d.innerHTML=app.icon;
    if(w.minimized)d.classList.add('minimized');
    else if(OS.activeWindow===w.id)d.classList.add('active');
    d.addEventListener('click',e=>{e.stopPropagation();
      if(w.minimized){unminimizeWindow(wid);focusWindow(wid);}
      else if(OS.activeWindow===wid)minimizeWindow(wid);
      else focusWindow(wid);
    });
    d.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();
      showContextMenu(e.clientX,e.clientY,[
        {label:'Свернуть',action:()=>minimizeWindow(wid)},
        {label:'Развернуть',action:()=>{unminimizeWindow(wid);focusWindow(wid);}},
        {sep:true},
        {label:'Закрыть',action:()=>closeWindow(wid)}
      ]);
    });
    c.appendChild(d);
  });
}

/* Calendar */
function renderCalendar(){
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  document.getElementById('cal-month').textContent=`${months[OS.calMonth]} ${OS.calYear}`;
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d=>{const e=document.createElement('div');e.className='cal-dow';e.textContent=d;grid.appendChild(e);});
  const first=new Date(OS.calYear,OS.calMonth,1);
  let startDow=(first.getDay()+6)%7;
  const daysInM=new Date(OS.calYear,OS.calMonth+1,0).getDate();
  const prevDays=new Date(OS.calYear,OS.calMonth,0).getDate();
  const today=new Date();
  for(let i=0;i<startDow;i++){const d=document.createElement('div');d.className='cal-day other-month';d.textContent=prevDays-startDow+i+1;grid.appendChild(d);}
  for(let i=1;i<=daysInM;i++){
    const d=document.createElement('div');d.className='cal-day';d.textContent=i;
    if(today.getDate()===i&&today.getMonth()===OS.calMonth&&today.getFullYear()===OS.calYear)d.classList.add('today');
    grid.appendChild(d);
  }
  const total=startDow+daysInM;
  const remain=(7-total%7)%7;
  for(let i=1;i<=remain;i++){const d=document.createElement('div');d.className='cal-day other-month';d.textContent=i;grid.appendChild(d);}
}
document.getElementById('cal-prev').addEventListener('click',e=>{e.stopPropagation();OS.calMonth--;if(OS.calMonth<0){OS.calMonth=11;OS.calYear--;}renderCalendar();});
document.getElementById('cal-next').addEventListener('click',e=>{e.stopPropagation();OS.calMonth++;if(OS.calMonth>11){OS.calMonth=0;OS.calYear++;}renderCalendar();});

/* Volume */
function setupVolSlider(sliderEl,fillEl,handleEl,val,cb){
  function setVal(e){
    const r=sliderEl.getBoundingClientRect();
    let p=(e.clientX-r.left)/r.width;p=Math.max(0,Math.min(1,p));
    val=Math.round(p*100);
    fillEl.style.width=val+'%';handleEl.style.left=val+'%';
    cb(val);
  }
  let dragging=false;
  sliderEl.addEventListener('mousedown',e=>{dragging=true;setVal(e);});
  document.addEventListener('mousemove',e=>{if(dragging)setVal(e);});
  document.addEventListener('mouseup',()=>dragging=false);
}
setupVolSlider(document.getElementById('vol-slider'),document.getElementById('vol-fill'),document.getElementById('vol-handle'),OS.volume,(v)=>{
  OS.volume=v;document.getElementById('vol-pct').textContent=v+'%';
  const em=document.getElementById('vol-emoji');
  em.textContent=v===0?'🔇':v<34?'🔉':'🔊';
});
setupVolSlider(document.getElementById('notif-vol-slider'),document.getElementById('notif-vol-fill'),document.getElementById('notif-vol-handle'),OS.volume,(v)=>{
  OS.volume=v;document.getElementById('vol-pct').textContent=v+'%';
  const em=document.getElementById('vol-emoji');em.textContent=v===0?'🔇':v<34?'🔉':'🔊';
});
setupVolSlider(document.getElementById('notif-bright-slider'),document.getElementById('notif-bright-fill'),document.getElementById('notif-bright-handle'),OS.brightness,(v)=>{

/* ── Notifications ── */
function showNotification(title,text,icon='ℹ️'){
  icon=String(icon);if(icon.length>2)icon='ℹ️';
  const n={title,text,icon,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})};
  OS.notifications.unshift(n);if(OS.notifications.length>20)OS.notifications.pop();
  updateBellBadge();renderNotifList();
  const c=document.getElementById('notif-container');
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span class="emoji">${icon}</span><div class="body"><div class="title">${title}</div><div class="text">${text}</div></div>`;
  c.appendChild(t);
  setTimeout(()=>{t.classList.add('hide');setTimeout(()=>t.remove(),300);},4500);
}
function updateBellBadge(){
  const b=document.getElementById('bell-badge');
  if(OS.notifications.length>0){b.textContent=OS.notifications.length;b.classList.remove('hidden');}
  else b.classList.add('hidden');
}

  const l=document.getElementById('notif-list');
  if(OS.notifications.length===0){l.innerHTML='<div class="notif-empty">Нет новых уведомлений</div>';return;}
  l.innerHTML='';

    const d=document.createElement('div');d.className='notif-item';
    d.innerHTML=`<div class="emoji">${n.icon}</div><div class="body"><div class="title">${n.title}</div><div class="text">${n.text}</div><div class="time">${n.time}</div></div>`;

/* ── Window Manager ── */
function openApp(appId){
  const app=APPS.find(a=>a.id===appId);
  if(!app)return;
  const existing=findWindowByApp(appId);
  if(existing){unminimizeWindow(existing.id);focusWindow(existing.id);return;}
  const wid='win_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
  const wc=document.getElementById('windows-container');
  const w=document.createElement('div');w.className='window opening';w.id=wid;
  const winW=Math.min(840,window.innerWidth-100);
  const winH=Math.min(560,window.innerHeight-80);
  w.style.width=winW+'px';w.style.height=winH+'px';
  w.style.left=Math.max(20,(window.innerWidth-winW)/2+Math.random()*60-30)+'px';
  w.style.top=Math.max(10,(window.innerHeight-winH)/2-30+Math.random()*40-20)+'px';
  w.style.zIndex=++OS.zIndex;
  w.innerHTML=`
    <div class="win-titlebar" data-drag>
      <span class="win-icon">${app.icon}</span>
      <span class="win-title">${app.name}</span>
      <div class="win-btns">
        <button class="win-btn min" title="Свернуть">—</button>
        <button class="win-btn max" title="Развернуть">▢</button>
        <button class="win-btn close" title="Закрыть">✕</button>
      </div>
    </div>
    <div class="win-body" id="${wid}_body"></div>
    <div class="resize-handle rh-e"></div><div class="resize-handle rh-w"></div>
    <div class="resize-handle rh-s"></div><div class="resize-handle rh-n"></div>
    <div class="resize-handle rh-se"></div><div class="resize-handle rh-sw"></div>
    <div class="resize-handle rh-ne"></div><div class="resize-handle rh-nw"></div>
  `;
  wc.appendChild(w);
  const winObj={id:wid,appId,w,el:w,title:app.name,icon:app.icon,minimized:false,maximized:false,prevRect:null};
  OS.windows[wid]=winObj;
  const body=document.getElementById(wid+'_body');
  if(app.content)app.content(body,wid);
  w.querySelector('.win-btn.min').addEventListener('click',e=>{e.stopPropagation();minimizeWindow(wid);});
  w.querySelector('.win-btn.max').addEventListener('click',e=>{e.stopPropagation();toggleMaximize(wid);});
  w.querySelector('.win-btn.close').addEventListener('click',e=>{e.stopPropagation();closeWindow(wid);});
  w.addEventListener('mousedown',()=>focusWindow(wid));
  setupDrag(w);
  setupResize(w);
  setTimeout(()=>w.classList.remove('opening'),250);
  focusWindow(wid);
  updateTaskbarRunning();
}
function findWindowByApp(appId){return Object.values(OS.windows).find(w=>w.appId===appId&&w.w);}
function focusWindow(wid){
  const w=OS.windows[wid];if(!w)return;
  if(w.minimized)unminimizeWindow(wid);
  OS.activeWindow=wid;
  w.el.style.zIndex=++OS.zIndex;
  Object.values(OS.windows).forEach(o=>{o.el.classList.toggle('inactive',o.id!==wid);});
  updateTaskbarRunning();
}
function closeWindow(wid){
  const w=OS.windows[wid];if(!w)return;
  w.el.classList.add('opening');
  setTimeout(()=>{
    w.el.remove();delete OS.windows[wid];
    if(OS.activeWindow===wid)OS.activeWindow=null;
    updateTaskbarRunning();
  },220);
}
function minimizeWindow(wid){
  const w=OS.windows[wid];if(!w)return;
  w.el.classList.add('minimized');w.minimized=true;
  if(OS.activeWindow===wid){OS.activeWindow=null;Object.values(OS.windows).forEach(o=>{if(!o.minimized){focusWindow(o.id);}});}
  updateTaskbarRunning();
}
function unminimizeWindow(wid){
  const w=OS.windows[wid];if(!w)return;
  w.el.classList.remove('minimized');w.minimized=false;
  updateTaskbarRunning();
}
function toggleMaximize(wid){
  const w=OS.windows[wid];if(!w)return;
  if(w.maximized){
    const r=w.prevRect;
    w.el.style.left=r.left+'px';w.el.style.top=r.top+'px';w.el.style.width=r.width+'px';w.el.style.height=r.height+'px';
    w.el.classList.remove('maximized');w.maximized=false;
  } else {
    w.prevRect={left:parseInt(w.el.style.left),top:parseInt(w.el.style.top),width:parseInt(w.el.style.width),height:parseInt(w.el.style.height)};
    w.el.style.left='0';w.el.style.top='0';w.el.style.width='100%';w.el.style.height='calc(100% - var(--tray-h))';
    w.el.classList.add('maximized');w.maximized=true;
  }
}
function setupDrag(w){
  const tb=w.querySelector('.win-titlebar');
  let dx=0,dy=0,dragging=false,snapping=false;
  tb.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('win-btn'))return;
    const win=OS.windows[w.id];if(win.maximized)return;
    dragging=true;
    dx=e.clientX-parseInt(w.style.left);
    dy=e.clientY-parseInt(w.style.top);
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;
    let nx=e.clientX-dx,ny=e.clientY-dy;
    w.style.left=nx+'px';w.style.top=ny+'px';
    const sp=document.getElementById('snap-preview');
    if(e.clientY<=4){sp.style.display='block';sp.style.left='0';sp.style.top='0';sp.style.width='100%';sp.style.height='calc(100% - var(--tray-h))';snapping='max';}
    else if(e.clientX<=4){sp.style.display='block';sp.style.left='0';sp.style.top='0';sp.style.width='50%';sp.style.height='calc(100% - var(--tray-h))';snapping='left';}
    else if(e.clientX>=window.innerWidth-4){sp.style.display='block';sp.style.left='50%';sp.style.top='0';sp.style.width='50%';sp.style.height='calc(100% - var(--tray-h))';snapping='right';}
    else{sp.style.display='none';snapping=false;}
  });
  document.addEventListener('mouseup',e=>{
    if(!dragging)return;
    dragging=false;
    const sp=document.getElementById('snap-preview');
    sp.style.display='none';
    if(snapping==='max')toggleMaximize(w.id);
    else if(snapping==='left'){
      w.style.left='0';w.style.top='0';w.style.width='50%';w.style.height='calc(100% - var(--tray-h))';
    } else if(snapping==='right'){
      w.style.left='50%';w.style.top='0';w.style.width='50%';w.style.height='calc(100% - var(--tray-h))';
    }
    snapping=false;
  });
}
function setupResize(w){
  w.querySelectorAll('.resize-handle').forEach(h=>{
    h.addEventListener('mousedown',e=>{
      e.preventDefault();e.stopPropagation();
      const win=OS.windows[w.id];if(win.maximized)return;
      const dir=h.className.replace('resize-handle rh-','');
      const sx=e.clientX,sy=e.clientY;
      const sw=parseInt(w.style.width),sh=parseInt(w.style.height);
      const sl=parseInt(w.style.left),st=parseInt(w.style.top);
      const r=h=>{
        let nw=sw,nh=sh,nl=sl,nt=st;
        if(dir.includes('e'))nw=Math.max(300,sw+(r.clientX-sx));
        if(dir.includes('s'))nh=Math.max(200,sh+(r.clientY-sy));
        if(dir.includes('w')){nw=Math.max(300,sw-(r.clientX-sx));nl=sl+(sw-nw);}
        if(dir.includes('n')){nh=Math.max(200,sh-(r.clientY-sy));nt=st+(sh-nh);}
        w.style.width=nw+'px';w.style.height=nh+'px';w.style.left=nl+'px';w.style.top=nt+'px';
      };
      const u=()=>document.removeEventListener('mousemove',r);
      document.addEventListener('mousemove',r);
      document.addEventListener('mouseup',u,{once:true});
    });
  });
}

/* Calculator */
function appCalculator(body,wid){
  body.innerHTML=`<div class="calc-root">
    <div class="calc-display"><div class="calc-prev" id="${wid}_prev"></div><div class="calc-cur" id="${wid}_cur">0</div></div>
    <div class="calc-grid" id="${wid}_grid"></div>
  </div>`;
  let cur='0',prev='',op=null,reset=false;
  const curEl=body.querySelector(`#${wid}_cur`),prevEl=body.querySelector(`#${wid}_prev`);
  const keys=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','←','='];
  const grid=body.querySelector(`#${wid}_grid`);
  keys.forEach(k=>{
    const b=document.createElement('button');b.className='calc-btn';b.textContent=k;
    if('÷×−+'.includes(k))b.classList.add('op');
    if(k==='=')b.classList.add('eq');
    b.addEventListener('click',()=>calc(k));
    grid.appendChild(b);
  });
  function update(){curEl.textContent=cur;prevEl.textContent=prev+(op?' '+op:'');}
  function calc(k){
    if(k==='C'){cur='0';prev='';op=null;reset=false;update();return;}
    if(k==='←'){cur=cur.length>1?cur.slice(0,-1):'0';update();return;}
    if(k==='±'){cur=String(-parseFloat(cur));update();return;}
    if(k==='%'){cur=String(parseFloat(cur)/100);update();return;}
    if('÷×−+'.includes(k)){
      if(op&&!reset){const r=compute();cur=String(r);prev=cur;}
      else prev=cur;
      op=k;reset=true;update();return;
    }
    if(k==='='){
      if(op){const r=compute();prev=cur+' '+op+' '+cur;cur=String(r);op=null;reset=true;update();prevEl.textContent=prev+' =';prev='';return;}
      return;
    }
    if(k==='.'){if(!cur.includes('.'))cur+='.';update();return;}
    if(reset){cur=k;reset=false;}else{cur=cur==='0'?k:cur+k;}
    update();
  }
  function compute(){
    const a=parseFloat(prev),b=parseFloat(cur);
    switch(op){case'+':return a+b;case'−':return a-b;case'×':return a*b;case'÷':return b===0?'Error':a/b;}return cur;
  }
}

/* Terminal */
function appTerminal(body,wid){
  body.innerHTML=`<div class="term-root" id="${wid}_term"><div class="term-output" id="${wid}_out">NovaOS Terminal [Версия 1.0.99999]\n(c) 2026 NovaDev. Все права защищены.\n\nВведите "help" для списка команд.\n\n</div></div>`;
  const out=body.querySelector(`#${wid}_out`);
  const term=body.querySelector(`#${wid}_term`);
  let history=[],hi=0;
  function addInputLine(){
    const line=document.createElement('div');line.className='term-input-line';
    line.innerHTML='<span class="term-prompt">C:\\Users\\User></span><input class="term-input" autofocus>';
    out.appendChild(line);
    const inp=line.querySelector('input');
    inp.focus();term.scrollTop=term.scrollHeight;
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        const cmd=inp.value;inp.remove();
        const cmdSpan=document.createElement('span');cmdSpan.className='term-cmd';cmdSpan.textContent=' '+cmd;
        line.appendChild(cmdSpan);
        line.appendChild(document.createElement('br'));
        history.push(cmd);hi=history.length;
        exec(cmd);
        addInputLine();
      } else if(e.key==='ArrowUp'&&hi>0){hi--;inp.value=history[hi]||'';e.preventDefault();}
      else if(e.key==='ArrowDown'){hi++;inp.value=history[hi]||'';if(hi>=history.length)inp.value='';e.preventDefault();}
    });
  }
  function print(html){const d=document.createElement('div');d.innerHTML=html;out.appendChild(d);term.scrollTop=term.scrollHeight;}
  addInputLine();
  function exec(cmd){
    const args=cmd.trim().split(/\s+/);const c=args[0].toLowerCase();
    const cmds={
      'help':()=>print('<span class="term-info">Доступные команды: help ver dir cls date time echo whoami hostname ipconfig ping tasklist kill tree банк настройки камера часы qr exit shutdown restart</span>'),
      'ver':()=>print('NovaOS [Версия 1.0.99999]'),
      'dir':()=>print('Том в устройстве C не имеет метки.\nСодержимое папки C:\\Users\\User\n\n< 26.09.2026  14:32 >    &lt;DIR&gt;          Documents\n< 26.09.2026  09:15 >            4,096 index.html\n< 27.09.2026  11:00 >    &lt;DIR&gt;          Downloads'),
      'cls':()=>{out.innerHTML='';},
      'date':()=>print('Текущая дата: '+new Date().toLocaleDateString('ru-RU')),
      'time':()=>print('Текущее время: '+new Date().toLocaleTimeString('ru-RU')),
      'echo':()=>print(args.slice(1).join(' ')||''),
      'whoami':()=>print('novaos\\user'),
      'hostname':()=>print('NOVAOS-PC'),
      'ipconfig':()=>print('Настройка IP для Windows\n\nEthernet adapter Ethernet:\nIPv4-адрес. . . . . . . . . . . . : 192.168.1.42\nМаска подсети . . . . . . . . . . : 255.255.255.0\nОсновной шлюз. . . . . . . . . . . : 192.168.1.1'),
      'ping':()=>{const host=args[1]||'localhost';print(`Обмен с ${host} (127.0.0.1) пакетами по 32 байт:\nОтвет от 127.0.0.1: число байт=32 время=1мс TTL=128\nОтвет от 127.0.0.1: число байт=32 время<1мс TTL=128`),
    },
      'tasklist':()=>{let s='Имя PID ЦП ОЗУ\n';Object.values(OS.windows).forEach(w=>{s+=`${APPS.find(a=>a.id===w.appId)?.name||'?'} 1${Math.floor(Math.random()*900+100)} ${Math.floor(Math.random()*30)}% ${Math.floor(Math.random()*200+50)}МБ\n`});print(s)},
      'kill':()=>{const w=Object.values(OS.windows)[0];if(w){closeWindow(w.id);print('Процесс завершён');}else print('Нет процессов');},
      'tree':()=>print('C:.\n├── Documents\n├── Downloads\n└── Pictures'),
      'банк':()=>{openApp('bank');print('Открытие NovaBank...');},
      'настройки':()=>{openApp('settings');print('Открытие Параметры...');},
      'камера':()=>{openApp('camera');print('Открытие Камера...');},
      'часы':()=>{openApp('clock');print('Открытие Часы...');},
      'qr':()=>{openApp('qr');print('Открытие QR-код...');},
      'exit':()=>{const w=Object.values(OS.windows).find(x=>x.appId==='terminal');if(w)closeWindow(w.id);},
      'shutdown':()=>{powerShutdown();},
      'restart':()=>{powerRestart();},
    };
    if(cmds[c])cmds[c]();
    else if(c)print(`'${c}' не является командой. Введите 'help'.`);
  }
  term.addEventListener('click',()=>{const l=out.lastChild;const inp=l?.querySelector('input');if(inp)inp.focus();});
}

      tc.innerHTML='<h4 style="margin-bottom:12px">Оплата ЖКХ</h4>';
      services.forEach(s=>{
        const d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(255,255,255,.06);border-radius:8px;margin-bottom:8px';

      tc.innerHTML=`<h4 style="margin-bottom:12px">Автоплатежи</h4>

      body.querySelector(`#${wid}_apcreate`).addEventListener('click',()=>{
        bank.autopays.push({name:body.querySelector(`#${wid}_apname`).value,amt:parseInt(body.querySelector(`#${wid}_apamt`).value),period:parseInt(body.querySelector(`#${wid}_apperiod`).value)});
        save();renderTab(9);showNotification('Автоплатеж','Создан','🔄');
      });
      bank.autopays.forEach((a,i)=>{body.querySelector(`#${wid}_aplist`).innerHTML+=`<div style="background:rgba(255,255,255,.06);padding:12px;border-radius:8px;margin-bottom:8px">${a.name}: ${a.amt}₽ каждые ${a.period} дн.</div>`;});
    }
    else if(idx===10){ // Контакты
      tc.innerHTML=`<h4 style="margin-bottom:12px">Контакты</h4>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <input class="input" id="${wid}_cn" placeholder="Имя" style="flex:1">
