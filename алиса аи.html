          <button class="btn btn-accent" id="${wid}_ca_dd">Добавить</button>
        </div><div id="${wid}_clist"></div>`;
      body.querySelector(`#${wid}_ca_dd`).addEventListener('click',()=>{
        bank.contacts.push({name:body.querySelector(`#${wid}_cn`).value,acc:body.querySelector(`#${wid}_ca`).value});save();renderTab(10);
      });
      bank.contacts.forEach((c,i)=>{
        const d=document.createElement('div');d.style.cssText='background:rgba(255,255,255,.06);padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center';
        d.innerHTML=`<span>${c.name} (${c.acc})</span>`;
        const b=document.createElement('button');b.className='btn';b.textContent='Перевести';
        b.addEventListener('click',()=>{const amt=parseInt(prompt('Сумма перевода:', '1000'));if(amt&&amt<=bank.cards[0].balance){bank.cards[0].balance-=amt;bank.history.unshift({t:'Перевод → '+c.name,amt,dt:new Date().toISOString(),type:'out'});save();renderTab(0);showNotification('Перевод','Готово','✅');}});
        const dBtn=document.createElement('button');dBtn.className='btn btn-danger';dBtn.textContent='✕';dBtn.style.marginLeft='8px';
        dBtn.addEventListener('click',()=>{bank.contacts.splice(i,1);save();renderTab(10);});
        d.appendChild(b);d.appendChild(dBtn);body.querySelector(`#${wid}_clist`).appendChild(d);
      });
    }
    else if(idx===11){ // История
      tc.innerHTML=`<h4 style="margin-bottom:12px">История операций</h4>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="btn" onclick="OS._bankHist('${wid}','all')">Все</button>
          <button class="btn" onclick="OS._bankHist('${wid}','in')">Поступления</button>
          <button class="btn" onclick="OS._bankHist('${wid}','out')">Списания</button>
        </div><div id="${wid}_hlist"></div>`;
      OS._bankHist(wid,'all');
    }
  }
  OS._bank=function(wid,i,act){
    if(act==='new'){bank.cards.push({id:Date.now(),type:'Visa',num:String(Math.floor(Math.random()*9000+1000)),balance:0,active:true,limit:300000});save();renderTab(1);showNotification('Карта','Выпущена','💳');}
    else if(act==='block'){bank.cards[i].active=!bank.cards[i].active;save();renderTab(1);}
    else if(act==='pin'){const np=prompt('Новый PIN (4 цифры):');if(np&&np.length===4){bank.pin=np;save();showNotification('PIN','Изменён','🔑');}}
  };
  OS._bankSav=function(wid,i,act){
    if(act==='add'){const a=parseInt(prompt('Сумма пополнения:','1000'));if(a&&a<=bank.cards[0].balance){bank.cards[0].balance-=a;bank.savings[i].balance+=a;save();renderTab(4);showNotification('Копилка','Пополнена','🐷');}}
    else if(act==='close'){bank.cards[0].balance+=bank.savings[i].balance;bank.savings.splice(i,1);save();renderTab(4);showNotification('Копилка','Закрыта','✅');}
  };
  OS._bankDep=function(wid,m,r){const a=parseInt(document.getElementById(wid+'_dep'+m).value);if(a&&a<=bank.cards[0].balance){bank.cards[0].balance-=a;const end=new Date();end.setMonth(end.getMonth()+m);bank.deposits.push({amount:a,rate:r,months:m,endDate:end.toLocaleDateString('ru')});save();renderTab(5);showNotification('Вклад','Открыт','💰');}};
  OS._bankHist=function(wid,filter){
    const list=document.getElementById(wid+'_hlist');
    const filtered=filter==='all'?bank.history:bank.history.filter(h=>h.type===filter);
    list.innerHTML=filtered.length?filtered.map(h=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>${h.t}</span><span style="color:${h.type==='in'?'#4caf50':'#f44336'}">${h.type==='in'?'+':'−'}${h.amt} ₽</span></div>`).join(''):'<p class="muted">Нет операций</p>';
  };
}

/* App Store */
function appStore(body,wid){
  const storeApps=[
    {n:'SnakeX',i:'🐍',cat:'Игры',sz:'12 МБ',desc:'Классическая змейка'},
    {n:'CodeEdit',i:'💻',cat:'Продуктивность',sz:'45 МБ',desc:'Редактор кода'},
    {n:'ArtStudio',i:'🎨',cat:'Медиа',sz:'80 МБ',desc:'Графический редактор'},
    {n:'VidPlayer',i:'🎬',cat:'Медиа',sz:'35 МБ',desc:'Видеоплеер'},
    {n:'TaskList',i:'✅',cat:'Продуктивность',sz:'8 МБ',desc:'Менеджер задач'},
    {n:'Chess',i:'♟️',cat:'Игры',sz:'20 МБ',desc:'Шахматы онлайн'},
    {n:'MusicHub',i:'🎶',cat:'Медиа',sz:'55 МБ',desc:'Музыкальный плеер'},
    {n:'DiskClean',i:'🧹',cat:'Утилиты',sz:'5 МБ',desc:'Очистка диска'},
    {n:'WeatherPro',i:'🌦️',cat:'Утилиты',sz:'15 МБ',desc:'Детальный прогноз'},
    {n:'Calendar+',i:'📅',cat:'Продуктивность',sz:'18 МБ',desc:'Умный календарь'},
    {n:'FileZip',i:'📦',cat:'Утилиты',sz:'10 МБ',desc:'Архиватор файлов'},
    {n:'Puzzle',i:'🧩',cat:'Игры',sz:'25 МБ',desc:'Головоломки'},
  ];
  body.innerHTML=`<div class="as-root">
    <div class="as-header">
      <span style="font-size:20px">🛒 Магазин приложений</span>
      <input class="input" id="${wid}_search" placeholder="Поиск" style="flex:1">
      <div class="as-cats" id="${wid}_cats">
        <div class="as-cat active" data-cat="all">Все</div>
        <div class="as-cat" data-cat="Игры">Игры</div>
        <div class="as-cat" data-cat="Продуктивность">Продуктивность</div>
        <div class="as-cat" data-cat="Медиа">Медиа</div>
        <div class="as-cat" data-cat="Утилиты">Утилиты</div>
      </div>
    </div>
    <div class="as-grid" id="${wid}_grid"></div>
  </div>`;
  let cat='all',query='';
  const grid=body.querySelector(`#${wid}_grid`);
  body.querySelectorAll('.as-cat').forEach(c=>{c.addEventListener('click',()=>{body.querySelectorAll('.as-cat').forEach(x=>x.classList.remove('active'));c.classList.add('active');cat=c.dataset.cat;renderGrid();});});
  body.querySelector(`#${wid}_search`).addEventListener('input',e=>{query=e.target.value.toLowerCase();renderGrid();});
  function renderGrid(){
    grid.innerHTML='';
    storeApps.filter(a=>(cat==='all'||a.cat===cat)&&a.n.toLowerCase().includes(query)).forEach(a=>{
      const installed=localStorage.getItem('NovaOS_installed_'+a.n);
      const d=document.createElement('div');d.className='as-card';
      d.innerHTML=`<span class="emoji">${a.i}</span><div class="info"><div class="name">${a.n}</div><div class="desc">${a.desc}</div><div class="size">${a.sz} · ${a.cat}</div></div>`;
      const b=document.createElement('button');b.className='btn';
      if(installed){b.textContent='Открыть';b.classList.add('btn-accent');b.addEventListener('click',()=>showNotification(a.n,'Открытие...','🚀'));}
      else{
        b.textContent='Установить';
        b.addEventListener('click',()=>{
          b.textContent='0%';b.disabled=true;
          let p=0;
          const iv=setInterval(()=>{
            p+=Math.random()*15;if(p>=100){p=100;b.textContent='Установка...';
              setTimeout(()=>{
                clearInterval(iv);localStorage.setItem('NovaOS_installed_'+a.n,'1');
                b.textContent='Открыть';b.classList.add('btn-accent');b.disabled=false;
                showNotification('Магазин',a.n+' установлено','✅');
                addDesktopIcon(a.n,a.i);
              },800);
            } else b.textContent=Math.floor(p)+'%';
          },200);
        });
      }
      d.appendChild(b);grid.appendChild(d);
    });
  }
  renderGrid();
}
function addDesktopIcon(name,icon){
  const c=document.getElementById('desktop-icons');
  const d=document.createElement('div');d.className='desk-icon';d.dataset.custom=name;
  d.innerHTML=`<span class="emoji">${icon}</span><span class="label">${name}</span>`;
  d.addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.desk-icon').forEach(x=>x.classList.remove('selected'));d.classList.add('selected');});
  d.addEventListener('dblclick',()=>showNotification(name,'Приложение запущено','🚀'));
  c.appendChild(d);
}

/* Camera */
function appCamera(body,wid){
  body.innerHTML=`<div class="cam-root">
    <div class="cam-toolbar">
      <button class="btn" id="${wid}_photo">📷 Фото</button>
      <button class="btn" id="${wid}_video">🎥 Видео</button>
      <button class="btn" id="${wid}_switch">🔄 Камера</button>
    </div>
    <div class="cam-vid mirror" id="${wid}_vid">
      <video id="${wid}_video" autoplay playsinline></video>
      <div class="cam-corner cam-tl"></div><div class="cam-corner cam-tr"></div>
      <div class="cam-corner cam-bl"></div><div class="cam-corner cam-br"></div>
      <div class="cam-rec" id="${wid}_rec"><span style="width:8px;height:8px;border-radius:50%;background:#fff"></span> REC <span id="${wid}_rectime">0:00</span></div>
      <div class="cam-flash" id="${wid}_flash"></div>
      <div class="cam-gallery" id="${wid}_gallery"></div>
      <div class="cam-err hidden" id="${wid}_err">
        <div style="font-size:48px">📷</div>
        <p>Не удалось получить доступ к камере. Проверьте разрешения.</p>
        <button class="btn btn-accent" id="${wid}_retry">Повторить</button>
      </div>
    </div>
  </div>`;
  const video=body.querySelector(`#${wid}_video`);
  const vid=body.querySelector(`#${wid}_vid`);
  const err=body.querySelector(`#${wid}_err`);
  let stream=null,recorder=null,mode='photo',chunks=[],gallery=[],recTimer=null,recSecs=0,facing='user';
  function startCam(){
    if(stream)stream.getTracks().forEach(t=>t.stop());
    err.classList.add('hidden');video.style.display='block';
    navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false}).then(s=>{stream=s;video.srcObject=s;}).catch(e=>{
      video.style.display='none';err.classList.remove('hidden');
    });
  }
  startCam();
  body.querySelector(`#${wid}_retry`).addEventListener('click',startCam);
  body.querySelector(`#${wid}_switch`).addEventListener('click',()=>{facing=facing==='user'?'environment':'user';vid.classList.toggle('mirror',facing==='user');startCam();});
  body.querySelector(`#${wid}_photo`).addEventListener('click',()=>{
    mode='photo';
    if(!stream)return;
    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;
    const ctx=canvas.getContext('2d');
    if(facing==='user')ctx.scale(-1,1),ctx.translate(-canvas.width,0);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const url=canvas.toDataURL('image/png');
    gallery.unshift({type:'img',url});
    renderGallery();
    const flash=body.querySelector(`#${wid}_flash`);flash.classList.add('flash');setTimeout(()=>flash.classList.remove('flash'),300);
  });
  body.querySelector(`#${wid}_video`).addEventListener('click',()=>{
    if(mode==='video'&&recorder&&recorder.state==='recording'){
      recorder.stop();mode='photo';
      body.querySelector(`#${wid}_video_btn`).textContent='🎥 Запись';
    } else {
      mode='video';
      if(!stream)return;
      chunks=[];
      try{recorder=new MediaRecorder(stream);}catch(e){showNotification('Камера','Запись не поддерживается','⚠️');return;}
      recorder.ondataavailable=e=>chunks.push(e.data);
      recorder.onstop=()=>{
        const blob=new Blob(chunks,{type:'video/webm'});
        const url=URL.createObjectURL(blob);
        gallery.unshift({type:'video',url});
        renderGallery();
        body.querySelector(`#${wid}_rec`).classList.remove('show');
        clearInterval(recTimer);
      };
      recorder.start();
      body.querySelector(`#${wid}_rec`).classList.add('show');
      recSecs=0;
      recTimer=setInterval(()=>{
        recSecs++;
        body.querySelector(`#${wid}_rectime`).textContent=`${Math.floor(recSecs/60)}:${String(recSecs%60).padStart(2,'0')}`;
      },1000);
    }
  });
  function renderGallery(){
    const g=body.querySelector(`#${wid}_gallery`);g.innerHTML='';
    gallery.forEach((item,i)=>{
      if(item.type==='img'){const img=document.createElement('img');img.className='cam-thumb';img.src=item.url;img.addEventListener('click',()=>viewGallery(i));g.appendChild(img);}
      else{const v=document.createElement('video');v.className='cam-thumb';v.src=item.url;v.addEventListener('click',()=>viewGallery(i));g.appendChild(v);}
    });
  }
  function viewGallery(i){
    const item=gallery[i];
    const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px';
    const el=item.type==='img'?new Image():document.createElement('video');
    if(item.type==='video')el.controls=true;
    el.src=item.url;el.style.maxWidth='80%';el.style.maxHeight='70%';el.style.borderRadius='12px';
    const nav=document.createElement('div');nav.style.cssText='display:flex;gap:16px;font-size:28px;color:#fff;cursor:pointer';
    nav.innerHTML=`<span id="${wid}_nav_prev">◀</span><span id="${wid}_nav_dl">⬇</span><span id="${wid}_nav_next">▶</span><span id="${wid}_nav_close">✕</span>`;
    ov.appendChild(el);ov.appendChild(nav);document.body.appendChild(ov);
    nav.querySelector(`#${wid}_nav_close`).onclick=()=>ov.remove();
    nav.querySelector(`#${wid}_nav_prev`).onclick=()=>{ov.remove();viewGallery(Math.max(0,i-1));};
    nav.querySelector(`#${wid}_nav_next`).onclick=()=>{ov.remove();viewGallery(Math.min(gallery.length-1,i+1));};
    nav.querySelector(`#${wid}_nav_dl`).onclick=()=>{
      const a=document.createElement('a');a.href=item.url;a.download=`novaos_${Date.now()}.${item.type==='img'?'png':'webm'}`;a.click();
    };
  }
}

/* Clock */
function appClock(body,wid){
  body.innerHTML=`<div style="display:flex;flex-direction:column;height:100%">
    <div class="clk-tabs">
      <div class="clk-tab active" data-t="analog">Аналоговые</div>
      <div class="clk-tab" data-t="world">Мировые</div>
      <div class="clk-tab" data-t="stop">Секундомер</div>
      <div class="clk-tab" data-t="timer">Таймер</div>
    </div>
    <div style="flex:1;overflow-y:auto" id="${wid}_content"></div>
  </div>`;
  const content=body.querySelector(`#${wid}_content`);
  body.querySelectorAll('.clk-tab').forEach(t=>{t.addEventListener('click',()=>{body.querySelectorAll('.clk-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');render(t.dataset.t);});});
  let interval=null;
  function render(type){
    if(interval)clearInterval(interval);
    if(type==='analog'){
      content.innerHTML=`<div class="clk-analog"><canvas width="240" height="240" id="${wid}_canvas"></canvas><div id="${wid}_digital" style="font-size:28px;font-weight:300"></div></div>`;
      const cv=body.querySelector(`#${wid}_canvas`),ctx=cv.getContext('2d');
      interval=setInterval(()=>{
        const now=new Date();
        ctx.clearRect(0,0,240,240);
        ctx.strokeStyle='var(--text)';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(120,120,110,0,Math.PI*2);ctx.stroke();
        for(let i=0;i<60;i++){
          const a=i*Math.PI/30-Math.PI/2;
          ctx.beginPath();
          ctx.moveTo(120+Math.cos(a)*100,120+Math.sin(a)*100);
          ctx.lineTo(120+Math.cos(a)*(i%5===0?88:95),120+Math.sin(a)*(i%5===0?88:95));
          ctx.lineWidth=i%5===0?3:1;ctx.strokeStyle=i%5===0?'var(--accent)':'var(--text-gray)';ctx.stroke();
        }
        const h=now.getHours()%12,m=now.getMinutes(),s=now.getSeconds();
        const drawH=(ang,len,w,c)=>{const a=ang-Math.PI/2;ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(120,120);ctx.lineTo(120+Math.cos(a)*len,120+Math.sin(a)*len);ctx.stroke();};
        drawH(h*Math.PI/6+m*Math.PI/360,50,4,'var(--text)');
        drawH(m*Math.PI/30,70,3,'var(--text)');
        drawH(s*Math.PI/30,85,1.5,'var(--accent)');
        ctx.fillStyle='var(--accent)';ctx.beginPath();ctx.arc(120,120,5,0,Math.PI*2);ctx.fill();
        body.querySelector(`#${wid}_digital`).textContent=now.toLocaleTimeString('ru-RU');
      },1000);
    }
    else if(type==='world'){
      const cities=[{n:'Москва',tz:3,f:'🇷🇺'},{n:'Лондон',tz:0,f:'🇬🇧'},{n:'Нью-Йорк',tz:-5,f:'🇺🇸'},{n:'Токио',tz:9,f:'🇯🇵'},{n:'Дубай',tz:4,f:'🇦🇪'},{n:'Пекин',tz:8,f:'🇨🇳'}];
      content.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px">';
      const updateTime=()=>{
        content.querySelectorAll('.wt-city').forEach((el,i)=>{
          const now=new Date();const utc=now.getTime()+now.getTimezoneOffset()*60000;
          const ct=new Date(utc+cities[i].tz*3600000);
          el.querySelector('.wt-time').textContent=ct.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
        });
      };
      cities.forEach(c=>{
        content.innerHTML+=`<div class="wt-city" style="background:rgba(255,255,255,.06);border-radius:12px;padding:16px;text-align:center"><div style="font-size:28px">${c.f}</div><div style="font-weight:600;margin:4px 0">${c.n}</div><div class="wt-time" style="font-size:24px;font-weight:300"></div></div>`;
      });
      updateTime();interval=setInterval(updateTime,1000);
    }
    else if(type==='stop'){
      content.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px">
        <div id="${wid}_st" style="font-size:48px;font-weight:200">00:00.00</div>
        <div style="display:flex;gap:12px">
          <button class="btn btn-accent" id="${wid}_st_start">Старт</button>
          <button class="btn" id="${wid}_st_reset">Сброс</button>
          <button class="btn" id="${wid}_st_lap">Круг</button>
        </div>
        <div id="${wid}_laps" style="width:100%;max-width:300px;overflow-y:auto;max-height:200px"></div>
      </div>`;
      let ms=0,startT=0,running=false,laps=[];
      const stEl=body.querySelector(`#${wid}_st`);
      function fmt(ms){const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),cs=Math.floor((ms%1000)/10);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;}
      body.querySelector(`#${wid}_st_start`).addEventListener('click',function(){running=!running;if(running){this.textContent='Пауза';startT=Date.now()-ms;interval=setInterval(()=>{ms=Date.now()-startT;stEl.textContent=fmt(ms);},10);}else{this.textContent='Старт';clearInterval(interval);}});
      body.querySelector(`#${wid}_st_reset`).addEventListener('click',()=>{clearInterval(interval);running=false;ms=0;stEl.textContent='00:00.00';body.querySelector(`#${wid}_st_start`).textContent='Старт';laps=[];body.querySelector(`#${wid}_laps`).innerHTML='';});
      body.querySelector(`#${wid}_st_lap`).addEventListener('click',()=>{if(running){laps.unshift(fmt(ms));body.querySelector(`#${wid}_laps`).innerHTML=laps.map((l,i)=>`<div style="padding:6px;border-bottom:1px solid var(--border);font-family:monospace">Круг ${laps.length-i}: ${l}</div>`).join('');}});
    }
    else if(type==='timer'){
      content.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px">
        <div style="display:flex;gap:8px"><input class="input" type="number" value="0" min="0" max="99" style="width:60px;text-align:center" placeholder="ч"><input class="input" type="number" value="5" min="0" max="59" style="width:60px;text-align:center" placeholder="м"><input class="input" type="number" value="0" min="0" max="59" style="width:60px;text-align:center" placeholder="с"></div>
        <div id="${wid}_tm" style="font-size:48px;font-weight:200">00:05:00</div>
        <button class="btn btn-accent" id="${wid}_tm_start">Старт</button>
      </div>`;
      let running=false,secs=0;
      const inputs=content.querySelectorAll('input');
      const tmEl=body.querySelector(`#${wid}_tm`);
      function calc(){return parseInt(inputs[0].value)*3600+parseInt(inputs[1].value)*60+parseInt(inputs[2].value);}
      function fmt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
      body.querySelector(`#${wid}_tm_start`).addEventListener('click',function(){
        if(!running){secs=calc();if(secs<=0)return;running=true;this.textContent='Стоп';tmEl.textContent=fmt(secs);
          interval=setInterval(()=>{secs--;tmEl.textContent=fmt(secs);if(secs<=0){clearInterval(interval);running=false;this.textContent='Старт';showNotification('Таймер','Время вышло!','⏰');}},1000);
        }else{clearInterval(interval);running=false;this.textContent='Старт';}
      });
    }
  }
  render('analog');
}

/* QR Code */
function appQR(body,wid){
  body.innerHTML=`<div class="qr-root">
    <div class="qr-types">
      <button class="qr-type-btn active" data-t="text">Текст</button>
      <button class="qr-type-btn" data-t="url">URL</button>
      <button class="qr-type-btn" data-t="tel">Телефон</button>
      <button class="qr-type-btn" data-t="email">Email</button>
      <button class="qr-type-btn" data-t="wifi">Wi-Fi</button>
      <button class="qr-type-btn" data-t="pay">Платёж</button>
    </div>
    <input class="input w-full" id="${wid}_input" placeholder="Введите текст..." style="margin-bottom:8px">
    <input class="input w-full hidden" id="${wid}_wifi_pass" placeholder="Пароль Wi-Fi" style="margin-bottom:8px">
    <input class="input w-full hidden" id="${wid}_wifi_ssid" placeholder="SSID сети" style="margin-bottom:8px">
    <button class="btn btn-accent w-full" id="${wid}_gen">Сгенерировать</button>
    <div class="qr-canvas-wrap"><canvas id="${wid}_canvas" width="200" height="200" style="margin-top:12px"></canvas></div>
    <div class="qr-decoded" id="${wid}_decoded"></div>
  </div>`;
  let type='text';
  body.querySelectorAll('.qr-type-btn').forEach(b=>{b.addEventListener('click',()=>{
    body.querySelectorAll('.qr-type-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.t;
    const inp=body.querySelector(`#${wid}_input`),wp=body.querySelector(`#${wid}_wifi_pass`),ws=body.querySelector(`#${wid}_wifi_ssid`);
    wp.classList.add('hidden');ws.classList.add('hidden');
    if(type==='wifi'){inp.placeholder='Тип шифрования (WPA)';ws.classList.remove('hidden');wp.classList.remove('hidden');}
    else if(type==='url')inp.placeholder='https://...';
    else if(type==='tel')inp.placeholder='+7...';
    else if(type==='email')inp.placeholder='user@mail.com';
    else if(type==='pay')inp.placeholder='Сумма (₽)';
    else inp.placeholder='Введите текст...';
  });});
  body.querySelector(`#${wid}_gen`).addEventListener('click',()=>{
    let data=body.querySelector(`#${wid}_input`).value;
    if(type==='url'&&data&&!data.startsWith('http'))data='https://'+data;
    if(type==='tel')data='tel:'+data;
    if(type==='email')data='mailto:'+data;
    if(type==='wifi'){const s=body.querySelector(`#${wid}_wifi_ssid`).value,p=body.querySelector(`#${wid}_wifi_pass`).value;data=`WIFI:T:WPA;S:${s};P:${p};;`;}
    if(type==='pay')data=`novabank:pay?amount=${data}rub`;
    body.querySelector(`#${wid}_decoded`).textContent='Данные: '+data;
    generateQR(body.querySelector(`#${wid}_canvas`),data);
  });
  function generateQR(canvas,data){
    const ctx=canvas.getContext('2d');
    const size=25;const cellSize=200/size;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,200,200);ctx.fillStyle='#000';
    // Simple visual QR-like pattern (not a real QR, but has markers)
    const grid=[];
    for(let r=0;r<size;r++){grid[r]=[];for(let c=0;c<size;c++)grid[r][c]=Math.random()>0.5;}
    function drawMarker(R,C){
      for(let r=0;r<7;r++)for(let c=0;c<7;c++){
        if(r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4))grid[R+r][C+c]=1;else grid[R+r][C+c]=0;
      }
    }
    drawMarker(0,0);drawMarker(0,18);drawMarker(18,0);
    for(let r=0;r<size;r++)for(let c=0;c<size;c++){
      if(grid[r][c])ctx.fillRect(c*cellSize,r*cellSize,cellSize,cellSize);
    }
  }
}

/* Dictaphone */
function appDictaphone(body,wid){
  body.innerHTML=`<div class="dc-root">
    <button class="dc-btn" id="${wid}_btn">🎤</button>
    <div class="dc-timer" id="${wid}_timer">00:00</div>
    <div class="dc-list" id="${wid}_list"></div>
  </div>`;
  let recorder=null,chunks=[],recording=false,secs=0,interval=null;
  const btn=body.querySelector(`#${wid}_btn`),timer=body.querySelector(`#${wid}_timer`),list=body.querySelector(`#${wid}_list`);
  let records=JSON.parse(localStorage.getItem('NovaOS_records')||'[]');
  renderList();
  btn.addEventListener('click',async()=>{
    if(!recording){
      try{
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        chunks=[];recorder=new MediaRecorder(stream);
        recorder.ondataavailable=e=>chunks.push(e.data);
        recorder.onstop=()=>{
          const blob=new Blob(chunks,{type:'audio/webm'});
          const url=URL.createObjectURL(blob);
          records.unshift({url,time:secs,date:new Date().toLocaleString('ru'),size:Math.round(blob.size/1024)+' КБ'});
          localStorage.setItem('NovaOS_records',JSON.stringify(records.map(r=>({...r,url:undefined}))));
          renderList();
        };
        recorder.start();recording=true;btn.classList.add('recording');btn.textContent='⏹';secs=0;
        interval=setInterval(()=>{secs++;timer.textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;},1000);
      }catch(e){showNotification('Диктофон','Нет доступа к микрофону','⚠️');}
    } else {
      recorder.stop();recording=false;btn.classList.remove('recording');btn.textContent='🎤';clearInterval(interval);timer.textContent='00:00';
      stream&&stream.getTracks().forEach(t=>t.stop());
    }
  });
  function renderList(){
    list.innerHTML='';
    if(records.length===0){list.innerHTML='<p class="muted center">Нет записей</p>';return;}
    records.forEach(r=>{
      const d=document.createElement('div');d.className='dc-item';
      d.innerHTML=`<div><div style="font-size:13px">${r.date}</div><div class="size">${r.size}</div></div>`;
      if(r.url){const a=document.createElement('audio');a.controls=true;a.src=r.url;d.appendChild(a);
        const dl=document.createElement('span');dl.className='dc-download';dl.textContent='⬇';dl.addEventListener('click',()=>{const link=document.createElement('a');link.href=r.url;link.download=`record_${r.date}.webm`;link.click();});d.appendChild(dl);}
      list.appendChild(d);
    });
  }
}

/* Notes */
function appNotes(body,wid){
  body.innerHTML=`<div class="nt-root">
    <div class="nt-sidebar">
      <button class="btn btn-accent nt-new" id="${wid}_new">+ Новая</button>
      <div id="${wid}_list"></div>
    </div>
    <div class="nt-main">
      <input class="nt-title" id="${wid}_title" placeholder="Заголовок">
      <textarea class="nt-body" id="${wid}_body" placeholder="Текст заметки..."></textarea>
    </div>
  </div>`;
  let notes=JSON.parse(localStorage.getItem('NovaOS_notes')||'[]');
  let curId=-1;
  const titleEl=body.querySelector(`#${wid}_title`),bodyEl=body.querySelector(`#${wid}_body`),listEl=body.querySelector(`#${wid}_list`);
  function renderList(){
    listEl.innerHTML='';
    if(notes.length===0){listEl.innerHTML='<div class="muted center" style="padding:16px">Нет заметок</div>';return;}
    notes.forEach(n=>{
      const d=document.createElement('div');d.className='nt-list-item'+(n.id===curId?' active':'');
      d.textContent=n.title||'Без названия';
      d.addEventListener('click',()=>{curId=n.id;loadNote();renderList();});
      listEl.appendChild(d);
    });
  }
  function loadNote(){const n=notes.find(x=>x.id===curId);if(n){titleEl.value=n.title;bodyEl.value=n.body;}}
  function saveCurrent(){const n=notes.find(x=>x.id===curId);if(n){n.title=titleEl.value;n.body=bodyEl.value;localStorage.setItem('NovaOS_notes',JSON.stringify(notes));renderList();}}
  titleEl.addEventListener('input',saveCurrent);bodyEl.addEventListener('input',saveCurrent);
  body.querySelector(`#${wid}_new`).addEventListener('click',()=>{const id=Date.now();notes.unshift({id,title:'',body:''});curId=id;localStorage.setItem('NovaOS_notes',JSON.stringify(notes));loadNote();renderList();titleEl.focus();});
  if(notes.length>0){curId=notes[0].id;loadNote();}
  renderList();
}

/* Task Manager */
function appTaskMgr(body,wid){
  body.innerHTML=`<div class="tm-root"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h3>Диспетчер задач</h3><button class="btn" id="${wid}_refresh">Обновить</button></div><table class="tm-table"><thead><tr><th>Приложение</th><th>ОЗУ</th><th>ЦП</th><th>Действие</th></tr></thead><tbody id="${wid}_rows"></tbody></table></div>`;
  function render(){
    const rows=body.querySelector(`#${wid}_rows`);rows.innerHTML='';
    Object.values(OS.windows).forEach(w=>{
      const tr=document.createElement('tr');
      const ram=Math.floor(Math.random()*200+50),cpu=Math.floor(Math.random()*20+1);
      tr.innerHTML=`<td>${APPS.find(a=>a.id===w.appId)?.name||'?'}</td><td>${ram} МБ</td><td>${cpu}%</td><td><span class="tm-kill">Завершить</span></td>`;
      tr.querySelector('.tm-kill').addEventListener('click',()=>{closeWindow(w.id);render();});
      rows.appendChild(tr);
    });
    if(Object.keys(OS.windows).length===0)rows.innerHTML='<tr><td colspan="4" class="muted center">Нет запущенных приложений</td></tr>';
  }
  render();
  body.querySelector(`#${wid}_refresh`).addEventListener('click',render);
}

/* Paint */
function appPaint(body,wid){
  body.innerHTML=`<div class="pt-root">
    <div class="pt-toolbar">
      <button class="btn" id="${wid}_brush">🖌️ Кисть</button>
      <button class="btn" id="${wid}_eraser">🧽 Ластик</button>
      <input type="color" value="#0a84ff" id="${wid}_color" style="width:40px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none">
      <input type="range" min="1" max="40" value="5" id="${wid}_size" style="width:120px">
      <span class="muted" id="${wid}_sizeval">5px</span>
      <button class="btn btn-danger" id="${wid}_clear">Очистить</button>
    </div>
    <div class="pt-canvas-wrap"><canvas class="pt-canvas" id="${wid}_canvas"></canvas></div>
  </div>`;
  const canvas=body.querySelector(`#${wid}_canvas`),ctx=canvas.getContext('2d');
  let tool='brush',color='#0a84ff',size=5,drawing=false;
  function resize(){const r=canvas.parentElement.getBoundingClientRect();canvas.width=r.width;canvas.height=r.height;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);}
  setTimeout(resize,100);window.addEventListener('resize',resize);
  body.querySelector(`#${wid}_brush`).addEventListener('click',()=>tool='brush');
  body.querySelector(`#${wid}_eraser`).addEventListener('click',()=>tool='eraser');
  body.querySelector(`#${wid}_color`).addEventListener('input',e=>color=e.target.value);
  body.querySelector(`#${wid}_size`).addEventListener('input',e=>{size=parseInt(e.target.value);body.querySelector(`#${wid}_sizeval`).textContent=size+'px';});
  body.querySelector(`#${wid}_clear`).addEventListener('click',()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);});
  canvas.addEventListener('mousedown',e=>{drawing=true;draw(e);});
  canvas.addEventListener('mousemove',e=>{if(drawing)draw(e);});
  canvas.addEventListener('mouseup',()=>drawing=false);canvas.addEventListener('mouseleave',()=>drawing=false);
  function draw(e){const r=canvas.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;ctx.beginPath();ctx.arc(x,y,size/2,0,Math.PI*2);ctx.fillStyle=tool==='eraser'?'#fff':color;ctx.fill();}
}

/* ═════════════ GAMES ═════════════ */
function appGames(body,wid){
  const games=['Сапёр','Змейка','2048','Память','Крестики-нолики'];
  const gicons=['💣','🐍','🔢','🃏','⭕'];
  body.innerHTML=`<div style="display:flex;flex-direction:column;height:100%">
    <div class="gm-tabs" id="${wid}_tabs">${games.map((g,i)=>`<div class="gm-tab${i===0?' active':''}" data-g="${i}">${gicons[i]} ${g}</div>`).join('')}</div>
    <div style="flex:1;overflow-y:auto;padding:16px" id="${wid}_content"></div>
  </div>`;
  body.querySelectorAll('.gm-tab').forEach(t=>t.addEventListener('click',()=>{body.querySelectorAll('.gm-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');renderGame(parseInt(t.dataset.g));}));
  const content=body.querySelector(`#${wid}_content`);
  function renderGame(idx){
    if(idx===0)gameMinesweeper();
    else if(idx===1)gameSnake();
    else if(idx===2)game2048();
    else if(idx===3)gameMemory();
    else if(idx===4)gameTicTacToe();
  }
  function gameMinesweeper(){
    const N=9,MINES=10;
    let grid=[],revealed=[],flags=[],over=false,won=false;
    function init(){grid=[];revealed=[];flags=[];over=false;won=false;
      for(let r=0;r<N;r++){grid[r]=[];revealed[r]=[];flags[r]=[];for(let c=0;c<N;c++){grid[r][c]=0;revealed[r][c]=false;flags[r][c]=false;}}
      let placed=0;while(placed<MINES){const r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);if(grid[r][c]!==-1){grid[r][c]=-1;placed++;}}
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(grid[r][c]===-1)continue;let cnt=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<N&&nc>=0&&nc<N&&grid[nr][nc]===-1)cnt++;}grid[r][c]=cnt;}
      render();
    }
    function reveal(r,c){
      if(over||revealed[r][c]||flags[r][c])return;
      revealed[r][c]=true;
      if(grid[r][c]===-1){over=true;render();return;}
      if(grid[r][c]===0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<N&&nc>=0&&nc<N&&!revealed[nr][nc])reveal(nr,nc);}
      checkWin();render();
    }
    function checkWin(){let unrevealed=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!revealed[r][c])unrevealed++;if(unrevealed===MINES){won=true;over=true;}}
    function render(){
      let html='<div style="text-align:center"><h4>💣 Сапёр</h4><div style="display:inline-block;border:2px solid var(--border);border-radius:8px;padding:4px">';
      for(let r=0;r<N;r++){html+='<div style="display:flex">';
        for(let c=0;c<N;c++){
          const cell=revealed[r][c]?(grid[r][c]===-1?'💣':grid[r][c]||''):flags[r][c]?'🚩':'';
          const bg=revealed[r][c]?(grid[r][c]===-1?'#e81123':'rgba(255,255,255,.1)'):'rgba(255,255,255,.05)';
          const col=grid[r][c]===1?'#4facfe':grid[r][c]===2?'#30d158':grid[r][c]===3?'#ff9f0a':'';
          html+=`<div data-r="${r}" data-c="${c}" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:${bg};border:1px solid var(--border);cursor:pointer;font-size:16px;color:${col};border-radius:2px">${cell}</div>`;
        }
        html+='</div>';
      }
      html+='</div><div style="margin-top:8px">'+(won?'<span style="color:#30d158;font-weight:600">🎉 Победа!</span>':over?'<span style="color:#e81123">💥 Поражение</span>':'Флагов: '+Object.values(flags).flat().filter(f=>f).length+'/'+MINES)+'</div>';
      html+='<button class="btn btn-accent mt-8" id="'+wid+'_ms_new">Новая игра</button></div>';
      content.innerHTML=html;
      content.querySelectorAll('[data-r]').forEach(d=>{d.addEventListener('click',()=>reveal(parseInt(d.dataset.r),parseInt(d.dataset.c)));d.addEventListener('contextmenu',e=>{e.preventDefault();if(!revealed[parseInt(d.dataset.r)][parseInt(d.dataset.c)]){flags[parseInt(d.dataset.r)][parseInt(d.dataset.c)]=!flags[parseInt(d.dataset.r)][parseInt(d.dataset.c)];render();}});});
      content.querySelector(`#${wid}_ms_new`).addEventListener('click',init);
    }
    init();
  }
  function gameSnake(){
    content.innerHTML=`<div style="text-align:center"><h4>🐍 Змейка</h4><canvas id="${wid}_snake" width="360" height="360" style="border:2px solid var(--border);border-radius:8px;background:#111"></canvas><div style="margin-top:8px">Счёт: <span id="${wid}_snake_score">0</span> · <span class="muted">Стрелки для управления</span></div></div>`;
    const cv=content.querySelector(`#${wid}_snake`),ctx=cv.getContext('2d');
    const S=18,cells=20;let snake=[{x:10,y:10}],dir={x:1,y:0},food={x:5,y:5},score=0,over=false,interval=null;
    function tick(){
      if(over)return;
      const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
      if(h.x<0||h.x>=cells||h.y<0||h.y>=cells||snake.some(s=>s.x===h.x&&s.y===h.y)){over=true;ctx.fillStyle='#e81123';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('Game Over',180,180);clearInterval(interval);return;}
      snake.unshift(h);
      if(h.x===food.x&&h.y===food.y){score+=10;content.querySelector(`#${wid}_snake_score`).textContent=score;food={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)};}
      else snake.pop();
      ctx.fillStyle='#111';ctx.fillRect(0,0,360,360);
      ctx.fillStyle='#0a84ff';snake.forEach(s=>ctx.fillRect(s.x*S,s.y*S,S-1,S-1));
      ctx.fillStyle='#30d158';ctx.fillRect(food.x*S,food.y*S,S-1,S-1);
    }
    function start(){snake=[{x:10,y:10}];dir={x:1,y:0};score=0;over=false;content.querySelector(`#${wid}_snake_score`).textContent=0;clearInterval(interval);interval=setInterval(tick,120);}
    const keyHandler=e=>{
      const w=OS.windows[wid];if(!w||w.minimized)return;
      if(e.key==='ArrowUp'&&dir.y===0)dir={x:0,y:-1};
      else if(e.key==='ArrowDown'&&dir.y===0)dir={x:0,y:1};
      else if(e.key==='ArrowLeft'&&dir.x===0)dir={x:-1,y:0};
      else if(e.key==='ArrowRight'&&dir.x===0)dir={x:1,y:0};
    };
    document.addEventListener('keydown',keyHandler);
    content.innerHTML+=`<button class="btn btn-accent mt-8" id="${wid}_snake_start">Старт/Рестарт</button>`;
    content.querySelector(`#${wid}_snake_start`).addEventListener('click',start);
    start();
  }
  function game2048(){
    let board=[],score=0;
    function init(){board=[];for(let r=0;r<4;r++){board[r]=[0,0,0,0];}addTile();addTile();score=0;render();}
    function addTile(){const empty=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(board[r][c]===0)empty.push([r,c]);if(empty.length===0)return;const[r,c]=empty[Math.floor(Math.random()*empty.length)];board[r][c]=Math.random()<0.9?2:4;}
    function slide(row){let arr=row.filter(x=>x);for(let i=0;i<arr.length-1;i++)if(arr[i]===arr[i+1]){arr[i]*=2;arr[i+1]=0;score+=arr[i];}arr=arr.filter(x=>x);while(arr.length<4)arr.push(0);return arr;}
    function move(dir){
      let moved=false;
      if(dir==='left'){for(let r=0;r<4;r++){const nr=slide(board[r]);if(JSON.stringify(nr)!==JSON.stringify(board[r]))moved=true;board[r]=nr;}}
      else if(dir==='right'){for(let r=0;r<4;r++){const nr=slide(board[r].reverse()).reverse();if(JSON.stringify(nr)!==JSON.stringify(board[r]))moved=true;board[r]=nr;}}
      else if(dir==='up'){for(let c=0;c<4;c++){const col=[board[0][c],board[1][c],board[2][c],board[3][c]];const nc=slide(col);if(JSON.stringify(nc)!==JSON.stringify(col))moved=true;for(let r=0;r<4;r++)board[r][c]=nc[r];}}
      else if(dir==='down'){for(let c=0;c<4;c++){const col=[board[3][c],board[2][c],board[1][c],board[0][c]];const nc=slide(col);if(JSON.stringify(nc)!==JSON.stringify(col))moved=true;for(let r=0;r<4;r++)board[r][c]=nc[3-r];}}
      if(moved){addTile();render();}
    }
    function render(){
      const colors={0:'rgba(255,255,255,.05)',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
      let html='<div style="text-align:center"><h4>🔢 2048</h4><div style="display:inline-grid;grid-template-columns:repeat(4,72px);gap:6px;background:rgba(255,255,255,.05);padding:6px;border-radius:8px">';
      for(let r=0;r<4;r++)for(let c=0;c<4;c++){const v=board[r][c];html+=`<div style="width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;border-radius:6px;background:${colors[v]||'#edc22e'};color:${v>4?'#fff':'#776e65'}">${v||''}</div>`;}
      html+='</div><div style="margin-top:8px">Счёт: <span style="font-weight:700">'+score+'</span> · <span class="muted">Стрелки</span></div>';
      html+=`<button class="btn btn-accent mt-8" id="${wid}_2048_new">Новая игра</button></div>`;
      content.innerHTML=html;
      content.querySelector(`#${wid}_2048_new`).addEventListener('click',init);
    }
    const keyHandler=e=>{
      const w=OS.windows[wid];if(!w||w.minimized)return;
      if(e.key==='ArrowLeft')move('left');
      else if(e.key==='ArrowRight')move('right');
      else if(e.key==='ArrowUp')move('up');
      else if(e.key==='ArrowDown')move('down');
    };
    document.addEventListener('keydown',keyHandler);
    init();
  }
  function gameMemory(){
    const emojis=['🎮','🎵','🎨','🍕','🚀','⭐','🐱','🌈'];
    let cards=[],flipped=[],matched=[],moves=0,startT=Date.now();
    function init(){cards=[...emojis,...emojis].sort(()=>Math.random()-0.5);flipped=[];matched=[];moves=0;startT=Date.now();render();}
    function flip(i){
      if(flipped.length===2||flipped.includes(i)||matched.includes(i))return;
      flipped.push(i);
      if(flipped.length===2){moves++;const[a,b]=flipped;if(cards[a]===cards[b]){matched.push(a,b);}flipped=[];setTimeout(render,300);}else render();
    }
    function render(){
      let won=matched.length===cards.length;
      let html='<div style="text-align:center"><h4>🃏 Память</h4>';
      html+='<div style="display:grid;grid-template-columns:repeat(4,64px);gap:8px;justify-content:center;margin:12px 0">';
      cards.forEach((c,i)=>{
        const show=flipped.includes(i)||matched.includes(i);
        const bg=matched.includes(i)?'rgba(48,209,88,.2)':'rgba(255,255,255,.08)';
        html+=`<div data-i="${i}" style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:28px;border-radius:8px;background:${show?bg:'var(--accent)'};cursor:pointer;transition:transform .15s;${show?'':'color:transparent'}">${show?c:'?'}</div>`;
      });
      html+='</div><div>Ходы: '+moves+' · Время: '+Math.floor((Date.now()-startT)/1000)+'с</div>';
      if(won)html+='<div style="color:#30d158;font-weight:600;margin-top:8px">🎉 Победа за '+moves+' ходов!</div>';
      html+=`<button class="btn btn-accent mt-8" id="${wid}_mem_new">Заново</button></div>`;
      content.innerHTML=html;
      content.querySelectorAll('[data-i]').forEach(d=>d.addEventListener('click',()=>flip(parseInt(d.dataset.i))));
      content.querySelector(`#${wid}_mem_new`).addEventListener('click',init);
    }
    init();
  }
  function gameTicTacToe(){
    let board=['','','','','','','','',''],player='⭕',ai='❌',over=false;
    function checkWin(b,p){const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return w.some(x=>x.every(i=>b[i]===p));}
    function bestMove(b,p){for(let i=0;i<9;i++)if(b[i]===''){b[i]=p;if(checkWin(b,p)){b[i]='';return i;}b[i]='';}for(let i=0;i<9;i++)if(b[i]===''){b[i]=p==='❌'?'⭕':'❌';if(checkWin(b,p==='❌'?'⭕':'❌')){b[i]='';return i;}b[i]='';}if(b[4]==='')return 4;const corners=[0,2,6,8].filter(i=>b[i]==='');if(corners.length)return corners[0];const edges=[1,3,5,7].filter(i=>b[i]==='');if(edges.length)return edges[0];for(let i=0;i<9;i++)if(b[i]=='')return i;}
    function render(){
      let won=checkWin(board,player),lost=checkWin(board,ai),draw=!board.includes('')&&!won&&!lost;
      let html='<div style="text-align:center"><h4>⭕ Крестики-нолики</h4><div style="display:inline-grid;grid-template-columns:repeat(3,80px);gap:4px;margin:12px 0">';
      board.forEach((c,i)=>{
        const bg=c? 'rgba(255,255,255,.1)':'rgba(255,255,255,.05)';
        html+=`<div data-i="${i}" style="width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:36px;border-radius:8px;background:${bg};cursor:pointer;${c||over?'pointer-events:none':''}">${c}</div>`;
      });
      html+='</div><div style="margin-top:8px">';
      if(won)html+='<span style="color:#30d158;font-weight:600">🎉 Вы победили!</span>';
      else if(lost)html+='<span style="color:#e81123">Вы проиграли</span>';
      else if(draw)html+='<span class="muted">Ничья</span>';
      else html+='<span class="muted">Вы — ⭕, ИИ — ❌</span>';
      html+=`</div><button class="btn btn-accent mt-8" id="${wid}_ttt_new">Новая игра</button></div>`;
      content.innerHTML=html;
      content.querySelectorAll('[data-i]').forEach(d=>d.addEventListener('click',()=>{
        if(over||board[parseInt(d.dataset.i)])return;
        board[parseInt(d.dataset.i)]=player;
        if(checkWin(board,player)){over=true;render();return;}
        if(!board.includes('')){over=true;render();return;}
        const m=bestMove(board,ai);board[m]=ai;
        if(checkWin(board,ai)||!board.includes(''))over=true;
        render();
      }));
      content.querySelector(`#${wid}_ttt_new`).addEventListener('click',()=>{board=['','','','','','','','',''];over=false;render();});
    }
    render();
  }
  renderGame(0);
}
