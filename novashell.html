<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaShell — Vizor</title>
<style>
:root{--accent:#39a0ff;--glass:rgba(9,19,42,.82);--line:rgba(180,215,255,.2);--text:#edf5ff;--muted:#9cb2d3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);background:#06112a}
button,input{font:inherit}button{cursor:pointer;color:inherit}
#wall{position:fixed;inset:0;background:linear-gradient(160deg,transparent 25%,rgba(3,10,30,.05)),radial-gradient(ellipse at 70% 65%,#f77eb6 0%,transparent 20%),radial-gradient(ellipse at 65% 75%,#155ed2 0%,transparent 36%),linear-gradient(160deg,#07112b,#09285b 55%,#30145e);transition:filter .3s}
#wall:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#8fd7ff 1px,transparent 1px);background-size:97px 97px,151px 151px;background-position:0 0,43px 70px;opacity:.5}
#wall:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-18%;height:42%;background:linear-gradient(transparent,rgba(4,12,38,.9)),repeating-linear-gradient(0deg,transparent 0 34px,rgba(63,156,255,.18) 35px 36px);transform:perspective(250px) rotateX(25deg);opacity:.7}
#panel{height:32px;position:fixed;z-index:100;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(5,13,32,.78);border-bottom:1px solid #ffffff18;backdrop-filter:blur(18px);font-size:12px}
#panel .left,#panel .right{display:flex;align-items:center;gap:15px}#brand{font-weight:700;font-size:13px}#panel button{border:0;background:transparent;padding:3px 6px;border-radius:5px}#panel button:hover{background:#ffffff18}
#desktop{position:fixed;inset:32px 0 74px;overflow:hidden}
.dicon{position:absolute;width:88px;min-height:76px;padding:7px 3px;border-radius:10px;text-align:center;cursor:default;text-shadow:0 2px 4px #000;user-select:none;border:1px solid transparent}
.dicon:hover,.dicon.selected{background:#cce7ff22;border-color:#d9efff40}.dicon .emoji{font-size:33px;display:block;filter:drop-shadow(0 3px 4px #0005)}.dicon .label{font-size:11px;line-height:1.2;display:block;margin-top:4px;overflow-wrap:anywhere}
#dock{position:fixed;z-index:100;left:50%;bottom:9px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:7px 10px;background:rgba(7,17,40,.77);border:1px solid #ffffff24;border-radius:19px;box-shadow:0 12px 40px #0005;backdrop-filter:blur(22px);max-width:95vw}
.dockbtn{position:relative;width:48px;height:48px;border:1px solid transparent;border-radius:13px;background:transparent;font-size:25px;display:grid;place-items:center}.dockbtn:hover{background:#ffffff20;transform:translateY(-3px)}.dockbtn .tip{position:absolute;bottom:57px;white-space:nowrap;padding:6px 9px;background:#081329;border:1px solid var(--line);border-radius:7px;font-size:11px;opacity:0;pointer-events:none}.dockbtn:hover .tip{opacity:1}.dockbtn.running:after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:#63c7ff}
.win{position:absolute;display:flex;flex-direction:column;min-width:270px;min-height:160px;width:520px;height:350px;background:rgba(8,19,43,.94);border:1px solid rgba(155,200,255,.3);border-radius:13px;box-shadow:0 24px 70px #0008;overflow:hidden;backdrop-filter:blur(24px);color:#e9f3ff}
.win.focus{border-color:#5bb7ff;box-shadow:0 22px 70px #0009,0 0 0 1px #5bb7ff20}.win.max{left:0!important;top:32px!important;width:100%!important;height:calc(100% - 106px)!important;border-radius:0}
.titlebar{height:39px;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:0 10px 0 13px;background:linear-gradient(90deg,#15284e,#101e3d);border-bottom:1px solid #ffffff12;cursor:grab;user-select:none}.titlebar .appico{font-size:15px}.titlebar .title{font-size:12px;font-weight:600;flex:1}.controls{display:flex;gap:5px}.ctrl{width:25px;height:24px;border:0;border-radius:6px;background:transparent;font-size:13px}.ctrl:hover{background:#ffffff20}.ctrl.close:hover{background:#df5268}
.content{flex:1;min-height:0;overflow:auto;padding:13px;font-size:13px;background:linear-gradient(145deg,#0b1a37,#09152d)}
.toolbar{display:flex;gap:7px;align-items:center;padding:7px;background:#132449;border:1px solid #ffffff12;border-radius:9px;margin-bottom:12px}.toolbar button,.btn{background:#1c3765;border:1px solid #ffffff19;border-radius:7px;padding:7px 10px}.toolbar button:hover,.btn:hover{background:#26508b}.address{flex:1;min-width:40px;background:#07142d;border:1px solid #ffffff1c;border-radius:7px;padding:7px 9px;color:#dbeaff}
.card{background:#102448;border:1px solid #ffffff16;border-radius:11px;padding:13px}.muted{color:var(--muted)}.section{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8eaad3;margin:8px 0}
.filegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}.fileitem{padding:12px 5px;text-align:center;border-radius:9px;border:1px solid transparent;cursor:pointer;overflow-wrap:anywhere}.fileitem:hover{background:#ffffff0d;border-color:#ffffff16}.fileitem span{display:block;font-size:29px;margin-bottom:7px}.fileitem small{font-size:11px}
.term{height:100%;background:#050d1c;color:#cce3ff;padding:10px;font:12px/1.6 ui-monospace,Consolas,monospace;overflow:auto}.termout{white-space:pre-wrap}.termline{display:flex;gap:7px}.termline b{color:#66e3bc}.termline input{flex:1;min-width:30px;background:transparent;color:#eaf4ff;border:0;outline:0;font:inherit}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:330px;margin:auto}.calc .display{grid-column:1/-1;min-height:62px;background:#061127;border:1px solid #ffffff16;border-radius:10px;padding:13px;text-align:right;font:26px ui-monospace,monospace;overflow:hidden}.calc button{padding:14px 4px;background:#172c50;border:1px solid #ffffff13;border-radius:9px}.calc button.op{background:#1d5796}.calc button.eq{background:#2788e8}.calc button:hover{filter:brightness(1.25)}
.settings-layout{display:grid;grid-template-columns:135px 1fr;gap:14px;min-height:100%}.settings-nav{border-right:1px solid #ffffff18;padding-right:9px}.settings-nav button{display:block;width:100%;text-align:left;margin:3px 0;padding:9px;border:0;border-radius:7px;background:transparent}.settings-nav button.active,.settings-nav button:hover{background:#1a4a89}.wallchoices{display:flex;gap:10px;flex-wrap:wrap}.wallchoice{height:78px;width:110px;border:2px solid transparent;border-radius:9px;cursor:pointer}.wallchoice.active{border-color:#68c7ff;box-shadow:0 0 0 2px #68c7ff33}
#context{display:none;position:fixed;z-index:500;width:205px;padding:5px;background:rgba(8,19,42,.97);border:1px solid #ffffff2b;border-radius:10px;box-shadow:0 15px 45px #0008;backdrop-filter:blur(20px)}#context button{width:100%;display:block;text-align:left;padding:9px 10px;border:0;background:transparent;border-radius:6px;font-size:12px}#context button:hover{background:#24508b}
#toast{position:fixed;z-index:600;right:16px;bottom:82px;max-width:300px;padding:12px 15px;background:rgba(8,19,42,.95);border:1px solid #ffffff25;border-radius:11px;box-shadow:0 10px 35px #0005;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;font-size:12px}#toast.show{opacity:1;transform:translateY(0)}
#boot{position:fixed;z-index:1000;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at 50% 45%,#163e78,#040918 65%);transition:opacity .5s}#boot.hide{opacity:0;pointer-events:none}#boot .logo{font-size:42px;font-weight:800;letter-spacing:2px}#boot .logo span{color:#56baff}#boot .bar{width:180px;height:4px;border-radius:8px;background:#1b3156;overflow:hidden}#boot .bar i{display:block;height:100%;background:#53baff;width:0;animation:load 1.7s forwards}@keyframes load{to{width:100%}}
#clockwidget{position:absolute;left:18px;bottom:15px;padding:14px 17px;width:220px;border:1px solid #ffffff22;border-radius:13px;background:#07152bc9;backdrop-filter:blur(15px);box-shadow:0 10px 35px #0003}#clockbig{font-size:36px;font-weight:300;letter-spacing:1px}#clockdate{font-size:12px;color:#a9c3e8;margin-top:3px}
@media(max-width:720px){.dicon{width:75px}.dicon .emoji{font-size:29px}.win{max-width:calc(100vw - 16px);max-height:calc(100vh - 110px)}#clockwidget{display:none}.dockbtn{width:40px;height:42px;font-size:22px}#dock{gap:3px}.settings-layout{grid-template-columns:100px 1fr}}
</style>
</head>
<body>
<div id="wall"></div>
<header id="panel">
 <div class="left"><button id="start" title="Меню приложений">🌌</button><span id="brand">NovaShell</span><button data-open="apps">Приложения</button><button data-open="fm">Файлы</button><button data-open="settings">Система</button></div>
 <div class="right"><span>◈</span><span>⌁ Wi‑Fi</span><span>🔊</span><span>▣ 75%</span><span id="panelclock">14:37</span></div>
</header>
<div id="desktop">
 <div class="dicon" style="left:12px;top:14px" data-app="windowsweb"><span class="emoji">📁</span><span class="label">windowsweb</span></div>
 <div class="dicon" style="left:104px;top:14px" data-app="builds"><span class="emoji">📁</span><span class="label">windowsweb-builds</span></div>
 <div class="dicon" style="left:196px;top:14px" data-app="pc"><span class="emoji">🖥️</span><span class="label">Этот компьютер</span></div>
 <div class="dicon" style="left:12px;top:112px" data-app="home"><span class="emoji">🏠</span><span class="label">Домашняя папка</span></div>
 <div class="dicon" style="left:104px;top:112px" data-app="browser"><span class="emoji">🌐</span><span class="label">DeepSeek.html</span></div>
 <div class="dicon" style="left:196px;top:112px" data-app="browser"><span class="emoji">🌐</span><span class="label">GigaChat.html</span></div>
 <div class="dicon" style="left:12px;top:210px" data-app="terminal"><span class="emoji">⌨️</span><span class="label">Терминал</span></div>
 <div class="dicon" style="left:104px;top:210px" data-app="obs"><span class="emoji">🎥</span><span class="label">OBS Studio</span></div>
 <div class="dicon" style="left:196px;top:210px" data-app="hmcl"><span class="emoji">⛏️</span><span class="label">HMCL</span></div>
 <div class="dicon" style="left:12px;top:308px" data-app="trash"><span class="emoji">🗑️</span><span class="label">Корзина</span></div>
 <div id="clockwidget"><div id="clockbig">14:37</div><div id="clockdate">29 сентября 2026</div><div class="muted" style="font-size:11px;margin-top:5px">NovaShell · Vizor</div></div>
</div>
<div id="dock"></div><div id="context"></div><div id="toast"></div>
<div id="boot"><div class="logo">Nova<span>Shell</span></div><div class="bar"><i></i></div><div class="muted">Рабочая среда Vizor · офлайн</div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let z=20, winCount=0, wins=[], toastTimer;
const wallpaper=[
 'radial-gradient(ellipse at 70% 65%,#f77eb6 0%,transparent 20%),radial-gradient(ellipse at 65% 75%,#155ed2 0%,transparent 36%),linear-gradient(160deg,#07112b,#09285b 55%,#30145e)',
 'radial-gradient(ellipse at 70% 80%,#5ec6b5,transparent 35%),linear-gradient(145deg,#071d31,#145e67 55%,#0a1830)',
 'radial-gradient(ellipse at 65% 65%,#fa8dca,transparent 28%),linear-gradient(145deg,#241044,#8d3f9c 58%,#f6a0aa)'
];
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function setWallpaper(n){$('#wall').style.background=wallpaper[n];$$('.wallchoice').forEach((e,i)=>e.classList.toggle('active',i===n));localStorage.setItem('novawp',n)}
function focusWin(w){wins.forEach(x=>x.classList.toggle('focus',x===w));w.style.zIndex=++z}
function openWin(app,title,body,w=520,h=350,icon='◈'){
 const old=wins.find(x=>x.dataset.app===app&&!x.classList.contains('minimized'));if(old){focusWin(old);return old}
 const el=document.createElement('section');el.className='win focus';el.dataset.app=app;el.style.width=Math.min(w,innerWidth-18)+'px';el.style.height=Math.min(h,innerHeight-110)+'px';el.style.left=Math.max(8,Math.min(90+winCount*24,innerWidth-Math.min(w,innerWidth-18)-8))+'px';el.style.top=Math.max(38,Math.min(48+winCount*20,innerHeight-Math.min(h,innerHeight-110)-80))+'px';winCount++;
 el.innerHTML=`<div class="titlebar"><span class="appico">${icon}</span><span class="title">${title}</span><div class="controls"><button class="ctrl minimize" title="Свернуть">—</button><button class="ctrl maximize" title="Развернуть">□</button><button class="ctrl close" title="Закрыть">×</button></div></div><div class="content">${body}</div>`;
 $('#desktop').appendChild(el);wins.push(el);focusWin(el);
 el.addEventListener('pointerdown',()=>focusWin(el));
 let drag=null;const bar=el.querySelector('.titlebar');bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(el.classList.contains('max'))return;focusWin(el);let r=el.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};bar.setPointerCapture(e.pointerId)});
 bar.addEventListener('pointermove',e=>{if(!drag)return;el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,e.clientX-drag.x))+'px';el.style.top=Math.max(32,Math.min(innerHeight-100,e.clientY-drag.y))+'px'});
 bar.addEventListener('pointerup',()=>drag=null);bar.addEventListener('pointercancel',()=>drag=null);
 el.querySelector('.close').onclick=()=>{el.remove();wins=wins.filter(x=>x!==el);renderDock()};
 el.querySelector('.minimize').onclick=()=>{el.style.display='none';el.classList.add('minimized');renderDock()};
 el.querySelector('.maximize').onclick=()=>el.classList.toggle('max');
 renderDock();return el;
}
const dockApps=[['📁','Файлы','fm'],['🌐','Браузер','browser'],['⌨️','Терминал','terminal'],['🧮','Калькулятор','calc'],['⚙️','Настройки','settings'],['🛍️','Магазин','store'],['🗑️','Корзина','trash']];
function renderDock(){$('#dock').innerHTML='';dockApps.forEach(([ic,n,a])=>{let b=document.createElement('button');b.className='dockbtn'+(wins.some(w=>w.dataset.app===a)?' running':'');b.innerHTML=ic+`<span class="tip">${n}</span>`;b.onclick=()=>{let w=wins.find(x=>x.dataset.app===a);if(w){w.style.display='flex';w.classList.remove('minimized');focusWin(w)}else launch(a)};$('#dock').appendChild(b)})}
const iconFiles={windowsweb:['Папка windowsweb','📁'],builds:['Архив сборок','📁'],pc:['Этот компьютер','🖥️'],home:['Домашняя папка','🏠'],browser:['Браузер','🌐'],terminal:['Терминал','⌨️'],obs:['OBS Studio','🎥'],hmcl:['HMCL','⛏️'],trash:['Корзина','🗑️']};
function launch(app){
 if(app==='fm'||app==='windowsweb'||app==='builds'||app==='home')return fileManager(app);
 if(app==='pc')return openWin('pc','Этот компьютер',`<div class="section">Устройства и диски</div><div class="card">💽 <b>Файловая система /</b><p class="muted">Deepin 25 · виртуальный диск</p><div style="height:7px;background:#263b5d;border-radius:5px"><div style="height:100%;width:38%;background:#3da7ff;border-radius:5px"></div></div><small class="muted">58 ГБ занято из 512 ГБ (демо)</small></div><p class="card">🧠 Память · ⚡ Процессор · 🎮 Графика</p>`,460,280,'🖥️');
 if(app==='browser')return browser();
 if(app==='terminal')return terminal();
 if(app==='calc')return calculator();
 if(app==='settings')return settings();
 if(app==='trash')return openWin('trash','Корзина',`<div class="card" style="text-align:center;padding:40px">🗑️<h3>Корзина пуста</h3><p class="muted">Здесь пока ничего нет.</p></div>`,380,230,'🗑️');
 if(app==='obs')return openWin('obs','OBS Studio · демо',`<div class="card"><h2>🎥 OBS Studio</h2><p>Виртуальная демонстрация интерфейса</p><p class="muted">Сцена: Рабочий стол · Источник: Экран (макет)</p><button class="btn" onclick="toast('Демо: запись не создаётся')">⏺ Начать запись</button></div>`,440,260,'🎥');
 if(app==='hmcl')return openWin('hmcl','HMCL — Minecraft',`<div class="card"><h2>⛏️ Minecraft Launcher</h2><p>Профиль: Fabric 1.16.5</p><p class="muted">Это макет лаунчера; настоящая игра не запускается.</p><button class="btn" onclick="toast('Мир «Nova» готов… в демо 😄')">▶ Запустить</button></div>`,420,250,'⛏️');
 if(app==='store'||app==='apps')return openWin('apps','Приложения',`<div class="filegrid">${dockApps.map(([ic,n,a])=>`<div class="fileitem" onclick="launch('${a}')"><span>${ic}</span><small>${n}</small></div>`).join('')}</div>`,440,320,'🌌');
}
function fileManager(app='fm'){
 const names=app==='windowsweb'?['vssesuperbild.html','opencode.html','DEEPSEEK.html','deepseek.html','gigschat.html','prompt.txt','index.html','README.md']:app==='builds'?['index.html','styles.css','gallery.js','README.md','DEEPSEEK.html','gigschat.html','prompt.txt']:['Desktop','Documents','Downloads','Music','Pictures','Videos','.config','.local','windowsweb','windowsweb-builds'];
 const title=app==='home'?'Домашняя папка':app==='windowsweb'?'windowsweb':app==='builds'?'windowsweb-builds': 'Файлы';
 const body=`<div class="toolbar"><button onclick="toast('Назад')">‹</button><button onclick="toast('Вперёд')">›</button><button onclick="fileManager('fm')">⌂</button><input class="address" value="${title}" readonly><button onclick="toast('Поиск в демо')">⌕</button></div><div class="section"> ${title}</div><div class="filegrid">${names.map(n=>{let dir=!n.includes('.');let ico=dir?'📁':n.endsWith('.html')?'🌐':n.endsWith('.md')||n.endsWith('.txt')?'📄':n.endsWith('.css')?'🎨':'🧩';return `<div class="fileitem" onclick="toast('${n.replace(/'/g,'')} · виртуальный файл')"><span>${ico}</span><small>${n}</small></div>`}).join('')}</div>`;
 return openWin('fm','Файлы — '+title,body,570,390,'📁');
}
function browser(){return openWin('browser','Браузер',`<div class="toolbar"><button onclick="toast('Назад')">‹</button><button onclick="toast('Обновлено')">↻</button><input class="address" id="url" value="https://vany201847dody-art.github.io/windowsweb/"><button onclick="goUrl()">Перейти</button></div><div class="card" style="background:linear-gradient(130deg,#102d62,#0c1a39);padding:20px"><div style="font-size:11px;color:#83caff">VIZOR · WEB PROJECTS</div><h2 style="margin:8px 0">Сборки Windows в браузере</h2><p class="muted">Проект windowsweb — один HTML, много возможностей.</p><div class="filegrid"><div class="fileitem" onclick="window.open('https://vany201847dody-art.github.io/windowsweb/','_blank')"><span>🪟</span><small>Итоговая ОС</small></div><div class="fileitem" onclick="window.open('https://vany201847dody-art.github.io/windowsweb-builds/','_blank')"><span>🗂️</span><small>Галерея сборок</small></div><div class="fileitem" onclick="window.open('https://github.com/vany201847dody-art/windowsweb','_blank')"><span>🐙</span><small>GitHub</small></div></div></div><p class="muted">Офлайн-оболочка. Ссылки открываются в новой вкладке, если интернет доступен.</p>`,590,380,'🌐')}
function goUrl(){let u=$('#url')?.value;if(u){if(!/^https?:\/\//i.test(u))u='https://'+u;window.open(u,'_blank')}}
function calculator(){let el=openWin('calc','Калькулятор',`<div class="calc"><div class="display" id="display">0</div>${['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(k=>`<button class="${['÷','×','−','+'].includes(k)?'op':''} ${k==='='?'eq':''}" data-key="${k}">${k}</button>`).join('')}</div>`,320,390,'🧮');let val='';const out=el.querySelector('#display');el.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='C')val='';else if(k==='⌫')val=val.slice(0,-1);else if(k==='='){try{let exp=val.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+\-*/().\s]+$/.test(exp))throw 0;let result=Function('"use strict";return ('+exp+')')();val=Number.isFinite(result)?String(result):'Ошибка'}catch{val='Ошибка'}}else val+=k;out.textContent=val||'0'});return el}
function terminal(){let el=openWin('terminal','Терминал',`<div class="term" id="term"><div class="termout" id="termout">NovaShell terminal 1.0 · виртуальная среда\nВведите <b>help</b> для списка команд.\n</div><div class="termline"><b>vizor@nova:~$</b><input id="cmd" autocomplete="off" spellcheck="false"></div></div>`,600,370,'⌨️');let input=el.querySelector('#cmd'),out=el.querySelector('#termout'),term=el.querySelector('#term');input.focus();input.onkeydown=e=>{if(e.key!=='Enter')return;let c=input.value.trim(),p=c.split(/\s+/),cmd=p[0];out.innerHTML+=`\n<span style="color:#68baff">vizor@nova:~$ ${escapeHTML(c)}</span>\n`;let result={'help':'Команды: help, whoami, uname, neofetch, ls, date, echo, pwd, clear, fastfetch','whoami':'vizor','uname':'Linux nova-shell 6.6-deepin x86_64 GNU/Linux','ls':'Desktop/  Documents/  Downloads/  windowsweb/  windowsweb-builds/  prompt.txt','pwd':'/home/vizor','date':new Date().toLocaleString('ru-RU'),'neofetch':'       ◢████◣     vizor@nova\n      ◢██████◣    OS: Deepin 25 (макет)\n      ◥██████◤    DE: NovaShell / XFCE-inspired\n       ◥████◤     Kernel: 6.6-deepin\n                  Terminal: NovaTerm\n                  Статус: работает в браузере','fastfetch':'NovaShell 1.0 · Vizor · офлайн'};if(!c){}else if(cmd==='clear'){out.textContent=''}else if(cmd==='echo')out.textContent+='\n'+c.slice(5);else if(result[cmd])out.textContent+='\n'+result[cmd];else if(cmd==='sudo')out.textContent+='\nsudo: в виртуальной оболочке права администратора не реализованы';else if(cmd==='rm')out.textContent+='\nОперация над реальными файлами невозможна: это безопасная симуляция.';else out.textContent+=`\nbash: ${cmd}: команда не найдена`;input.value='';term.scrollTop=term.scrollHeight};return el}
function escapeHTML(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function settings(){let el=openWin('settings','Настройки',`<div class="settings-layout"><nav class="settings-nav"><button class="active" data-tab="wall">🎨 Обои</button><button data-tab="about">ℹ️ О системе</button><button data-tab="appearance">✨ Внешний вид</button><button data-tab="power">⏻ Питание</button></nav><div id="settingbody"><h3>Обои рабочего стола</h3><p class="muted">Выбери настроение для NovaShell.</p><div class="wallchoices">${wallpaper.map((wp,i)=>`<div class="wallchoice" data-wall="${i}" style="background:${wp}"></div>`).join('')}</div><p class="muted">Выбор сохраняется в браузере.</p></div></div>`,560,320,'⚙️');const content=el.querySelector('#settingbody');el.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>setWallpaper(+b.dataset.wall));el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{el.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));let tab=b.dataset.tab;if(tab==='wall')content.innerHTML=`<h3>Обои рабочего стола</h3><p class="muted">Выбери настроение для NovaShell.</p><div class="wallchoices">${wallpaper.map((wp,i)=>`<div class="wallchoice ${i===+(localStorage.getItem('novawp')||0)?'active':''}" data-wall="${i}" style="background:${wp}"></div>`).join('')}</div><p class="muted">Выбор сохраняется в браузере.</p>`;if(tab==='about')content.innerHTML=`<h3>NovaShell</h3><div class="card"><div style="font-size:25px">🌌 NovaShell 1.0</div><p>Автор: <b>Vizor</b></p><p>Основа макета: Deepin 25 · XFCE-inspired</p><p>Сборка: 10.0.99999 · 2026</p><p class="muted">Однофайловая офлайн-симуляция рабочего стола. Не является настоящей операционной системой.</p></div>`;if(tab==='appearance')content.innerHTML=`<h3>Внешний вид</h3><p>Акцентный цвет интерфейса</p><div class="wallchoices"><button class="btn" onclick="document.documentElement.style.setProperty('--accent','#39a0ff')">Синий</button><button class="btn" onclick="document.documentElement.style.setProperty('--accent','#b46aff')">Фиолетовый</button><button class="btn" onclick="document.documentElement.style.setProperty('--accent','#42d6b0')">Бирюзовый</button></div><p class="muted">Цвет применяется к активным элементам.</p>`;if(tab==='power')content.innerHTML=`<h3>Питание</h3><div class="card"><p>🔒 Блокировка экрана</p><button class="btn" onclick="lockScreen()">Заблокировать</button><p>↻ Перезапуск оболочки</p><button class="btn" onclick="location.reload()">Перезагрузить макет</button></div>`;content.querySelectorAll('[data-wall]').forEach(x=>x.onclick=()=>setWallpaper(+x.dataset.wall))});setWallpaper(+(localStorage.getItem('novawp')||0));return el}
function lockScreen(){$('#boot').classList.remove('hide');$('#boot').querySelector('.logo').innerHTML='Экран <span>заблокирован</span>';$('#boot').querySelector('.muted').textContent='Нажми, чтобы вернуться на рабочий стол'}
function about(){return launch('settings')}
function showContext(x,y){let c=$('#context');c.innerHTML='';[['🎨 Сменить обои',()=>settings()],['📁 Файлы',()=>launch('fm')],['⌨️ Терминал',()=>launch('terminal')],['🧮 Калькулятор',()=>launch('calc')],['ℹ️ О системе',()=>{let w=launch('settings');w.querySelector('[data-tab="about"]').click()}],['🔒 Заблокировать',lockScreen],['↻ Перезагрузить',()=>location.reload()]].forEach(([t,fn])=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{c.style.display='none';fn()};c.appendChild(b)});c.style.display='block';c.style.left=Math.min(x,innerWidth-215)+'px';c.style.top=Math.min(y,innerHeight-290)+'px'}
$('#desktop').addEventListener('contextmenu',e=>{e.preventDefault();showContext(e.clientX,e.clientY)});addEventListener('click',e=>{if(!e.target.closest('#context'))$('#context').style.display='none'});$$('.dicon').forEach(el=>{el.addEventListener('click',()=>{$$('.dicon').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')});el.addEventListener('dblclick',()=>launch(el.dataset.app))});$('#panel').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>launch(b.dataset.open));$('#start').onclick=()=>launch('apps');$('#boot').onclick=()=>{$('#boot').classList.add('hide');if($('#boot .logo').textContent.includes('заблокирован')){$('#boot .logo').innerHTML='Nova<span>Shell</span>';$('#boot .muted').textContent='Рабочая среда Vizor · офлайн'}};
function tick(){let d=new Date();$('#panelclock').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});$('#clockbig').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});$('#clockdate').textContent=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}tick();setInterval(tick,1000);setTimeout(()=>$('#boot').classList.add('hide'),1800);setWallpaper(+(localStorage.getItem('novawp')||0));renderDock();
</script>
