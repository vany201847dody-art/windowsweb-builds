function bindClock(){let mode='analog',sw=0,start=0,running=false,iv,tm={};function draw(){let c=$('#clockcontent');if(!c)return;if(mode==='analog'){let d=new Date();c.innerHTML=`<div style="width:min(250px,65vw);aspect-ratio:1;border:3px solid #ffffff55;border-radius:50%;margin:15px auto;position:relative;background:radial-gradient(circle,#ffffff0b,#0002)">${Array.from({length:60},(_,i)=>`<i style="position:absolute;left:calc(50% - 1px);top:6px;width:2px;height:${i%5===0?12:5}px;background:#fff9;transform-origin:1px ${Math.min(250,innerWidth*.65)/2-10}px;transform:rotate(${i*6}deg)"></i>`).join('')}<i style="position:absolute;left:50%;bottom:50%;width:5px;height:27%;background:white;transform-origin:bottom;transform:rotate(${(d.getHours()%12)*30+d.getMinutes()*.5}deg)"></i><i style="position:absolute;left:50%;bottom:50%;width:3px;height:37%;background:white;transform-origin:bottom;transform:rotate(${d.getMinutes()*6+d.getSeconds()*.1}deg)"></i><i style="position:absolute;left:50%;bottom:50%;width:1px;height:42%;background:var(--a);transform-origin:bottom;transform:rotate(${d.getSeconds()*6}deg)"></i></div><div class="big">${time()}</div><div class="muted">${date()}</div>`}else if(mode==='world'){let cities=[['🇷🇺','Москва','Europe/Moscow'],['🇬🇧','Лондон','Europe/London'],['🇺🇸','Нью-Йорк','America/New_York'],['🇯🇵','Токио','Asia/Tokyo'],['🇦🇪','Дубай','Asia/Dubai'],['🇦🇺','Сидней','Australia/Sydney']];c.innerHTML=`<div class="grid2">${cities.map(([f,n,z])=>`<div class="card">${f} ${n}<div class="big" style="font-size:25px">${new Intl.DateTimeFormat('ru-RU',{timeZone:z,hour:'2-digit',minute:'2-digit'}).format(new Date())}</div><small class="muted">${z}</small></div>`).join('')}</div>`}else if(mode==='stopwatch'){let ms=sw+(running?performance.now()-start:0);c.innerHTML=`<div class="big">${fmtms(ms)}</div><div class="toolbar" style="justify-content:center"><button class="primary" id="swgo">${running?'Пауза':'Старт'}</button><button id="swreset">Сброс</button><button id="swlap">Круг</button></div><div id="laps">${(tm.laps||[]).map((x,i)=>`<div class="listrow">Круг ${i+1}<b>${x}</b></div>`).join('')}</div>`;$('#swgo').onclick=()=>{if(running){sw+=performance.now()-start;running=false}else{start=performance.now();running=true}draw()};$('#swreset').onclick=()=>{running=false;sw=0;tm.laps=[];draw()};$('#swlap').onclick=()=>{tm.laps=tm.laps||[];tm.laps.unshift(fmtms(sw+(running?performance.now()-start:0)));draw()}}else{c.innerHTML=`<div class="row" style="justify-content:center"><input id="th" type="number" min="0" max="99" value="0" style="width:65px"><input id="tmin" type="number" min="0" max="59" value="1" style="width:65px"><input id="ts" type="number" min="0" max="59" value="0" style="width:65px"></div><div class="big" id="tdisplay">${fmtsec(tm.left??60)}</div><button class="primary" id="tgo">${tm.running?'Пауза':'Старт'}</button> <button id="treset">Сброс</button><p class="muted small">Часы · минуты · секунды</p>`;$('#tgo').onclick=()=>{if(tm.running){clearInterval(tm.iv);tm.running=false;draw()}else{tm.left=tm.left??(+$('#th').value*3600+ +$('#tmin').value*60+ +$('#ts').value);if(tm.left<=0)return;tm.running=true;tm.iv=setInterval(()=>{tm.left--;let e=$('#tdisplay');if(e)e.textContent=fmtsec(Math.max(0,tm.left));if(tm.left<=0){clearInterval(tm.iv);tm.running=false;tm.left=null;notify('Таймер','Время вышло!','⏲');draw()}},1000);draw()}};$('#treset').onclick=()=>{clearInterval(tm.iv);tm={};draw()}}}$$('[data-clock]').forEach(b=>b.onclick=()=>{mode=b.dataset.clock;draw()});draw();iv=setInterval(()=>{if(!wins.has('clock'))clearInterval(iv);else if(mode==='analog'||mode==='world')draw();else if(mode==='stopwatch'&&running){let e=$('#clockcontent .big');if(e)e.textContent=fmtms(sw+performance.now()-start)}},500)}function fmtms(ms){let cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`}function fmtsec(s){return `${String( function bindQR(){function gen(){let text=$('#qrtext').value,type=$('#qrtype').value;if(type==='URL'&&!/^https?:/.test(text))text='https://'+text;if(type==='Телефон')text='tel:'+text;if(type==='Email')text='mailto:'+text;if(type==='Wi-Fi')text='WIFI:T:WPA;S:'+text+';P:password;;';let c=$('#qrcanvas'),x=c.getContext('2d'),n=29,seed=2166136261;for(let ch of text)seed=Math.imul(seed^ch.charCodeAt(0),16777619);let a=[];for(let y=0;y<n;y++){a[y]=[];for(let z=0;z<n;z++){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;a[y][z]=(seed>>>0)%2===0}}function finder(x0,y0){for(let y=0;y<7;y++)for(let x1=0;x1<7;x1++)a[y0+y][x0+x1]=(x1===0||x1===6||y===0||y===6||(x1>=2&&x1<=4&&y>=2&&y<=4))?1:0}finder(0,0);finder(n-7,0);finder(0,n-7);x.fillStyle='#fff';x.fillRect(0,0,250,250);x.fillStyle='#111';for(let y=0;y<n;y++)for(let z=0;z<n;z++)if(a[y][z])x.fillRect(10+z*8,10+y*8,8,8);$('#qrdecoded').textContent=text}$('#qrmaker').onclick=gen;gen()}
async function bindCamera(){let gallery=[];async function start(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Камера недоступна. Нужен HTTPS или localhost.');stopCam();camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:state.camFacing||'user'},audio:false});$('#camvideo').srcObject=camStream;$('#camvideo').style.display='block';$('#cammsg').classList.add('hidden');$('#camcontrols').classList.remove('hidden')}catch(e){$('#cammsg').classList.remove('hidden');$('#cammsg').innerHTML=`<div style="font-size:40px">📷</div><h3>Не удалось включить камеру</h3><p class="muted small">${esc(e.message)}</p><button class="primary" id="camretry">Повторить</button>`;$('#camretry').onclick=start}}$('#camstart').onclick=start;$('#camshot').onclick=()=>{let v=$('#camvideo'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;let x=c.getContext('2d');if(state.camFacing!=='environment'){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(v,0,0);c.toBlob(blob=>{let url=URL.createObjectURL(blob);gallery.unshift({blob,url});$('#camgallery').innerHTML=gallery.map((g,i)=>`<button data-campic="${i}"><img src="${g.url}" style="width:60px;height:50px;object-fit:cover"></button>`).join('');$$('[data-campic]').forEach(b=>b.onclick=()=>downloadBlob(gallery[+b.dataset.campic].blob,'NovaOS-photo.png'));notify('Камера','Снимок сохранён','📸')})};$('#camswitch').onclick=()=>{state.camFacing=state.camFacing==='environment'?'user':'environment';start()};$('#camstop').onclick=stopCam}function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}let v=$('#camvideo');if(v){v.srcObject=null;v.style.display='none'}$('#camcontrols')?.classList.add('hidden')}
function bindRecorder(){let rec,chunks=[],records=[],iv,started;$('#recstart').onclick=async()=>{try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'}),url=URL.createObjectURL(blob);records.unshift({blob,url,size:blob.size,time:time()});draw();notify('Диктофон','Запись сохранена','🎤')};rec.start();started=Date.now();$('#recstart').classList.add('hidden');$('#recstop').classList.remove('hidden');iv=setInterval(()=>$('#rectime').textContent=fmtsec(Math.floor((Date.now()-started)/1000)),500)}catch(e){$('#recmsg').textContent='Нет доступа к микрофону. Проверьте разрешение и HTTPS.'}};$('#recstop').onclick=()=>{if(rec&&rec.state!=='inactive')rec.stop();clearInterval(iv);$('#recstart').classList.remove('hidden');$('#recstop').classList.add('hidden')};function draw(){$('#reclist').innerHTML=records.map((r,i)=>`<div class="card"><div class="row"><b>Запись ${records.length-i}</b><button data-recdown="${i}">⬇ Скачать</button></div><small class="muted">${r.time} · ${(r.size/1024).toFixed(1)} КБ</small><audio controls src="${r.url}" style="width:100%"></audio></div>`).join('');$$('[data-recdown]').forEach(b=>b.onclick=()=>downloadBlob(records[+b.dataset.recdown].blob,'NovaOS-recording.webm'))}recStop=()=>{if(rec&&rec.state!=='inactive')rec.stop();clearInterval(iv)}}
function bindMusic(){let tracks=[['Космическая одиссея','linear-gradient(135deg,#7c3aed,#ec4899,#f59e0b)'],['Северное сияние','linear-gradient(135deg,#047857,#0ea5e9)'],['Ночной город','linear-gradient(135deg,#1d4ed8,#111827)']],i=0,playing=false,sec=0,iv;function draw(){$('#trackname').textContent=tracks[i][0];$('#album').style.background=tracks[i][1];$('#musicprogress').value=sec;$('#musictime').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')+' / 3:00';$('#musicplay').textContent=playing?'⏸':'▶'}function step(n){i=(i+n+tracks.length)%tracks.length;sec=0;draw()}$('#musicplay').onclick=()=>{playing=!playing;clearInterval(iv);if(playing)iv=setInterval(()=>{sec=(sec+1)%181;draw()},1000);draw()};$('#musicprev').onclick=()=>step(-1);$('#musicnext').onclick=()=>step(1);$('#musicprogress').oninput=e=>{sec=+e.target.value;draw()};draw()}
function bindNotes(){let ns=state.notes||[];if(!ns.length)ns=[{id:Date.now(),title:'Добро пожаловать',body:'Это ваши заметки NovaOS.'}];let current=ns[0].id;function save(){let n=ns.find(x=>x.id===current);if(n){n.title=$('#notetitle').value;n.body=$('#notebody').value;state.notes=ns;persist();$('#notestatus').textContent='Сохранено '+time();list()}}function list(){$('#notelist').innerHTML=ns.map(n=>`<button data-note="${n.id}" style="display:block;width:100%;text-align:left;margin-top:5px;background:${n.id===current?'#ffffff20':'transparent'}"><b>${esc(n.title||'Без названия')}</b><div class="muted small">${esc(n.body.slice(0,30))}</div></button>`).join('');$$('[data-note]').forEach(b=>b.onclick=()=>openNote(+b.dataset.note))}function openNote(id){save();current=id;let n=ns.find(x=>x.id===id);$('#notetitle').value=n.title;$('#notebody').value=n.body;list()}$('#noteadd').onclick=()=>{save();let n={id:Date.now(),title:'Новая заметка',body:''};ns.unshift(n);openNote(n.id)};$('#notetitle').oninput=save;$('#notebody').oninput=save;openNote(current)}function bindTasks(){function draw(){$('#tasktable').innerHTML=`<div class="listrow"><b>Приложение</b><b>ОЗУ (оценка)</b><b>Действие</b></div>`+[...wins.keys()].map(id=>`<div class="listrow"><span>${app(id)[1]} ${app(id)[2]}</span><span>${20+id.length*7} МБ</span><button data-kill="${id}">Завершить</button></div>`).join('');$$('[data-kill]').forEach(b=>b.onclick=()=>{close(b.dataset.kill);draw()})}$('#taskrefresh').onclick=draw;draw()}
function bindMines(){let board,rev,flags,over;function init(){board=Array.from({length:81},()=>({m:false,n:0}));let set=new Set();while(set.size<10)set.add(Math.floor(Math.random()*81));set.forEach(i=>board[i].m=true);board.forEach((c,i)=>{if(c.m)return;let x=i%9,y=Math.floor(i/9);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let xx=x+dx,yy=y+dy;if(xx>=0&&xx<9&&yy>=0&&yy<9&&board[yy*9+xx].m)c.n++}});rev=new Set();flags=new Set();over=false;$('#minestatus').textContent='Клик — открыть, ПКМ — флаг.';draw()}function reveal(i){if(over||rev.has(i)||flags.has(i))return;rev.add(i);if(board[i].m){over=true;board.forEach((c,j)=>{if(c.m)rev.add(j)});$('#minestatus').textContent='Игра окончена — мина!';notify('Сапёр','Игра окончена','💣')}else if(board[i].n===0){let x=i%9,y=Math.floor(i/9);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){let xx=x+dx,yy=y+dy;if(xx>=0&&xx<9&&yy>=0&&yy<9)reveal(yy*9+xx)}}if(rev.size===71){over=true;$('#minestatus').textContent='Победа!';notify('Сапёр','Победа!','🏆')}draw()}function draw(){$('#mineleft').textContent=10-flags.size;$('#mineboard').innerHTML=board.map((c,i)=>`<button class="cell" data-mine="${i}" style="padding:0;font-size:13px;min-width:0;background:${rev.has(i)&&c.m?'#a52a3a':rev.has(i)?'#ffffff24':''}">${flags.has(i)?'🚩':rev.has(i)?c.m?'💣':c.n||'':''}</button>`).join('');$$('[data-mine]').forEach(b=>{b.onclick=()=>reveal(+b.dataset.mine);b.oncontextmenu=e=>{e.preventDefault();let i=+b.dataset.mine;if(!over&&!rev.has(i)){flags.has(i)?flags.delete(i):flags.add(i);draw()}}})}$('#minereset').onclick=init;init()}
function bindSnake(){let c=$('#snakecanvas'),ctx=c.getContext('2d'),s,food,dir,score,iv,over;function init(){clearInterval(iv);s=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};score=0;over=false;food={x:14,y:8};$('#snakescore').textContent=0;draw();iv=setInterval(step,135)}function draw(){ctx.fillStyle='#08150f';ctx.fillRect(0,0,360,360);ctx.fillStyle='#35d07f';s.forEach(p=>ctx.fillRect(p.x*20+1,p.y*20+1,18,18));ctx.fillStyle='#ff5a65';ctx.fillRect(food.x*20+2,food.y*20+2,16,16)}function step(){if(over)return;let h={x:s[0].x+dir.x,y:s[0].y+dir.y};if(h.x<0||h.x>=18||h.y<0||h.y>=18||s.some(p=>p.x===h.x&&p.y===h.y)){over=true;clearInterval(iv);notify('Змейка','Игра окончена. Счёт: '+score,'🐍');return}s.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;$('#snakescore').textContent=score;food={x:Math.floor(Math.random()*18),y:Math.floor(Math.random()*18)}}else s.pop();draw()}function key(e){if(!wins.has('snake'))return;let d={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}}[e.key];if(d&&!(d.x===-dir.x&&d.y===-dir.y)){dir=d;e.preventDefault()}}window.addEventListener('keydown',key);$('#snakereset').onclick=init;init()}
function bind2048(){let b,score=0;function init(){b=Array(16).fill(0);score=0;add();add();draw()}function add(){let e=b.map((x,i)=>x?null:i).filter(x=>x!==null);if(e.length)b[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}function draw(){$('#2048score').textContent=score;$('#2048board').innerHTML=b.map(v=>`<div class="tile2048 v${v||0}">${v||''}</div>`).join('')}function move(d){let old=b.join(',');for(let line=0;line<4;line++){let ids=Array.from({length:4},(_,i)=>d==='left'?line*4+i:d==='right'?line*4+3-i:d==='up'?i*4+line:(3-i)*4+line),vals=ids.map(i=>b[i]).filter(Boolean),o=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){o.push(vals[i]*2);score+=vals[i]*2;i++}else o.push(vals[i])}while(o.length<4)o.push(0);ids.forEach((id,j)=>b[id]=o[j])}if(old!==b.join(',')){add();draw();if(b.includes(2048))notify('2048','Вы собрали 2048!','🏆')}}function key(e){if(!wins.has('2048')||wins.get('2048').min)return;let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}}window.addEventListener('keydown',key);$('#2048reset').onclick=init;init()}
function bindMemory(){let sym=['🍎','🍋','🍇','🍒','🍉','🍓','🥝','🍍'],deck,pick,match,moves,lock;function init(){deck=[...sym,...sym].sort(()=>Math.random()-.5);pick=[];match=new Set();moves=0;lock=false;draw()}function draw(){$('#memmoves').textContent=moves;$('#memoryboard').innerHTML=deck.map((s,i)=>`<button class="cell" data-mem="${i}" style="height:65px">${match.has(i)||pick.includes(i)?s:'❔'}</button>`).join('');$$('[data-mem]').forEach(b=>b.onclick=()=>{let i=+b.dataset.mem;if(lock||match.has(i)||pick.includes(i))return;pick.push(i);draw();if(pick.length===2){moves++;if(deck[pick[0]]===deck[pick[1]]){pick.forEach(j=>match.add(j));pick=[];draw();if(match.size===16)notify('Память','Все пары найдены за '+moves+' ходов!','🏆')}else{lock=true;setTimeout(()=>{pick=[];lock=false;draw()},700)}}})}$('#memreset').onclick=init;init()}
function bindTTT(){let b,over;function win(){for(let [a,c,d] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.every(Boolean)?'draw':null}function draw(){$('#tttboard').innerHTML=b.map((x,i)=>`<button class="cell" data-ttt="${i}" style="height:80px;font-size:28px;color:${x==='X'?'#60a5fa':'#f472b6'}">${x}</button>`).join('');$$('[data-ttt]').forEach(x=>x.onclick=()=>play(+x.dataset.ttt))}function ai(){let empty=b.map((x,i)=>x?null:i).filter(x=>x!==null);for(let p of ['O','X'])for(let i of empty){b[i]=p;let v=win();b[i]='';if(v===p)return i}if(!b[4])return 4;for(let i of [0,2,6,8])if(!b[i])return i;return empty[0]??-1}function finish(v){over=true;$('#tttstatus').textContent=v==='draw'?'Ничья!':v==='X'?'Вы победили!':'Компьютер победил';draw();notify('Крестики-нолики',$('#tttstatus').textContent,'⭕')}function play(i){if(over||b[i])return;b[i]='X';let v=win();if(v)return finish(v);let j=ai();if(j>=0)b[j]='O';v=win();if(v)finish(v);draw()}function init(){b=Array(9).fill('');over=false;$('#tttstatus').textContent='Ваш ход — X';draw()}$('#tttreset').onclick=init;init()}
function renderCal(){let d=calendarMonth,y=d.getFullYear(),m=d.getMonth(),start=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells=[];for(let i=0;i<42;i++){let n,cl='';if(i<start){n=prev-start+i+1;cl='muted'}else if(i>=start+days){n=i-start-days+1;cl='muted'}else{n=i-start+1;if(y===new Date().getFullYear()&&m===new Date().getMonth()&&n===new Date().getDate())cl='primary'}cells.push(`<span class="${cl}" style="padding:7px 0;text-align:center;border-radius:8px">${n}</span>`)}$('#calfly').innerHTML=`<div class="big">${time()}</div><div class="muted">${date()}</div><div class="row" style="margin-top:12px"><b>${d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><span><button id="calprev">‹</button><button id="calnext">›</button></span></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin-top:8px">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<span class="muted">${x}</span>`).join('')}${cells.join('')}</div>`;$('#calprev').onclick=()=>{calendarMonth=new Date(y,m-1,1);renderCal()};$('#calnext').onclick=()=>{calendarMonth=new Date(y,m+1,1);renderCal()}}function renderVol(){$('#volfly').innerHTML=`<h3>🔊 Звук</h3><div class="slider">${state.volume===0?'🔇':state.volume<45?'🔉':'🔊'}<input id="volrange" type="range" min="0" max="100" value="${state.volume}"><b id="volval">${state.volume}%</b></div><div class="muted small">Громкость симуляции</div>`;$('#volrange').oninput=e=>{state.volume=+e.target.value;$('#volval').textContent=state.volume+'%';$('#volbtn').textContent=state.volume===0?'🔇':state.volume<45?'🔉':'🔊';persist()}}function renderNotif(){$('#badge').textContent=state.notifications.length||'';$('#notifly').innerHTML=`<div class="panelhead"><h3>Уведомления</h3><button id="clearalerts">Очистить</button></div><div class="quicktiles">${[['📶','Wi-Fi','wifi'],['ᛒ','Bluetooth','bluetooth'],['✈️','Авиарежим','airplane'],['🌙','Ночной свет','night'],['🎯','Фокус','focus'],['⏺','Запись экрана','recording']].map(([i,n,k])=>`<button class="tile ${state[k]?'on':''}" data-toggle="${k}"><span style="font-size:20px">${i}</span>${n}</button>`).join('')}</div><div class="slider">🔊<input id="nvol" type="range" min="0" max="100" value="${state.volume}"><b>${state.volume}%</b></div><div class="slider">☀️<input id="nbright" type="range" min="20" max="100" value="${state.brightness}"><b>${state.brightness}%</b></div><b>Последние события</b>${state.notifications.length?state.notifications.map(n=>`<div class="card" style="margin-top:7px"><b>${n.icon} ${esc(n.title)} <small class="muted">${n.time}</small></b><div>${esc(n.msg)}</div></div>`).join(''):'<p class="muted" style="text-align:center">Нет новых уведомлений</p>'}`;$('#clearalerts').onclick=()=>{state.notifications=[];persist();renderNotif()};$$('[data-toggle]').forEach(b=>b.onclick=()=>{let k=b.dataset.toggle;state[k]=!state[k];if(k==='airplane'&&state.airplane)state.wifi=false;persist();renderNotif();if(k==='recording')notify('Запись экрана',state.recording?'Запись включена (симуляция)':'Запись остановлена','⏺')});$('#nvol').oninput=e=>{state.volume=+e.target.value;persist();renderNotif()};$('#nbright').oninput=e=>{state.brightness=+e.target.value;$('#desktop').style.filter=`brightness(${state.brightness/100})`;persist()}}
function power(action){hidePanels();let sh=$('#shutdown');sh.classList.remove('hidden');if(action==='sleep'){sh.innerHTML='<div style="font-size:40px">🌙</div><div>Спящий режим...</div>';setTimeout(()=>{sh.classList.add('hidden');sh.innerHTML='<div class="spinner"></div><div id="shutdowntext">Завершение работы...</div>';notify('Питание','Выход из спящего режима','🌙')},2000)}else if(action==='restart'){sh.innerHTML='<div class="spinner"></div><div>Перезагрузка NovaOS...</div>';setTimeout(()=>location.reload(),2500)}else{sh.innerHTML='<div class="spinner"></div><div>Завершение работы...</div>';setTimeout(()=>{sh.querySelector('.spinner').classList.add('hidden');sh.lastElementChild.textContent='Компьютер выключен. Обновите страницу, чтобы включить снова.'},5000)}}
function boot(){apply();clocks();setInterval(clocks,1000);setTimeout(()=>{$('#boot').classList.add('hidden');$('#lock').classList.remove('hidden')},2500);$('#lock').onclick=()=>{$('#lock').style.opacity=0;setTimeout(()=>{$('#lock').classList.add('hidden');$('#desktop').classList.remove('hidden');renderIcons();renderStart();renderTask();notify('Добро пожаловать','NovaOS готова к работе','🟦')},400)};$('#startbtn').onclick=()=>toggle('startmenu');$('#startsearch').oninput=renderStart;$('#tasksearch').onkeydown=e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase(),a=apps.find(x=>x[2].toLowerCase().includes(q));if(a)open(a[0]);else{open('browser');setTimeout(()=>{$('#baddress').value=q;$('#bgo').click()},50)}}};$('#calbtn').onclick=()=>toggle('calfly');$('#volbtn').onclick=()=>toggle('volfly');$('#notifbtn').onclick=()=>toggle('notifly');$('#wifibtn').onclick=()=>toggle('notifly');$('#batbtn').onclick=()=>notify('Питание','Заряд батареи: 100% (симуляция)','🔋');$('#powerbtn').onclick=()=>$('#powermenu').classList.toggle('hidden');$$('[data-power]').forEach(b=>b.onclick=()=>power(b.dataset.power));$('#desktop').onclick=e=>{if(e.target.id==='desktop'||e.target.id==='windows'){$$('.deskicon').forEach(x=>x.classList.remove('selected'));hidePanels();$('#context').classList.add('hidden')}};$('#desktop').oncontextmenu=e=>{if(e.target.id==='desktop'){e.preventDefault();context(e.clientX,e.clientY,[['Обновить',()=>{renderIcons();notify('Рабочий стол','Обновлено','🔄')}],['Персонализация',()=>open('settings')],['О системе',()=>open('about')]])}};document.addEventListener('pointerdown',e=>{if(!e.target.closest('#context'))$('#context').classList.add('hidden');if(!e.target.closest('#startmenu')&&!e.target.closest('#startbtn')&&!e.target.closest('#powerbtn'))$('#startmenu').classList.add('hidden');if(!e.target.closest('.flyout')&&!e.target.closest('#calbtn')&&!e.target.closest('#volbtn')&&!e.target.closest('#notifbtn')&&!e.target.closest('#wifibtn'))['calfly','volfly','notifly'].forEach(x=>$('#'+x).classList.add('hidden'))});document.addEventListener('keydown',e=>{if(e.key==='Escape'){hidePanels();$('#context').classList.add('hidden')}if((e.metaKey||e.ctrlKey&&e.key==='Escape')&&!e.repeat){e.preventDefault();toggle('startmenu')}if(e.altKey&&e.key==='F4'&&active){e.preventDefault();close(active)}});renderNotif()}boot();
</script></body></html>
