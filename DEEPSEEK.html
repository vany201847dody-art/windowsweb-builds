  function mines(){
    header('💣 Сапёр');
    const area=$('#g-area',body);
    const N=9,M=10;
    let board=[],open=[],flags=[],over=false,started=false;
    function init(){
      board=Array.from({length:N},()=>Array(N).fill(0));
      open=Array.from({length:N},()=>Array(N).fill(false));
      flags=Array.from({length:N},()=>Array(N).fill(false));
      over=false;started=false;render();
    }
    function place(fr,fc){
      let placed=0;
      while(placed<M){
        const r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);
        if(board[r][c]===-1)continue;
        if(Math.abs(r-fr)<=1&&Math.abs(c-fc)<=1)continue;
        board[r][c]=-1;placed++;
      }
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){
        if(board[r][c]===-1)continue;
        let n=0;
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
          const rr=r+dr,cc=c+dc;
          if(rr>=0&&rr<N&&cc>=0&&cc<N&&board[rr][cc]===-1)n++;
        }
        board[r][c]=n;
      }
    }
    function reveal(r,c){
      if(r<0||r>=N||c<0||c>=N||open[r][c]||flags[r][c])return;
      open[r][c]=true;
      if(board[r][c]===0){
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)reveal(r+dr,c+dc);
      }
    }
    function render(){
      let left=M-flags.flat().filter(Boolean).length;
      $('#g-info',body).textContent='Мины: '+left;
      area.innerHTML='<div class="msgrid" id="mgrid" style="grid-template-columns:repeat('+N+',1fr)"></div>'+
        '<div id="gmsg" style="font-size:16px;font-weight:600;margin-top:8px;min-height:22px"></div>'+
        '<button class="btn" id="mrst">🔄 Новая</button>';
      const gr=$('#mgrid',area);
      for(let r=0;r<N;r++)for(let c=0;c<N;c++){
        const d=el('div','msc');
        if(open[r][c]){
          d.classList.add('open');
          if(board[r][c]===-1){d.classList.add('mine');d.textContent='💣';}
          else if(board[r][c]>0)d.textContent=board[r][c];
        } else if(flags[r][c]){d.classList.add('flag');d.textContent='🚩';}
        d.dataset.r=r;d.dataset.c=c;gr.appendChild(d);
      }
      $('#mrst',area).onclick=init;
    }
    area.addEventListener('click',e=>{
      const c=e.target.closest('.msc');if(!c||over)return;
      const r=+c.dataset.r,col=+c.dataset.c;
      if(!started){started=true;place(r,col);}
      if(board[r][col]===-1){
        open=open.map((row,i)=>row.map((v,j)=>v||board[i][j]===-1));
        over=true;render();
        $('#gmsg',area).innerHTML='<span style="color:#ff453a">💥 Проиграли!</span>';
        return;
      }
      reveal(r,col);
      if(open.flat().filter(Boolean).length===N*N-M){
        over=true;render();
        $('#gmsg',area).innerHTML='<span style="color:#30d158">🎉 Победа!</span>';
        return;
      }
      render();
    });
    area.addEventListener('contextmenu',e=>{
      const c=e.target.closest('.msc');if(!c||over)return;
      e.preventDefault();
      const r=+c.dataset.r,col=+c.dataset.c;
      if(open[r][col])return;
      flags[r][col]=!flags[r][col];render();
    });
    init();
  }

  function snake(){
    header('🐍 Змейка');
    const area=$('#g-area',body);
    area.innerHTML='<canvas id="sn-cv" width="360" height="360" style="border-radius:10px;background:#111;border:1px solid var(--border)"></canvas>'+
      '<div class="muted">Стрелки / WASD</div>'+
      '<button class="btn pri" id="sn-go">▶️ Начать</button>';
    const cv=$('#sn-cv',area),ctx=cv.getContext('2d');
    const G=18,CS=20;
    let sn,dir,food,iv=null,score=0;
    function reset(){
      sn=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir={x:1,y:0};score=0;placeFood();draw();
    }
    function placeFood(){
      do{food={x:Math.floor(Math.random()*G),y:Math.floor(Math.random()*G)};}
      while(sn.some(s=>s.x===food.x&&s.y===food.y));
    }
    function draw(){
      ctx.fillStyle='#111';ctx.fillRect(0,0,360,360);
      ctx.strokeStyle='rgba(255,255,255,.04)';
      for(let i=0;i<=G;i++){ctx.beginPath();ctx.moveTo(i*CS,0);ctx.lineTo(i*CS,360);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,i*CS);ctx.lineTo(360,i*CS);ctx.stroke();}
      const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0a84ff';
      ctx.fillStyle='#ff453a';
      ctx.beginPath();ctx.arc(food.x*CS+CS/2,food.y*CS+CS/2,CS/2-2,0,Math.PI*2);ctx.fill();
      sn.forEach((s,i)=>{ctx.fillStyle=i===0?acc:'rgba(10,132,255,.55)';ctx.fillRect(s.x*CS+1,s.y*CS+1,CS-2,CS-2);});
      ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.fillText('Счёт: '+score,10,20);
    }
    function step(){
      const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
      if(h.x<0||h.x>=G||h.y<0||h.y>=G||sn.some(s=>s.x===h.x&&s.y===h.y)){
        clearInterval(iv);iv=null;
        $('#g-info',body).textContent='Игра окончена. Счёт: '+score;
        $('#sn-go',area).textContent='🔄 Заново';return;
      }
      sn.unshift(h);
      if(h.x===food.x&&h.y===food.y){score++;placeFood();}else sn.pop();
      draw();
    }
    $('#sn-go',area).onclick=()=>{
      reset();
      if(iv)clearInterval(iv);
      iv=setInterval(step,130);
      $('#sn-go',area).textContent='⏸️ Пауза';
      $('#sn-go',area).onclick=()=>{
        if(iv){clearInterval(iv);iv=null;$('#sn-go',area).textContent='▶️ Продолжить';}
        else{iv=setInterval(step,130);$('#sn-go',area).textContent='⏸️ Пауза';}
      };
    };
    function key(e){
      if(!WINS.has('games'))return;
      const k=e.key.toLowerCase();
      if(['arrowup','w'].includes(k)&&dir.y===0){dir={x:0,y:-1};e.preventDefault();}
      if(['arrowdown','s'].includes(k)&&dir.y===0){dir={x:0,y:1};e.preventDefault();}
      if(['arrowleft','a'].includes(k)&&dir.x===0){dir={x:-1,y:0};e.preventDefault();}
      if(['arrowright','d'].includes(k)&&dir.x===0){dir={x:1,y:0};e.preventDefault();}
    }
    document.addEventListener('keydown',key);
    win.app.onClose=()=>{clearInterval(iv);document.removeEventListener('keydown',key);};
    reset();
  }

  function g2048(){
    header('🔢 2048');
    const area=$('#g-area',body);
    let g,score=0;
    const COLORS={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',
      128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
    function init(){g=Array.from({length:4},()=>Array(4).fill(0));score=0;add();add();draw();}
    function add(){
      const empty=[];
      for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!g[r][c])empty.push([r,c]);
      if(!empty.length)return;
      const [r,c]=empty[Math.floor(Math.random()*empty.length)];
      g[r][c]=Math.random()<0.9?2:4;
    }
    function draw(){
      $('#g-info',body).textContent='Счёт: '+score;
      area.innerHTML='<div class="g2048" id="b2048"></div>'+
        '<div class="muted" style="margin-top:6px">Стрелки</div>'+
        '<button class="btn" id="g-new" style="margin-top:8px">🔄 Новая</button>';
      const b=$('#b2048',area);
      for(let r=0;r<4;r++)for(let c=0;c<4;c++){
        const v=g[r][c];
        const d=el('div','cell',v?String(v):'');
        if(v){d.style.background=COLORS[v]||'#3c3a32';d.style.color=v>4?'#fff':'#776e65';}
        b.appendChild(d);
      }
      $('#g-new',area).onclick=init;
    }
    function move(dr,dc){
      const before=JSON.stringify(g);
      const line=arr=>{const f=arr.filter(x=>x);for(let i=0;i<f.length-1;i++){
        if(f[i]===f[i+1]){f[i]*=2;score+=f[i];f.splice(i+1,1);}}
        while(f.length<4)f.push(0);return f;};
      if(dr){
        for(let c=0;c<4;c++){
          const col=[0,1,2,3].map(r=>g[r][c]);
          const ordered=dr<0?col:col.slice().reverse();
          const merged=line(ordered);
          const fin=dr<0?merged:merged.reverse();
          for(let r=0;r<4;r++)g[r][c]=fin[r];
        }
      } else {
        for(let r=0;r<4;r++){
          const row=g[r].slice();
          const ordered=dc<0?row:row.slice().reverse();
          const merged=line(ordered);
          g[r]=dc<0?merged:merged.reverse();
        }
      }
      if(JSON.stringify(g)!==before){add();draw();}
    }
    function key(e){
      if(!WINS.has('games'))return;
      const k=e.key;
      if(k==='ArrowUp'){move(-1,0);e.preventDefault();}
      if(k==='ArrowDown'){move(1,0);e.preventDefault();}
      if(k==='ArrowLeft'){move(0,-1);e.preventDefault();}
      if(k==='ArrowRight'){move(0,1);e.preventDefault();}
    }
    document.addEventListener('keydown',key);
    win.app.onClose=()=>document.removeEventListener('keydown',key);
    init();
  }

  function memory(){
    header('🃏 Память');
    const area=$('#g-area',body);
    const ICONS=['🍎','🍌','🍇','🍓','🍒','🥝','🍍','🥥'];
    let deck=[],flipped=[],matched=0,moves=0,lock=false,startT=0,iv=null;
    function init(){
      deck=ICONS.concat(ICONS).map(v=>({v,open:false,done:false})).sort(()=>Math.random()-0.5);
      flipped=[];matched=0;moves=0;lock=false;startT=Date.now();
      clearInterval(iv);
      iv=setInterval(()=>{
        $('#g-info',body).textContent='Ходы: '+moves+' · Время: '+Math.floor((Date.now()-startT)/1000)+'с · '+matched+'/8';
      },300);
      draw();
    }
    function draw(){
      area.innerHTML='<div class="memgrid" id="mg">'+deck.map((c,i)=>
        '<div class="memc'+(c.done?' done':(c.open?' flip':''))+'" data-i="'+i+'">'+c.v+'</div>').join('')+'</div>'+
        '<button class="btn" id="mm-new" style="margin-top:12px">🔄 Новая</button>';
      $('#mm-new',area).onclick=init;
    }
    area.addEventListener('click',e=>{
      const c=e.target.closest('.memc');if(!c||lock)return;
      const i=+c.dataset.i;
      if(deck[i].open||deck[i].done)return;
      deck[i].open=true;flipped.push(i);draw();
      if(flipped.length===2){
        moves++;lock=true;
        const [a,b]=flipped;
        if(deck[a].v===deck[b].v){
          deck[a].done=deck[b].done=true;matched++;
          flipped=[];lock=false;draw();
          if(matched===8){clearInterval(iv);notify('🃏','Память','Победа! Ходов: '+moves);}
        } else {
          setTimeout(()=>{deck[a].open=deck[b].open=false;flipped=[];lock=false;draw();},720);
        }
      }
    });
    win.app.onClose=()=>clearInterval(iv);
    init();
  }

  function ttt(){
    header('❌ Крестики-нолики');
    const area=$('#g-area',body);
    let b,over,stats={w:0,l:0,d:0};
    const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function init(){b=Array(9).fill('');over=false;draw();}
    function winner(bd){
      for(const l of LINES){const [a,c,d]=l;if(bd[a]&&bd[a]===bd[c]&&bd[a]===bd[d])return bd[a];}
      return bd.every(x=>x)?'draw':null;
    }
    function ai(){
      const empty=b.map((v,i)=>v?null:i).filter(i=>i!==null);
      const tryWin=p=>{for(const i of empty){const t=b.slice();t[i]=p;if(winner(t)===p)return i;}return -1;};
      let m=tryWin('O');if(m>=0)return m;
      m=tryWin('X');if(m>=0)return m;
      if(b[4]==='')return 4;
      const corners=[0,2,6,8].filter(i=>b[i]==='');
      if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
      return empty[Math.floor(Math.random()*empty.length)];
    }
    function draw(){
      const w=winner(b);
      $('#g-info',body).textContent='Победы: '+stats.w+' · Пораж: '+stats.l+' · Ничьи: '+stats.d;
      area.innerHTML='<div class="ttt" id="tg">'+b.map((v,i)=>
        '<div class="tttc" data-i="'+i+'">'+v+'</div>').join('')+'</div>'+
        '<div style="font-size:16px;font-weight:600;margin-top:10px;min-height:22px" id="tmsg">'+
        (w==='X'?'<span style="color:#30d158">🎉 Победа!</span>':w==='O'?'<span style="color:#ff453a">Компьютер победил</span>':w==='draw'?'Ничья!':'Ваш ход (❌)')+
        '</div><button class="btn" id="tn" style="margin-top:10px">🔄 Новая</button>';
      $('#tn',area).onclick=init;
    }
    area.addEventListener('click',e=>{
      const c=e.target.closest('.tttc');if(!c||over)return;
      const i=+c.dataset.i;
      if(b[i])return;
      b[i]='X';
      let w=winner(b);
      if(w){over=true;if(w==='X')stats.w++;else if(w==='draw')stats.d++;draw();return;}
      setTimeout(()=>{
        const m=ai();
        if(m>=0)b[m]='O';
        w=winner(b);
        if(w){over=true;if(w==='O')stats.l++;else if(w==='draw')stats.d++;}
        draw();
      },260);
      draw();
    });
    init();
  }

  menu();
}};

/* ============ POWER ============ */
function powerAction(a){
  const ov=$('#poweroverlay'),tx=$('#pwtxt');
  if(a==='sleep'){
    ov.classList.add('on');tx.textContent='Спящий режим...';
    setTimeout(()=>{
      ov.style.opacity='0';
      setTimeout(()=>{ov.classList.remove('on');ov.style.opacity='';notify('🌙','Система','Выход из сна');},700);
    },2000);
    return;
  }
  if(a==='shutdown'){
    ov.classList.add('on');tx.textContent='Завершение работы...';
    setTimeout(()=>{tx.textContent='Питание отключено';tx.style.color='rgba(255,255,255,.25)';},3200);
    return;
  }
  if(a==='restart'){
    ov.classList.add('on');tx.textContent='Перезагрузка...';
    setTimeout(()=>location.reload(),2500);
  }
}

/* ============ TRAY ============ */
function updateTray(){
  $('#tr-wifi').textContent=S.airplane?'✈️':(S.wifi?'📶':'📵');
  $('#tr-sound').textContent=S.volume===0?'🔇':(S.volume<50?'🔉':'🔊');
}
function updateVolIcon(){
  const i=S.volume===0?'🔇':(S.volume<50?'🔉':'🔊');
  const e=$('#volicon');if(e)e.textContent=i;
  const p=$('#volpct');if(p)p.textContent=S.volume+'%';
  updateTray();
}
function updateClock(){
  const d=new Date();
  let h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
  let str;
  if(S.clock24)str=pad(h)+':'+pad(m);
  else{const ap=h>=12?'PM':'AM';h=h%12||12;str=h+':'+pad(m)+' '+ap;}
  if(S.showSeconds)str+=':'+pad(s);
  const tc=$('#tc-time');if(tc)tc.textContent=str;
  const td=$('#tc-date');if(td)td.textContent=pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
  const lc=$('#lclock');if(lc)lc.textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  const ld=$('#ldate');if(ld)ld.textContent=DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()];
  const cb=$('#calbig');if(cb)cb.textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  const cs=$('#calsub');if(cs)cs.textContent=DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()];
}
$('#tr-sound').addEventListener('click',e=>{e.stopPropagation();toggleFlyout('#flyvol');});
$('#tr-wifi').addEventListener('click',e=>{e.stopPropagation();toggleFlyout('#flynotif');});
$('#tr-batt').addEventListener('click',e=>{e.stopPropagation();notify('🔋','Батарея','87% · ~5 ч 20 мин');});
$('#tr-clock').addEventListener('click',e=>{e.stopPropagation();toggleFlyout('#flycal');});
$('#bell').addEventListener('click',e=>{e.stopPropagation();toggleFlyout('#flynotif');unread=0;updateBadge();});
function closeFlyouts(){$$('.flyout').forEach(f=>f.classList.remove('open'));}
function toggleFlyout(sel){
  const t=$(sel),was=t.classList.contains('open');
  closeFlyouts();
  if(!was)t.classList.add('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.flyout')&&!e.target.closest('#tr-sound')&&!e.target.closest('#tr-wifi')
    &&!e.target.closest('#tr-clock')&&!e.target.closest('#bell'))closeFlyouts();
});

/* ============ CALENDAR ============ */
let calDate=new Date();
function renderCalendar(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  $('#calmt').textContent=MONTHS_N[m]+' '+y;
  const first=new Date(y,m,1);
  let start=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const today=new Date();
  let html=DAYS_S.map(d=>'<div class="dow">'+d+'</div>').join('');
  for(let i=start-1;i>=0;i--)html+='<div class="day other">'+(prevDays-i)+'</div>';
  for(let d=1;d<=daysInMonth;d++){
    const isToday=d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear();
    html+='<div class="day'+(isToday?' today':'')+'">'+d+'</div>';
  }
  const total=start+daysInMonth;
  const rest=(7-total%7)%7;
  for(let d=1;d<=rest;d++)html+='<div class="day other">'+d+'</div>';
  $('#calgrid').innerHTML=html;
}
$('#calprev').addEventListener('click',e=>{e.stopPropagation();calDate.setMonth(calDate.getMonth()-1);renderCalendar();});
$('#calnext').addEventListener('click',e=>{e.stopPropagation();calDate.setMonth(calDate.getMonth()+1);renderCalendar();});

/* ============ QUICK TILES ============ */
function renderTiles(){
  const T=[['wifi','📶','Wi-Fi',S.wifi],['bluetooth','🔵','Bluetooth',S.bluetooth],
    ['airplane','✈️','Авиарежим',S.airplane],['night','🌙','Ночной свет',S.night],
    ['focus','🎯','Фокус',S.focus],['screencast','🖥️','Запись экрана',S.screencast]];
  $('#qtiles').innerHTML=T.map(t=>
    '<div class="tile'+(t[3]?' on':'')+'" data-tile="'+t[0]+'"><div class="ti">'+t[1]+'</div><div>'+t[2]+'</div></div>').join('');
}
$('#qtiles').addEventListener('click',e=>{
  const t=e.target.closest('[data-tile]');if(!t)return;
  const k=t.dataset.tile;
  S[k]=!S[k];
  if(k==='airplane'&&S[k]){S.wifi=false;S.bluetooth=false;}
  if(k==='night')document.body.style.filter=S[k]?'sepia(.28) saturate(1.1)':'';
  saveSettings();renderTiles();updateTray();
});

/* ============ FLYOUT SLIDERS ============ */
$('#volslider').addEventListener('input',e=>{S.volume=+e.target.value;saveSettings();updateVolIcon();$('#nvolslider').value=S.volume;});
$('#nvolslider').addEventListener('input',e=>{S.volume=+e.target.value;saveSettings();updateVolIcon();$('#volslider').value=S.volume;});
$('#brightslider').addEventListener('input',e=>{S.brightness=+e.target.value;saveSettings();applyBrightness();});
$('#clearnotif').addEventListener('click',e=>{
  e.stopPropagation();
  notifList=[];LS.set('notifs',[]);unread=0;updateBadge();renderNotifList();
});

/* ============ SEARCH ============ */
$('#tbsearch').addEventListener('click',()=>{openStart();$('#startsearch').focus();});
$('#tbsearchinput').addEventListener('input',e=>{
  openStart();$('#startsearch').value=e.target.value;renderStartGrid();
});
$('#tbsearchinput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const first=$('#startgrid .sapp');
    if(first)openApp(first.dataset.app);
    closeStart();
  }
});

/* ============ HOTKEYS ============ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeStart();closeFlyouts();hideCtx();}
  if(e.key==='Meta'){e.preventDefault();toggleStart();}
  if(e.ctrlKey&&e.key==='Escape'){e.preventDefault();toggleStart();}
});

/* ============ INIT ============ */
function init(){
  applySettings();
  renderDesktopIcons();
  renderStartGrid();
  renderTaskbar();
  renderTiles();
  renderCalendar();
  renderNotifList();
  updateClock();
  updateTray();
  updateVolIcon();
  setInterval(updateClock,1000);

  (S.autostart||[]).forEach(id=>{if(APPS[id])setTimeout(()=>openApp(id),1200);});

  setTimeout(()=>{
    const b=$('#boot');
    b.style.opacity='0';
    setTimeout(()=>b.remove(),500);
    $('#lock').addEventListener('click',()=>{
      const l=$('#lock');
      l.classList.add('hide');
      setTimeout(()=>{l.style.display='none';},450);
      setTimeout(()=>notify('👋','Добро пожаловать','NovaOS '+OS.version+' готова к работе'),900);
    },{once:true});
    setTimeout(()=>notify('🚀','NovaOS','Система запущена'),1400);
  },2500);
}
init();
</script>
