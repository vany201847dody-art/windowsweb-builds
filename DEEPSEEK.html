<meta name="author" content="NovaDev">
<title>NovaOS 1.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#0a84ff;--accent-rgb:10,132,255;
  --win-bg:#1c1c1e;--win-head:rgba(255,255,255,.04);
  --panel:rgba(28,28,30,.78);--panel-solid:#1c1c1e;
  --card:rgba(255,255,255,.06);--card-h:rgba(255,255,255,.12);
  --text:#fff;--text-dim:rgba(255,255,255,.62);--text-dim2:rgba(255,255,255,.38);
  --border:rgba(255,255,255,.09);--border-s:rgba(255,255,255,.18);
  --sh-sm:0 2px 8px rgba(0,0,0,.35);
  --sh-md:0 14px 38px rgba(0,0,0,.5);
  --sh-xl:0 28px 70px rgba(0,0,0,.65);
  --r6:6px;--r10:10px;--r14:14px;
  --tb:48px;--icon:88px;
  --tr:.2s cubic-bezier(.2,.8,.2,1);
}
body.light{
  --win-bg:#f2f2f7;--win-head:rgba(0,0,0,.02);
  --panel:rgba(250,250,252,.82);--panel-solid:#f2f2f7;
  --card:rgba(0,0,0,.05);--card-h:rgba(0,0,0,.1);
  --text:#1c1c1e;--text-dim:rgba(0,0,0,.6);--text-dim2:rgba(0,0,0,.4);
  --border:rgba(0,0,0,.09);--border-s:rgba(0,0,0,.18);
  --sh-md:0 14px 38px rgba(0,0,0,.18);--sh-xl:0 28px 70px rgba(0,0,0,.28);
}
html,body{height:100%;overflow:hidden}
body{font-family:"Segoe UI Variable","Segoe UI",-apple-system,Inter,system-ui,sans-serif;
  background:#000;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(140,140,150,.4);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(140,140,150,.65);background-clip:padding-box}
body.noanim *{animation:none!important;transition:none!important}

/* BOOT */
#boot{position:fixed;inset:0;background:#000;z-index:9000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:44px;transition:opacity .5s}
#boot .logo4{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:104px;height:104px;
  filter:drop-shadow(0 0 28px rgba(var(--accent-rgb),.65))}
#boot .logo4 i{background:var(--accent);border-radius:5px;opacity:0;animation:logoIn .65s cubic-bezier(.2,.9,.25,1) forwards}
#boot .logo4 i:nth-child(1){animation-delay:.05s}
#boot .logo4 i:nth-child(2){animation-delay:.15s}
#boot .logo4 i:nth-child(3){animation-delay:.25s}
#boot .logo4 i:nth-child(4){animation-delay:.35s}
@keyframes logoIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.spinner{width:38px;height:38px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0%,rgba(var(--accent-rgb),.15) 55%,var(--accent) 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 0);
  mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 0);
  animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#boot .btxt{color:rgba(255,255,255,.4);font-size:13.5px;letter-spacing:.4px}

/* LOCK */
#lock{position:fixed;inset:0;z-index:8000;display:flex;flex-direction:column;align-items:center;
  background-size:cover;background-position:center;background-color:#111;
  transition:opacity .4s,transform .4s;cursor:pointer}
#lock::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 40%,rgba(0,0,0,.6) 100%)}
#lock>*{position:relative;z-index:2}
#lock .ltop{margin-top:9vh;text-align:center;text-shadow:0 4px 30px rgba(0,0,0,.7);color:#fff}
#lock .lclock{font-size:120px;font-weight:200;line-height:1;letter-spacing:-3px}
#lock .ldate{font-size:22px;font-weight:300;margin-top:8px;opacity:.92;text-transform:capitalize}
#lock .lweather{position:absolute;right:34px;bottom:120px;text-align:right;
  background:rgba(0,0,0,.3);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.16);border-radius:var(--r14);padding:14px 20px;color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.5)}
#lock .lweather .wt{font-size:30px;font-weight:300}
#lock .lweather .wc{font-size:12.5px;opacity:.8;margin-top:2px}
#lock .lbot{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);
  color:#fff;font-size:14px;opacity:.85;animation:pulse 2.2s ease-in-out infinite;text-shadow:0 2px 12px rgba(0,0,0,.7)}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
#lock.hide{opacity:0;transform:scale(1.06);pointer-events:none}

/* DESKTOP */
#desktop{position:fixed;inset:0 0 var(--tb) 0;background-size:cover;background-position:center;
  background-color:#0b0b0d;overflow:hidden}
#desktop::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.05);pointer-events:none}
#icons{position:absolute;top:10px;left:10px;bottom:10px;display:grid;
  grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:4px;align-content:start;z-index:1}
.dicon{width:var(--icon);padding:9px 4px 8px;border-radius:var(--r6);display:flex;flex-direction:column;
  align-items:center;gap:6px;cursor:pointer;border:1px solid transparent;
  transition:background var(--tr),border-color var(--tr)}
.dicon:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.12)}
.dicon.sel{background:rgba(var(--accent-rgb),.35);border-color:rgba(var(--accent-rgb),.65)}
.dicon .ic{font-size:34px;line-height:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.55))}
.dicon .nm{font-size:11.5px;text-align:center;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);
  line-height:1.25;word-break:break-word;max-width:100%}
body.light .dicon .nm{text-shadow:0 1px 3px rgba(255,255,255,.9);color:#1c1c1e}
body.light .dicon:hover{background:rgba(0,0,0,.07)}

/* TASKBAR */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb);z-index:600;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--panel);backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border-top:1px solid var(--border)}
#startbtn{width:42px;height:38px;border-radius:var(--r6);display:grid;place-items:center;transition:background var(--tr)}
#startbtn:hover{background:var(--card-h)}
#startbtn .lm{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:19px;height:19px}
#startbtn .lm i{background:var(--accent);border-radius:2px;transition:transform .18s}
#startbtn:hover .lm i{transform:scale(1.16)}
#tb-center{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}
#tbsearch{display:flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:16px;
  background:var(--card);border:1px solid var(--border);color:var(--text-dim);font-size:13px;
  min-width:190px;cursor:text;transition:background var(--tr),border-color var(--tr)}
#tbsearch:hover{background:var(--card-h);border-color:var(--border-s)}
#tbsearch input{background:none;border:none;width:100%;color:var(--text);font-size:13px}
.tbtn{position:relative;width:42px;height:38px;border-radius:var(--r6);display:grid;place-items:center;
  font-size:20px;transition:background var(--tr),transform .12s}
.tbtn:hover{background:var(--card-h)}
.tbtn:active{transform:scale(.94)}
.tbtn.run{background:var(--card)}
.tbtn.act{background:var(--card-h)}
.tbtn::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:6px;height:3px;border-radius:2px;background:transparent;transition:all var(--tr)}
.tbtn.run::after{background:var(--text-dim);width:6px}
.tbtn.act::after{background:var(--accent);width:16px}
#tb-tray{display:flex;align-items:center;gap:2px}
.trbtn{height:36px;padding:0 8px;border-radius:var(--r6);display:flex;align-items:center;gap:5px;
  font-size:14px;transition:background var(--tr)}
.trbtn:hover{background:var(--card-h)}
#tr-clock{flex-direction:column;gap:0;line-height:1.15;font-size:11.5px;padding:0 10px}
#tr-clock .t{font-size:12.5px}
#bell{position:relative}
#bellbadge{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;
  background:#ff453a;color:#fff;font-size:10px;font-weight:600;display:none;place-items:center;padding:0 4px}
#bellbadge.on{display:grid}

/* START MENU */
#start{position:fixed;left:50%;bottom:calc(var(--tb) + 8px);transform:translateX(-50%) translateY(14px);
  width:640px;max-width:calc(100vw - 24px);height:600px;max-height:calc(100vh - var(--tb) - 24px);z-index:610;
  background:var(--panel);backdrop-filter:blur(50px) saturate(180%);-webkit-backdrop-filter:blur(50px) saturate(180%);
  border:1px solid var(--border-s);border-radius:var(--r14);box-shadow:var(--sh-xl);
  display:flex;flex-direction:column;padding:22px 26px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s cubic-bezier(.2,.8,.2,1)}
#start.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#start .ssearch{display:flex;align-items:center;gap:9px;height:38px;padding:0 16px;border-radius:19px;
  background:var(--card);border:1px solid var(--border);margin-bottom:18px}
#start .ssearch input{flex:1;background:none;border:none;font-size:13.5px}
#start h3{font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:12px;letter-spacing:.3px}
#startgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;overflow-y:auto;flex:1;align-content:start;padding-right:4px}
.sapp{padding:13px 6px 10px;border-radius:var(--r10);display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:background var(--tr);cursor:pointer}
.sapp:hover{background:var(--card-h)}
.sapp .ic{font-size:29px}
.sapp .nm{font-size:11.5px;text-align:center;color:var(--text-dim);line-height:1.2}
#startfoot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--border)}
#startfoot .usr{display:flex;align-items:center;gap:10px;font-size:13.5px}
#startfoot .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#bf5af2);
  display:grid;place-items:center;font-size:15px}
#pwrbtn{width:36px;height:36px;border-radius:var(--r6);display:grid;place-items:center;font-size:17px;transition:background var(--tr)}
#pwrbtn:hover{background:var(--card-h)}

/* FLYOUTS */
.flyout{position:fixed;right:12px;bottom:calc(var(--tb) + 10px);z-index:620;
  background:var(--panel);backdrop-filter:blur(46px) saturate(180%);-webkit-backdrop-filter:blur(46px) saturate(180%);
  border:1px solid var(--border-s);border-radius:var(--r14);box-shadow:var(--sh-xl);
  padding:18px;opacity:0;pointer-events:none;transform:translateY(12px) scale(.98);
  transition:opacity .18s,transform .18s cubic-bezier(.2,.8,.2,1);color:var(--text)}
.flyout.open{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
#flycal{width:340px}
#flyvol{width:320px}
#flynotif{width:400px;max-height:calc(100vh - var(--tb) - 30px);overflow-y:auto}
.calbig{font-size:44px;font-weight:200;letter-spacing:-1px;text-align:center;margin-bottom:2px}
.calsub{font-size:13px;color:var(--text-dim);text-align:center;text-transform:capitalize;margin-bottom:16px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead .nav{width:30px;height:30px;border-radius:var(--r6);display:grid;place-items:center;transition:background var(--tr)}
.calhead .nav:hover{background:var(--card-h)}
.calhead .mt{font-size:14px;font-weight:600;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calgrid .dow{font-size:11px;color:var(--text-dim2);padding:5px 0;font-weight:600}
.calgrid .day{font-size:12.5px;padding:8px 0;border-radius:50%;aspect-ratio:1;display:grid;place-items:center;transition:background var(--tr)}
.calgrid .day:hover{background:var(--card-h)}
.calgrid .day.other{color:var(--text-dim2)}
.calgrid .day.today{background:var(--accent);color:#fff;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;
  background:var(--card-h);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.4);transition:transform .12s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.16)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r10);padding:12px 6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--text-dim);
  transition:all var(--tr);text-align:center;cursor:pointer}
.tile:hover{background:var(--card-h)}
.tile .ti{font-size:19px}
.tile.on{background:var(--accent);border-color:var(--accent);color:#fff}
.notifhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.notifhead h3{font-size:15px;font-weight:600}
.notifhead button{font-size:12px;color:var(--accent);padding:5px 9px;border-radius:var(--r6);transition:background var(--tr)}
.notifhead button:hover{background:var(--card-h)}
.nitem{display:flex;gap:11px;padding:11px;border-radius:var(--r10);background:var(--card);margin-bottom:7px;border:1px solid var(--border)}
.nitem .ni{font-size:19px}
.nitem .nb{flex:1;min-width:0}
.nitem .nt{font-size:12.5px;font-weight:600;margin-bottom:2px}
.nitem .nx{font-size:11.5px;color:var(--text-dim);line-height:1.4}
.nitem .nd{font-size:10.5px;color:var(--text-dim2);margin-top:3px}
.empty{text-align:center;color:var(--text-dim2);font-size:12.5px;padding:26px 0}

/* WINDOWS */
#wins{position:absolute;inset:0;z-index:2}
.window{position:absolute;background:var(--win-bg);border:1px solid var(--border-s);
  border-radius:var(--r10);box-shadow:var(--sh-md);display:flex;flex-direction:column;overflow:hidden;
  min-width:340px;min-height:220px;opacity:.97;animation:winOpen .22s cubic-bezier(.2,.8,.2,1)}
@keyframes winOpen{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.window.focus{box-shadow:var(--sh-xl);opacity:1}
.window:not(.focus){filter:brightness(.92)}
.window.min{display:none}
.window.max{border-radius:0}
.win-tb{height:36px;flex-shrink:0;display:flex;align-items:center;gap:9px;padding:0 4px 0 13px;
  background:var(--win-head);border-bottom:1px solid var(--border);cursor:default}
.win-tb .wi{font-size:14px}
.win-tb .wt{font-size:12.5px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-ctrls{display:flex;height:100%}
.wc{width:44px;height:100%;display:grid;place-items:center;font-size:12px;color:var(--text-dim);
  transition:background .13s,color .13s}
.wc:hover{background:var(--card-h);color:var(--text)}
.wc.close:hover{background:#e81123;color:#fff}
.win-body{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column}
.rz{position:absolute;z-index:9}
.rz-n{top:-3px;left:10px;right:10px;height:6px;cursor:ns-resize}
.rz-s{bottom:-3px;left:10px;right:10px;height:6px;cursor:ns-resize}
.rz-w{left:-3px;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rz-e{right:-3px;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rz-nw{top:-3px;left:-3px;width:13px;height:13px;cursor:nwse-resize}
.rz-ne{top:-3px;right:-3px;width:13px;height:13px;cursor:nesw-resize}
.rz-sw{bottom:-3px;left:-3px;width:13px;height:13px;cursor:nesw-resize}
.rz-se{bottom:-3px;right:-3px;width:13px;height:13px;cursor:nwse-resize}
#snap{position:absolute;border:2px solid var(--accent);background:rgba(var(--accent-rgb),.22);
  border-radius:var(--r10);z-index:5;pointer-events:none;display:none}

/* COMMON APP ELEMENTS */
.pane{padding:16px;overflow:auto;flex:1}
.toolbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);
  background:var(--win-head);flex-shrink:0;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:var(--r6);background:var(--card);border:1px solid var(--border);
  font-size:12.5px;transition:all var(--tr);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--card-h);border-color:var(--border-s)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.dan{background:#ff453a;border-color:#ff453a;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{padding:8px 12px;border-radius:var(--r6);background:var(--card);border:1px solid var(--border);
  font-size:13px;width:100%;transition:border-color var(--tr)}
.inp:focus{border-color:var(--accent)}
select.inp{cursor:pointer}
select.inp option{background:var(--panel-solid);color:var(--text)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r10);padding:14px}
.card h4{font-size:13px;font-weight:600;margin-bottom:10px}
.muted{color:var(--text-dim);font-size:12px}
.center{display:grid;place-items:center;flex:1;text-align:center;padding:30px}
.tabs{display:flex;gap:3px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
  overflow-x:auto;background:var(--win-head)}
.tab{padding:7px 13px;border-radius:var(--r6);font-size:12.5px;color:var(--text-dim);white-space:nowrap;transition:all var(--tr);cursor:pointer}
.tab:hover{background:var(--card);color:var(--text)}
.tab.on{background:var(--accent);color:#fff}
.split{display:flex;flex:1;overflow:hidden}
.side{width:200px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:9px}
.side .si{padding:8px 11px;border-radius:var(--r6);font-size:12.5px;cursor:pointer;display:flex;align-items:center;
  gap:8px;transition:background var(--tr);color:var(--text-dim)}
.side .si:hover{background:var(--card);color:var(--text)}
.side .si.on{background:var(--card-h);color:var(--text);font-weight:500}
.main{flex:1;overflow:auto;padding:16px}
.empty-note{color:var(--text-dim2);font-size:12.5px;text-align:center;padding:24px}

/* CONTEXT MENU */
#ctx{position:fixed;z-index:9500;min-width:210px;background:var(--panel);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--border-s);border-radius:var(--r10);box-shadow:var(--sh-xl);padding:5px;
  opacity:0;pointer-events:none;transform:scale(.97);transform-origin:top left;
  transition:opacity .13s,transform .13s}
#ctx.open{opacity:1;pointer-events:auto;transform:scale(1)}
.ctxitem{padding:8px 12px;border-radius:var(--r6);font-size:12.5px;display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:background .1s;color:var(--text)}
.ctxitem:hover{background:var(--card-h)}
.ctxitem.dis{color:var(--text-dim2);pointer-events:none}
.ctxsep{height:1px;background:var(--border);margin:5px 8px}

/* TOASTS */
#toasts{position:fixed;right:14px;bottom:calc(var(--tb) + 14px);z-index:700;display:flex;
  flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none}
.toast{background:var(--panel);backdrop-filter:blur(40px) saturate(180%);

/* SETTINGS */

<script>
"use strict";
const OS={name:'NovaOS',version:'1.0',build:'10.0.99999',year:2026,author:'NovaDev',license:'PROPRIETARY · All Rights Reserved'};

/* ============ UTILS ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const pad=n=>String(n).padStart(2,'0');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

const LS={
  get(k,d){try{const v=localStorage.getItem('NovaOS_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('NovaOS_'+k,JSON.stringify(v));}catch(e){}},
  del(k){try{localStorage.removeItem('NovaOS_'+k);}catch(e){}}
};

const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DAYS=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const DAYS_S=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

/* ============ WALLPAPERS ============ */
const WALLS=[
  {n:'Горы',   u:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80',g:'linear-gradient(135deg,#1b2735,#090a0f)'},
  {n:'Океан',  u:'https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=1920&q=80',g:'linear-gradient(135deg,#0f2027,#2c5364)'},
  {n:'Ночь',   u:'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1920&q=80',g:'linear-gradient(135deg,#232526,#414345)'},
  {n:'Лес',    u:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80',g:'linear-gradient(135deg,#134e5e,#71b280)'},
  {n:'Абстракт',u:'https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=1920&q=80',g:'linear-gradient(135deg,#667eea,#764ba2)'},
  {n:'Пустыня',u:'https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=1920&q=80',g:'linear-gradient(135deg,#c79081,#dfa579)'},
  {n:'Космос', u:'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920&q=80',g:'linear-gradient(135deg,#0f0c29,#302b63,#24243e)'},
  {n:'Закат',  u:'https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?w=1920&q=80',g:'linear-gradient(135deg,#ff512f,#dd2476)'}
];
const ACCENTS=['#0a84ff','#5e5ce6','#bf5af2','#ff375f','#ff9f0a','#30d158','#40c8e0','#ff6b6b','#64d2ff','#a2845e'];

/* ============ SETTINGS ============ */
const DEF={theme:'dark',accent:'#0a84ff',wallpaper:0,iconSize:88,animations:true,
  clock24:true,showSeconds:false,volume:70,brightness:100,
  wifi:true,bluetooth:false,airplane:false,night:false,focus:false,screencast:false,
  notifications:true,camAllowed:true,micAllowed:true,mouseSpeed:5,mouseBtn:'right',autostart:[]};
let S=Object.assign({},DEF,LS.get('settings',{}));
const saveSettings=()=>LS.set('settings',S);

function hexToRgb(h){const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[10,132,255];}

function applySettings(){
  document.body.classList.toggle('light',S.theme==='light');
  document.body.classList.toggle('noanim',!S.animations);
  document.documentElement.style.setProperty('--accent',S.accent);
  document.documentElement.style.setProperty('--accent-rgb',hexToRgb(S.accent).join(','));
  document.documentElement.style.setProperty('--icon',S.iconSize+'px');
  const w=WALLS[S.wallpaper]||WALLS[0];
  ['#desktop','#lock'].forEach(sel=>{
    const x=$(sel);if(!x)return;
    x.style.backgroundImage='url("'+w.u+'"), '+w.g;
    x.style.backgroundSize='cover';
    x.style.backgroundPosition='center';
    x.style.backgroundBlendMode='normal';
  });
  if($('#volslider'))$('#volslider').value=S.volume;
  if($('#nvolslider'))$('#nvolslider').value=S.volume;
  if($('#brightslider'))$('#brightslider').value=S.brightness;
  updateVolIcon();applyBrightness();
}
function applyBrightness(){
  const b=S.brightness/100;
  const d=$('#desktop');if(d)d.style.filter=b<1?`brightness(${Math.max(.35,b)})`:'';
}

/* ============ NOTIFICATIONS ============ */
let notifList=LS.get('notifs',[]);
let unread=0;
function notify(icon,title,text){
  const t=el('div','toast');
  t.innerHTML=`<div class="ti">${icon}</div><div class="tb"><div class="tt">${esc(title)}</div><div class="tx">${esc(text)}</div></div>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320);},4500);
  const d=new Date();
  notifList.unshift({icon,title,text,time:pad(d.getHours())+':'+pad(d.getMinutes())});
  if(notifList.length>40)notifList.pop();
  LS.set('notifs',notifList);
  unread++;updateBadge();renderNotifList();
}
function updateBadge(){
  const b=$('#bellbadge');if(!b)return;
  b.textContent=unread>99?'99+':unread;
  b.classList.toggle('on',unread>0);
}
function renderNotifList(){
  const l=$('#notiflist');if(!l)return;
  if(!notifList.length){l.innerHTML='<div class="empty">Нет новых уведомлений</div>';return;}
  l.innerHTML=notifList.slice(0,8).map(n=>`
    <div class="nitem"><div class="ni">${n.icon}</div>
    <div class="nb"><div class="nt">${esc(n.title)}</div><div class="nx">${esc(n.text)}</div>
    <div class="nd">${n.time}</div></div></div>`).join('');
}

/* ============ CONTEXT MENU ============ */
function showCtx(x,y,items){
  const c=$('#ctx');
  c.innerHTML=items.map(i=>i.sep?'<div class="ctxsep"></div>':

/* ============ WINDOW MANAGER ============ */
let zTop=100,cascade=0;
const WINS=new Map();

function makeWindow(app){
  const e=el('div','window');
  const availW=innerWidth,availH=innerHeight-48;
  const w=Math.min(app.w||820,availW-40),h=Math.min(app.h||560,availH-40);
  e.style.width=w+'px';e.style.height=h+'px';
  const off=(cascade++%7)*26;
  e.style.left=clamp((availW-w)/2-90+off,12,availW-w-12)+'px';
  e.style.top=clamp((availH-h)/2-50+off,12,Math.max(12,availH-h-12))+'px';
  e.innerHTML=
    '<div class="win-tb"><span class="wi">'+app.icon+'</span><span class="wt">'+esc(app.name)+'</span>'+
    '<div class="win-ctrls">'+
      '<button class="wc" data-a="min" title="Свернуть">—</button>'+
      '<button class="wc" data-a="max" title="Развернуть">▢</button>'+
      '<button class="wc close" data-a="close" title="Закрыть">✕</button>'+
    '</div></div><div class="win-body"></div>'+
    ['n','s','e','w','ne','nw','se','sw'].map(d=>'<div class="rz rz-'+d+'" data-d="'+d+'"></div>').join('');
  return e;
}

function openApp(id,arg){
  const app=APPS[id];
  if(!app){notify('⚠️','Ошибка','Приложение не найдено');return;}
  if(WINS.has(id)){
    const w=WINS.get(id);
    if(w.minimized){w.el.classList.remove('min');w.minimized=false;}
    focusWin(w);renderTaskbar();return w;
  }
  const e=makeWindow(app);
  $('#wins').appendChild(e);
  const win={id,el:e,body:$('.win-body',e),app,minimized:false,maximized:false,prev:null};
  WINS.set(id,win);
  try{app.render(win.body,win,arg);}
  catch(err){win.body.innerHTML='<div class="center"><div><div style="font-size:40px">💥</div><p>Ошибка приложения</p><p class="muted">'+esc(err.message)+'</p></div></div>';console.error(err);}
  bindWindow(win);
  focusWin(win);
  renderTaskbar();
  closeStart();
  return win;
}

function closeWin(id){
  const w=WINS.get(id);if(!w)return;
  if(w.app.onClose)try{w.app.onClose(w);}catch(e){}
  w.el.style.transition='opacity .16s,transform .16s';
  w.el.style.opacity='0';w.el.style.transform='scale(.96)';
  setTimeout(()=>w.el.remove(),170);
  WINS.delete(id);renderTaskbar();
  const rest=Array.from(WINS.values());
  if(rest.length)focusWin(rest[rest.length-1]);
}

function focusWin(win){
  WINS.forEach(w=>{w.el.classList.remove('focus');w.el.style.zIndex=100;});
  win.el.classList.add('focus');
  win.el.style.zIndex=++zTop;
  renderTaskbar();
}

function bindWindow(win){
  const e=win.el;
  $('.win-ctrls',e).addEventListener('click',ev=>{
    const b=ev.target.closest('.wc');if(!b)return;
    ev.stopPropagation();
    const a=b.dataset.a;
    if(a==='close')closeWin(win.id);
    else if(a==='min'){win.el.classList.add('min');win.minimized=true;renderTaskbar();}
    else if(a==='max')toggleMax(win);
  });
  e.addEventListener('mousedown',()=>focusWin(win),true);

  const tb=$('.win-tb',e);
  let drag=null;
  tb.addEventListener('pointerdown',ev=>{
    if(ev.target.closest('.wc'))return;
    if(win.maximized)return;
    drag={x:ev.clientX,y:ev.clientY,l:parseFloat(e.style.left),t:parseFloat(e.style.top),snap:null};
    tb.setPointerCapture(ev.pointerId);
    e.style.transition='none';
  });
  tb.addEventListener('pointermove',ev=>{
    if(!drag)return;
    const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;
    e.style.left=(drag.l+dx)+'px';
    e.style.top=Math.max(0,drag.t+dy)+'px';
    const sp=$('#snap');let zone=null;
    if(ev.clientY<6)zone='top';
    else if(ev.clientX<6)zone='left';
    else if(ev.clientX>innerWidth-6)zone='right';
    drag.snap=zone;
    if(zone){
      sp.style.display='block';
      if(zone==='top'){sp.style.left='0';sp.style.top='0';sp.style.width='100%';sp.style.height=(innerHeight-48)+'px';}
      if(zone==='left'){sp.style.left='0';sp.style.top='0';sp.style.width='50%';sp.style.height=(innerHeight-48)+'px';}
      if(zone==='right'){sp.style.left='50%';sp.style.top='0';sp.style.width='50%';sp.style.height=(innerHeight-48)+'px';}
    } else sp.style.display='none';
  });
  tb.addEventListener('pointerup',()=>{
    if(!drag)return;
    const zone=drag.snap;drag=null;
    $('#snap').style.display='none';
    if(zone==='top')toggleMax(win,true);
    else if(zone==='left')setSnap(win,0,0,innerWidth/2,innerHeight-48);
    else if(zone==='right')setSnap(win,innerWidth/2,0,innerWidth/2,innerHeight-48);
  });

  $$('.rz',e).forEach(h=>{
    let rs=null;
    h.addEventListener('pointerdown',ev=>{
      ev.stopPropagation();
      rs={d:h.dataset.d,x:ev.clientX,y:ev.clientY,l:parseFloat(e.style.left),t:parseFloat(e.style.top),
          w:parseFloat(e.style.width),h:parseFloat(e.style.height)};
      h.setPointerCapture(ev.pointerId);
      e.style.transition='none';
    });
    h.addEventListener('pointermove',ev=>{
      if(!rs)return;
      const dx=ev.clientX-rs.x,dy=ev.clientY-rs.y,d=rs.d;
      let nl=rs.l,nt=rs.t,nw=rs.w,nh=rs.h;
      if(d.includes('e'))nw=Math.max(340,rs.w+dx);
      if(d.includes('s'))nh=Math.max(220,rs.h+dy);
      if(d.includes('w')){nw=Math.max(340,rs.w-dx);nl=rs.l+(rs.w-nw);}
      if(d.includes('n')){nh=Math.max(220,rs.h-dy);nt=rs.t+(rs.h-nh);}
      e.style.left=nl+'px';e.style.top=nt+'px';e.style.width=nw+'px';e.style.height=nh+'px';
      if(win.app.onResize)win.app.onResize(win);
    });
    h.addEventListener('pointerup',()=>{rs=null;});
  });
}

function toggleMax(win,force){
  const e=win.el;
  if(!win.maximized||force){
    win.prev={l:e.style.left,t:e.style.top,w:e.style.width,h:e.style.height};
    e.classList.add('max');
    e.style.left='0';e.style.top='0';e.style.width='100%';e.style.height=(innerHeight-48)+'px';
    win.maximized=true;
  } else {
    e.classList.remove('max');
    if(win.prev){e.style.left=win.prev.l;e.style.top=win.prev.t;e.style.width=win.prev.w;e.style.height=win.prev.h;}
    win.maximized=false;
  }
  if(win.app.onResize)setTimeout(()=>win.app.onResize(win),40);
}
function setSnap(win,l,t,w,h){
  const e=win.el;
  if(!win.maximized)win.prev={l:e.style.left,t:e.style.top,w:e.style.width,h:e.style.height};
  e.style.left=l+'px';e.style.top=t+'px';e.style.width=w+'px';e.style.height=h+'px';
  win.maximized=false;
  if(win.app.onResize)setTimeout(()=>win.app.onResize(win),40);
}

/* ---------- CALCULATOR ---------- */
function calcEval(expr){
  const tokens=expr.match(/(\d+\.?\d*|[+\-*/()])/g);
  if(!tokens)return 0;
  let i=0;
  const peek=()=>tokens[i], next=()=>tokens[i++];
  function pE(){let v=pT();while(peek()==='+'||peek()==='-'){const op=next();const r=pT();v=op==='+'?v+r:v-r;}return v;}
  function pT(){let v=pF();while(peek()==='*'||peek()==='/'){const op=next();const r=pF();v=op==='*'?v*r:(r===0?NaN:v/r);}return v;}
  function pF(){if(peek()==='-'){next();return -pF();}if(peek()==='('){next();const v=pE();if(peek()===')')next();return v;}return parseFloat(next())||0;}
  const r=pE();return isFinite(r)?r:NaN;
}

  const wrap=$('.paintwrap',body),cv=$('#pcv',body),ctx=cv.getContext('2d');

    const r=wrap.getBoundingClientRect();
    let img=null;
    if(cv.width&&cv.height){try{img=ctx.getImageData(0,0,cv.width,cv.height);}catch(e){}}
    cv.width=Math.max(1,Math.floor(r.width));
    cv.height=Math.max(1,Math.floor(r.height));
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    if(img)try{ctx.putImageData(img,0,0);}catch(e){}
  }
  setTimeout(resize,40);
  win.app.onResize=resize;
  body.addEventListener('click',e=>{
    const t=e.target.closest('[data-tool]');
    if(t){tool=t.dataset.tool;
      $('#tb-brush',body).classList.toggle('pri',tool==='brush');
      $('#tb-eraser',body).classList.toggle('pri',tool==='eraser');}
    if(e.target.id==='pclear'){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);}

APPS.terminal={name:'Терминал',icon:'⌨️',w:820,h:520,render(body,win){
  body.innerHTML='<div class="term" id="term"></div>';
  const t=$('#term',body);
  let hist=LS.get('cmdhist',[]),hi=hist.length;
  let cwd='C:\\Users\\User';
  const line=html=>{const d=el('div','ln',html);t.appendChild(d);t.scrollTop=t.scrollHeight;return d;};
  function prompt(){
    const row=el('div','inrow');
    row.innerHTML='<span class="pr">'+cwd+'&gt;</span><input spellcheck="false">';
    t.appendChild(row);
    const inp=$('input',row);inp.focus();t.scrollTop=t.scrollHeight;
    inp.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'){
        const v=inp.value;
        row.innerHTML='<span class="pr">'+cwd+'&gt;</span><span>'+esc(v)+'</span>';
        if(v.trim()){hist.push(v);if(hist.length>100)hist.shift();LS.set('cmdhist',hist);hi=hist.length;}
        run(v.trim());prompt();
      }else if(ev.key==='ArrowUp'){ev.preventDefault();if(hi>0){hi--;inp.value=hist[hi]||'';}}
      else if(ev.key==='ArrowDown'){ev.preventDefault();if(hi<hist.length-1){hi++;inp.value=hist[hi]||'';}else{hi=hist.length;inp.value='';}}
    });
    t.onclick=()=>inp.focus();
  }
  function run(cmd){
    if(!cmd)return;
    const parts=cmd.split(/\s+/),c=parts[0],a=parts.slice(1).join(' ');
    const C=c.toLowerCase();
    switch(C){
      case 'help':
        line('<span class="cy">Команды:</span> help, ver, dir, cls, date, time, echo, whoami, hostname, ipconfig, tasklist, tree, банк, настройки, камера, часы, qr, exit, shutdown, restart');
        break;
      case 'ver':line(OS.name+' [Версия '+OS.version+'.'+OS.build+']');break;
      case 'dir':
        line(' Содержимое папки '+cwd);line('');
        FS.children.forEach(f=>line('  '+(f.type==='folder'?'<DIR>       ':'            ')+esc(f.name)));
        break;
      case 'cls':t.innerHTML='';break;
      case 'date':line('Дата: '+new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));break;
      case 'time':line('Время: '+new Date().toLocaleTimeString('ru-RU'));break;
      case 'echo':line(esc(a));break;
      case 'whoami':line('novaos\\user');break;
      case 'hostname':line('NOVA-PC');break;
      case 'ipconfig':
        line('IPv4: 192.168.1.42');line('Маска: 255.255.255.0');line('Шлюз: 192.168.1.1');break;
      case 'tasklist':
        Array.from(WINS.values()).forEach((w,i)=>{
          line((w.app.name+'.exe').padEnd(28)+String(1000+i*137).padStart(6)+'  '+String(Math.floor(Math.random()*80000)+12000).padStart(8)+' КБ');
        });break;
      case 'tree':{
        const walk=(n,pre)=>{line(pre+(n.icon||'📁')+' '+esc(n.name));(n.children||[]).forEach((k,i)=>walk(k,pre+(i===n.children.length-1?'    ':'│   ')));};
        line(cwd);walk(FS,'');break;}
      case 'банк':openApp('bank');line('<span class="ok">Запуск NovaBank...</span>');break;
      case 'настройки':openApp('settings');line('<span class="ok">Запуск Параметров...</span>');break;
      case 'камера':openApp('camera');line('<span class="ok">Запуск Камеры...</span>');break;
      case 'часы':openApp('clock');line('<span class="ok">Запуск Часов...</span>');break;
      case 'qr':openApp('qr');line('<span class="ok">Запуск QR...</span>');break;
      case 'exit':closeWin(win.id);break;
      case 'shutdown':powerAction('shutdown');break;
      case 'restart':powerAction('restart');break;
      default:line('<span class="er">\''+esc(c)+'\' не является командой.</span>');
    }
  }
  line(OS.name+' [Версия '+OS.version+'.'+OS.build+']');
  line('(c) '+OS.year+' '+OS.author+'. Все права защищены.');
  line('');
  prompt();
}};

const ENGINES={

  yandex:{name:'Яндекс',url:q=>'https://yandex.ru/search/?text='+encodeURIComponent(q)},

APPS.browser={name:'Браузер',icon:'🌐',w:980,h:650,render(body,win){
  let engine=LS.get('engine','google'),history=[],hIndex=-1;
  body.innerHTML=
    '<div class="toolbar">'+
      '<button class="btn" id="bback">←</button>'+
      '<button class="btn" id="bfwd">→</button>'+
      '<button class="btn" id="brel">🔄</button>'+
      '<button class="btn" id="bhome">🏠</button>'+
      '<input class="inp" id="burl" style="flex:1;min-width:120px" placeholder="Адрес или запрос">'+
      '<button class="btn pri" id="bgo">Перейти</button>'+
      '<button class="btn" id="bnew" title="Новая вкладка">↗</button>'+
    '</div><div id="bview" style="flex:1;position:relative;overflow:hidden;background:var(--win-bg)"></div>';
  const view=$('#bview',body),urlInp=$('#burl',body);
  function home(){
    view.innerHTML=
      '<div style="height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:50px 20px">'+
        '<div style="font-size:52px;font-weight:200;letter-spacing:-2px;margin-bottom:6px">'+OS.name+' <span style="color:var(--accent)">Search</span></div>'+
        '<p class="muted" style="margin-bottom:26px">Быстрый поиск в интернете</p>'+
        '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;justify-content:center">'+
          Object.entries(ENGINES).map(([k,v])=>'<button class="btn'+(k===engine?' pri':'')+'" data-eng="'+k+'">'+v.name+'</button>').join('')+
        '</div>'+
        '<div style="display:flex;gap:8px;width:100%;max-width:560px">'+
          '<input class="inp" id="hq" placeholder="Поисковый запрос..." style="flex:1">'+
          '<button class="btn pri" id="hgo">Найти</button>'+
        '</div>'+
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%;max-width:620px;margin-top:40px">'+
          [['Wikipedia','https://ru.wikipedia.org','📚'],['YouTube','https://youtube.com','▶️'],
           ['GitHub','https://github.com','🐙'],['Habr','https://habr.com','💡'],
           ['Кинопоиск','https://kinopoisk.ru','🎬'],['ВКонтакте','https://vk.com','💬']]
          .map(([n,u,i])=>'<div class="card" data-link="'+u+'" style="cursor:pointer;text-align:center;padding:16px 8px">'+
            '<div style="font-size:26px">'+i+'</div><div style="font-size:11.5px;margin-top:7px">'+n+'</div></div>').join('')+
        '</div></div>';
    urlInp.value='';
    view.onclick=e=>{
      const eng=e.target.closest('[data-eng]');
      if(eng){engine=eng.dataset.eng;LS.set('engine',engine);home();return;}
      const lnk=e.target.closest('[data-link]');
      if(lnk){navigate(lnk.dataset.link);return;}
      if(e.target.id==='hgo'){const q=$('#hq',view).value.trim();if(q)navigate(q);}
    };
    view.onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='hq'){const q=e.target.value.trim();if(q)navigate(q);}};
  }
  function navigate(input){
    let url=input.trim();if(!url)return;
    if(!/^https?:\/\//i.test(url)&&!/^[\w-]+(\.[\w-]+)+/.test(url))url=ENGINES[engine].url(url);
    else if(!/^https?:\/\//i.test(url))url='https://'+url;
    urlInp.value=url;
    history=history.slice(0,hIndex+1);history.push(url);hIndex=history.length-1;
    view.innerHTML='<iframe src="'+url+'" style="width:100%;height:100%;border:none;background:#fff" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>'+
      '<div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-dim);background:var(--panel);padding:5px 12px;border-radius:12px;backdrop-filter:blur(20px)">Если сайт не загрузился — нажмите ↗</div>';
  }
  body.addEventListener('click',e=>{
    if(e.target.id==='bgo')navigate(urlInp.value);
    if(e.target.id==='bhome')home();
    if(e.target.id==='brel'){if(urlInp.value)navigate(urlInp.value);else home();}
    if(e.target.id==='bback'&&hIndex>0){hIndex--;navigate(history[hIndex]);}
    if(e.target.id==='bfwd'&&hIndex<history.length-1){hIndex++;navigate(history[hIndex]);}
    if(e.target.id==='bnew'){if(urlInp.value)window.open(urlInp.value,'_blank');}
  });
  urlInp.addEventListener('keydown',e=>{if(e.key==='Enter')navigate(urlInp.value);});
  home();
}};

        B.savings.push({id:Date.now(),name:n,balance:0,goal:g,rate:8});

      }

        const v=parseFloat(prompt('Сумма пополнения, ₽:','1000'));
        const card=B.cards.find(c=>!c.blocked);
        if(v>0&&card&&card.balance>=v){card.balance-=v;s.balance+=v;op('out','Пополнение «'+s.name+'»',v);save();draw();toast('Готово',money(v));}

          '<div class="field" style="flex:1;min-width:160px"><label>Сумма, ₽</label><input class="inp" id="cr-sum" type="number" value="300000"></div>'+

            B.cards.filter(c=>!c.blocked).map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div>'+
          '<button class="btn" id="cr-calc">Рассчитать</button>'+
          '<button class="btn pri" id="cr-go">Оформить</button>'+
        '</div>'+
        '<div id="cr-info" class="muted" style="margin-top:10px"></div>'+
      '</div>'+
      (B.credits.length?'<div class="grid2">'+B.credits.map(c=>
        '<div class="card"><h4>🏧 '+money(c.sum)+'</h4>'+
        '<div class="muted" style="font-size:11.5px;margin-top:6px">'+c.months+' мес · 19.9%</div>'+
        '<div style="font-size:15px;margin:10px 0">Платёж: <b>'+money(c.payment)+'</b></div>'+
        '<div style="font-size:13px">Остаток: <b>'+money(c.left)+'</b></div>'+
        '<button class="btn dan" data-cr="pay" data-id="'+c.id+'" style="margin-top:12px">Погасить</button></div>').join('')+'</div>'
        :'<div class="empty-note">Кредитов нет</div>');
    function calc(){
      const s=parseFloat($('#cr-sum',b).value)||0;
      const n=parseInt($('#cr-mon',b).value)||12;
      const r=19.9/12/100;
      const p=s*r/(1-Math.pow(1+r,-n));
      $('#cr-info',b).innerHTML='Платёж: <b style="color:var(--text)">'+money(p)+'</b> · Всего: <b style="color:var(--text)">'+money(p*n)+'</b>';
      return p;
    }
    b.addEventListener('click',e=>{
      if(e.target.id==='cr-calc')calc();
      if(e.target.id==='cr-go'){
        const s=parseFloat($('#cr-sum',b).value)||0;
        const n=parseInt($('#cr-mon',b).value)||12;
        const card=B.cards.find(c=>c.id==+$('#cr-card',b).value);
        if(!card||s<1000)return toast('Ошибка','Проверьте');
        const p=calc();
        card.balance+=s;B.credits.push({id:Date.now(),sum:s,months:n,payment:p,left:s,opened:Date.now()});
        op('in','Кредит на '+n+' мес',s);save();draw();toast('Кредит одобрен',money(s));
      }
      const btn=e.target.closest('[data-cr]');
      if(btn){
        const c=B.credits.find(x=>x.id==+btn.dataset.id);
        const card=B.cards.find(x=>!x.blocked);
        if(!c||!card)return;
        if(card.balance<c.left)return toast('Мало средств',money(c.left));
        card.balance-=c.left;op('out','Погашение кредита',c.left);
        B.credits=B.credits.filter(x=>x.id!==c.id);save();draw();toast('Кредит погашен','');
      }
    });
    calc();
  }

  let installed=LS.get('installed',[]),cat='Все',q='';

      CATS.map(c=>'<button class="btn cat" data-c="'+c+'">'+c+'</button>').join('')+
    '</div><div class="pane" id="st-body"></div>';
  function draw(){
    const b=$('#st-body',body);
    const list=STORE.filter(a=>(cat==='Все'||a.cat===cat)&&(!q||a.name.toLowerCase().includes(q.toLowerCase())));
    b.innerHTML=list.length?'<div class="storegrid">'+list.map(a=>{

      return '<div class="scard" data-id="'+a.id+'">'+
        '<div class="si">'+a.icon+'</div><div class="sb">'+
        '<div class="sn">'+esc(a.name)+'</div>'+
        '<div class="sd">'+esc(a.desc)+'</div>'+
        '<div class="ss">'+a.cat+' · '+a.size+'</div>'+
        '<div class="prog" id="p-'+a.id+'" style="display:none"><i></i></div>'+
        '<button class="btn '+(inst?'':'pri')+'" data-inst="'+a.id+'" style="justify-content:center">'+(inst?'Открыть':'Установить')+'</button>'+
        '</div></div>';
    }).join('')+'</div>':'<div class="empty-note">Ничего не найдено</div>';
  }
  draw();
  body.addEventListener('click',e=>{
    const c=e.target.closest('.cat');
    if(c){cat=c.dataset.c;$$('.cat',body).forEach(x=>x.classList.toggle('pri',x.dataset.c===cat));draw();return;}
    const btn=e.target.closest('[data-inst]');if(!btn)return;

    const app=STORE.find(x=>x.id===id);
    if(installed.includes(id)){openApp(id);return;}
    btn.disabled=true;btn.textContent='Загрузка...';
    const prog=$('#p-'+id,body);prog.style.display='block';
    const bar=$('i',prog);let p=0;
    const iv=setInterval(()=>{
      p+=Math.random()*14+6;
      if(p>=100){
        p=100;clearInterval(iv);bar.style.width='100%';
        btn.textContent='Установка...';
        setTimeout(()=>{
          installed.push(id);LS.set('installed',installed);
          APPS[id]={name:app.name,icon:app.icon,w:640,h:480,render:(bd,w)=>genericApp(bd,w,app)};
          btn.textContent='Открыть';btn.disabled=false;btn.classList.remove('pri');
          prog.style.display='none';
          renderDesktopIcons();renderStartGrid();
          notify('✅','Установлено',app.name+' установлено');
        },900);
      }
      bar.style.width=p+'%';
    },160);
  });
  body.addEventListener('input',e=>{
    if(e.target.id==='st-q'){q=e.target.value;draw();}
  });
}};

APPS.camera={name:'Камера',icon:'📷',w:920,h:660,render(body,win){
  let stream=null,recorder=null,chunks=[],mode='photo',facing='user',recTimer=null,recSec=0;
  let gallery=[];
  body.innerHTML=
    '<div class="toolbar">'+
      '<button class="btn pri" id="c-mode-photo">📷 Фото</button>'+
      '<button class="btn" id="c-mode-video">🎥 Видео</button>'+
      '<span style="flex:1"></span>'+
      '<button class="btn" id="c-flip">🔄 Камера</button>'+
      '<span class="muted" id="c-status">Готово</span>'+
    '</div>'+
    '<div class="camwrap" id="c-wrap" style="flex:1;position:relative;background:#000;display:grid;place-items:center;overflow:hidden;min-height:0">'+
      '<video id="c-video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>'+
      '<div class="vfc tl" style="position:absolute;width:30px;height:30px;border:2.5px solid rgba(255,255,255,.55);top:18px;left:18px;border-right:none;border-bottom:none"></div>'+
      '<div class="vfc tr" style="position:absolute;width:30px;height:30px;border:2.5px solid rgba(255,255,255,.55);top:18px;right:18px;border-left:none;border-bottom:none"></div>'+
      '<div class="vfc bl" style="position:absolute;width:30px;height:30px;border:2.5px solid rgba(255,255,255,.55);bottom:18px;left:18px;border-right:none;border-top:none"></div>'+
      '<div class="vfc br" style="position:absolute;width:30px;height:30px;border:2.5px solid rgba(255,255,255,.55);bottom:18px;right:18px;border-left:none;border-top:none"></div>'+
      '<div id="c-rec" style="position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 14px;border-radius:14px;font-size:12.5px;display:none;align-items:center;gap:7px;color:#fff"><span style="width:9px;height:9px;border-radius:50%;background:#ff453a"></span><span id="c-timer">00:00</span></div>'+
      '<div class="flash" id="c-flash" style="position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none"></div>'+
    '</div>'+
    '<div class="camgal" id="c-gal" style="display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--border);flex-shrink:0;min-height:62px"></div>'+
    '<div class="cambar" style="display:flex;align-items:center;justify-content:center;padding:13px;background:var(--win-head);border-top:1px solid var(--border);flex-shrink:0">'+
      '<button class="shutter" id="c-shot" style="width:58px;height:58px;border-radius:50%;border:4px solid var(--text);display:grid;place-items:center;background:none;cursor:pointer"><i style="width:44px;height:44px;border-radius:50%;background:var(--text);display:block"></i></button>'+
    '</div>';
  const video=$('#c-video',body),wrap=$('#c-wrap',body);

  async function start(){
    try{
      if(stream)stream.getTracks().forEach(t=>t.stop());
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
      video.srcObject=stream;
      video.style.transform=facing==='user'?'scaleX(-1)':'';
      $('#c-status',body).textContent='Активна';
    }catch(err){
      wrap.innerHTML=
        '<div style="padding:40px;text-align:center;color:#fff">'+
        '<div style="font-size:56px">📷</div>'+
        '<h3 style="font-weight:300;margin:14px 0 8px">Камера недоступна</h3>'+
        '<p style="opacity:.7;font-size:13px;max-width:340px;margin:0 auto 20px">'+
        (err&&err.name==='NotAllowedError'?'Доступ к камере запрещён.':'Не удалось получить доступ.')+'</p>'+
        '<button class="btn pri" id="c-retry">🔄 Повторить</button></div>';
      $('#c-retry',wrap).onclick=()=>renderCamera(body,win);
    }
  }
  function shot(){
    if(!stream)return;
    const fl=$('#c-flash',body);
    fl.style.animation='none';void fl.offsetWidth;fl.style.animation='fl .32s ease';
    const c=document.createElement('canvas');
    c.width=video.videoWidth||640;c.height=video.videoHeight||480;
    const ctx=c.getContext('2d');
    if(facing==='user'){ctx.translate(c.width,0);ctx.scale(-1,1);}
    ctx.drawImage(video,0,0,c.width,c.height);
    gallery.push({type:'image',url:c.toDataURL('image/png')});
    drawGallery();
    notify('📷','Камера','Снимок сохранён');
  }
  function toggleRecord(){
    if(recorder&&recorder.state==='recording'){recorder.stop();return;}
    if(!stream)return;
    try{
      chunks=[];
      recorder=new MediaRecorder(stream);
      recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      recorder.onstop=()=>{
        const blob=new Blob(chunks,{type:'video/webm'});
        gallery.push({type:'video',url:URL.createObjectURL(blob)});
        drawGallery();
        $('#c-rec',body).style.display='none';
        clearInterval(recTimer);recSec=0;
        $('#c-shot',body).innerHTML='<i style="width:44px;height:44px;border-radius:50%;background:var(--text);display:block"></i>';
        $('#c-status',body).textContent='Запись остановлена';
        notify('🎥','Камера','Видео записано');
      };
      recorder.start();
      $('#c-rec',body).style.display='flex';
      $('#c-shot',body).innerHTML='<i style="width:28px;height:28px;border-radius:9px;background:#ff453a;display:block"></i>';
      recSec=0;$('#c-timer',body).textContent='00:00';
      recTimer=setInterval(()=>{recSec++;$('#c-timer',body).textContent=pad(Math.floor(recSec/60))+':'+pad(recSec%60);},1000);
      $('#c-status',body).textContent='Запись...';
    }catch(e){notify('⚠️','Камера','Запись не поддерживается');}
  }
  function drawGallery(){
    $('#c-gal',body).innerHTML=gallery.map((g,i)=>
      g.type==='image'?'<img src="'+g.url+'" data-i="'+i+'" style="height:44px;border-radius:var(--r6);cursor:pointer;border:2px solid transparent">'
        :'<video src="'+g.url+'" data-i="'+i+'" muted style="height:44px;border-radius:var(--r6);cursor:pointer;border:2px solid transparent"></video>').join('');
  }
  body.addEventListener('click',e=>{
    if(e.target.id==='c-shot'||e.target.closest('#c-shot')){
      if(mode==='photo')shot();else toggleRecord();
    }
    if(e.target.id==='c-mode-photo'){mode='photo';$('#c-mode-photo',body).classList.add('pri');$('#c-mode-video',body).classList.remove('pri');if(recorder&&recorder.state==='recording')recorder.stop();}
    if(e.target.id==='c-mode-video'){mode='video';$('#c-mode-video',body).classList.add('pri');$('#c-mode-photo',body).classList.remove('pri');}
    if(e.target.id==='c-flip'){facing=facing==='user'?'environment':'user';start();}
    const g=e.target.closest('[data-i]');
    if(g&&(g.tagName==='IMG'||g.tagName==='VIDEO')){
      const gi=gallery[+g.dataset.i];
      if(gi)window.open(gi.url,'_blank');
    }
  });
  start();
  win.app.onClose=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(recorder&&recorder.state==='recording')recorder.stop();};
}};

APPS.clock={name:'Часы',icon:'🕐',w:700,h:560,render(body,win){
  let tab='analog';
  body.innerHTML=
    '<div class="tabs">'+
      '<button class="tab on" data-t="analog">🕐 Аналоговые</button>'+
      '<button class="tab" data-t="world">🌍 Мировые</button>'+
      '<button class="tab" data-t="sw">⏱️ Секундомер</button>'+
      '<button class="tab" data-t="timer">⏳ Таймер</button>'+
    '</div><div class="main" id="ck-body" style="display:flex;flex-direction:column"></div>';
  const b=$('#ck-body',body);
  let raf=null,swT=0,swRun=false,swStart=0,laps=[],timerEnd=0,timerIv=null;

  function clearAll(){if(raf)cancelAnimationFrame(raf);raf=null;if(timerIv){clearInterval(timerIv);timerIv=null;}}

  function draw(){
    clearAll();b.innerHTML='';
    if(tab==='analog'){
      b.innerHTML='<div class="clockbig"><canvas id="ck-cv" width="280" height="280"></canvas>'+
        '<div style="font-size:30px;font-weight:200;margin-top:14px;font-variant-numeric:tabular-nums" id="ck-dig"></div></div>';
      const cv=$('#ck-cv',b),ctx=cv.getContext('2d');
      const tick=()=>{
        const d=new Date(),R=130,cx=140,cy=140;
        ctx.clearRect(0,0,280,280);
        ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,.05)';ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.stroke();
        for(let i=0;i<60;i++){
          const a=i*Math.PI/30-Math.PI/2;
          const big=i%5===0;
          const r1=R-(big?13:7),r2=R-4;
          ctx.beginPath();
          ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
          ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);
          ctx.strokeStyle=big?'#fff':'rgba(255,255,255,.3)';
          ctx.lineWidth=big?2.5:1;ctx.stroke();
        }
        const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0a84ff';
        function hand(angle,len,w,color){
          ctx.beginPath();ctx.moveTo(cx,cy);
          ctx.lineTo(cx+Math.cos(angle)*len,cy+Math.sin(angle)*len);
          ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();
        }
        const h=d.getHours()%12,m=d.getMinutes(),s=d.getSeconds(),ms=d.getMilliseconds();
        hand((h+m/60)*Math.PI/6-Math.PI/2,62,6,'#fff');
        hand((m+s/60)*Math.PI/30-Math.PI/2,88,4,'#fff');
        hand((s+ms/1000)*Math.PI/30-Math.PI/2,102,2,acc);
        ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fillStyle=acc;ctx.fill();
        $('#ck-dig',b).textContent=d.toLocaleTimeString('ru-RU');
        raf=requestAnimationFrame(tick);
      };
      tick();
    }
    else if(tab==='world'){
      const cities=[{n:'Москва',f:'🇷🇺',tz:3},{n:'Лондон',f:'🇬🇧',tz:0},{n:'Нью-Йорк',f:'🇺🇸',tz:-5},
        {n:'Токио',f:'🇯🇵',tz:9},{n:'Дубай',f:'🇦🇪',tz:4},{n:'Сидней',f:'🇦🇺',tz:10}];
      b.innerHTML=cities.map(c=>{
        const d=new Date(Date.now()+(c.tz*60+new Date().getTimezoneOffset())*60000);
        return '<div class="wcity"><span class="wf">'+c.f+'</span><span class="wn">'+c.n+'</span>'+
          '<span class="wtm">'+pad(d.getHours())+':'+pad(d.getMinutes())+'</span></div>';
      }).join('');
    }
    else if(tab==='sw'){
      b.innerHTML=
        '<div class="tdisp" id="sw-d">00:00.00</div>'+
        '<div style="display:flex;gap:10px;justify-content:center">'+
          '<button class="btn pri" id="sw-go" style="min-width:110px;justify-content:center">Старт</button>'+
          '<button class="btn" id="sw-lap">Круг</button>'+
          '<button class="btn" id="sw-rst">Сброс</button>'+
        '</div><div class="laps" id="sw-laps"></div>';
      const disp=$('#sw-d',b);
      const fmt=ms=>{const t=Math.floor(ms);return pad(Math.floor(t/60000))+':'+pad(Math.floor(t%60000/1000))+'.'+pad(Math.floor(t%1000/10));};
      const upd=()=>{
        const t=swRun?swT+(performance.now()-swStart):swT;
        disp.textContent=fmt(t);
        if(swRun)raf=requestAnimationFrame(upd);
      };
      upd();
      $('#sw-go',b).onclick=()=>{
        if(swRun){swT+=performance.now()-swStart;swRun=false;$('#sw-go',b).textContent='Старт';}
        else{swStart=performance.now();swRun=true;$('#sw-go',b).textContent='Пауза';upd();}
      };
      $('#sw-lap',b).onclick=()=>{
        const t=swRun?swT+(performance.now()-swStart):swT;
        laps.unshift(fmt(t));
        $('#sw-laps',b).innerHTML=laps.slice(0,30).map((l,i)=>'<div class="lap"><span>Круг '+(laps.length-i)+'</span><span>'+l+'</span></div>').join('');
      };
      $('#sw-rst',b).onclick=()=>{swT=0;swRun=false;laps=[];$('#sw-go',b).textContent='Старт';$('#sw-laps',b).innerHTML='';disp.textContent='00:00.00';};
    }
    else{
      b.innerHTML=
        '<div class="tdisp" id="tm-d">00:00:00</div>'+
        '<div class="row" style="justify-content:center;margin-bottom:16px;flex-wrap:wrap">'+
          '<div class="field" style="margin:0"><label>Часы</label><input class="inp" id="tm-h" type="number" value="0" min="0" style="width:80px"></div>'+
          '<div class="field" style="margin:0"><label>Минуты</label><input class="inp" id="tm-m" type="number" value="1" min="0" style="width:80px"></div>'+
          '<div class="field" style="margin:0"><label>Секунды</label><input class="inp" id="tm-s" type="number" value="0" min="0" style="width:80px"></div>'+
        '</div>'+
        '<div style="display:flex;gap:10px;justify-content:center">'+
          '<button class="btn pri" id="tm-go" style="min-width:110px;justify-content:center">Запустить</button>'+
          '<button class="btn" id="tm-rst">Сброс</button>'+
        '</div>';
      const disp=$('#tm-d',b);
      $('#tm-go',b).onclick=()=>{
        if(timerIv){clearInterval(timerIv);timerIv=null;$('#tm-go',b).textContent='Запустить';return;}
        if(!timerEnd){
          const hh=+$('#tm-h',b).value||0,mm=+$('#tm-m',b).value||0,ss=+$('#tm-s',b).value||0;
          const t=hh*3600+mm*60+ss;
          if(t<=0)return;
          timerEnd=Date.now()+t*1000;
        }
        $('#tm-go',b).textContent='Пауза';
        timerIv=setInterval(()=>{
          const left=Math.max(0,Math.round((timerEnd-Date.now())/1000));
          disp.textContent=pad(Math.floor(left/3600))+':'+pad(Math.floor(left%3600/60))+':'+pad(left%60);
          if(left<=0){clearInterval(timerIv);timerIv=null;timerEnd=0;$('#tm-go',b).textContent='Запустить';notify('⏳','Таймер','Время вышло!');disp.textContent='00:00:00';}
        },200);
      };
      $('#tm-rst',b).onclick=()=>{clearInterval(timerIv);timerIv=null;timerEnd=0;disp.textContent='00:00:00';$('#tm-go',b).textContent='Запустить';};
    }
  }
  body.addEventListener('click',e=>{
    const t=e.target.closest('.tab');
    if(t){tab=t.dataset.t;$$('.tab',body).forEach(x=>x.classList.toggle('on',x.dataset.t===tab));draw();}
  });
  draw();
  win.app.onClose=clearAll;
}};

APPS.qr={name:'QR-код',icon:'📱',w:640,h:640,render(body){
  let type='text';
  const FIELDS={text:{label:'Текст',ph:'Введите текст'},url:{label:'Ссылка',ph:'https://...'},
    phone:{label:'Телефон',ph:'+7 999...'},email:{label:'E-mail',ph:'user@example.com'},
    wifi:{label:'Wi-Fi (SSID;пароль)',ph:'MyWiFi;password'},pay:{label:'Платёж (тел;сумма)',ph:'+79991234567;1000'}};
  body.innerHTML=
    '<div class="pane" style="display:flex;flex-direction:column;align-items:center;gap:16px">'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center" id="qr-types">'+
        Object.keys(FIELDS).map(k=>'<button class="btn'+(k===type?' pri':'')+'" data-t="'+k+'">'+
          {text:'📝 Текст',url:'🔗 URL',phone:'📞 Тел',email:'✉️ Email',wifi:'📶 Wi-Fi',pay:'💳 Платёж'}[k]+'</button>').join('')+
      '</div>'+
      '<div class="field" style="width:100%;max-width:440px">'+
        '<label id="qr-lbl">'+FIELDS[type].label+'</label>'+
        '<input class="inp" id="qr-inp" placeholder="'+FIELDS[type].ph+'">'+
      '</div>'+
      '<button class="btn pri" id="qr-gen" style="min-width:180px;justify-content:center">Сгенерировать</button>'+
      '<canvas id="qr-cv" width="300" height="300" style="border-radius:12px;background:#fff;padding:8px"></canvas>'+
      '<div class="muted" id="qr-desc" style="text-align:center;max-width:440px;word-break:break-all"></div>'+
    '</div>';
  function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function pseudo(seed){let s=seed;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
  function gen(){
    const val=$('#qr-inp',body).value.trim();
    if(!val){notify('⚠️','QR','Введите данные');return;}
    const cv=$('#qr-cv',body),ctx=cv.getContext('2d');
    const N=25,cell=cv.width/N;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    const m=Array.from({length:N},()=>Array(N).fill(0));
    const rnd=pseudo(hash(val));
    function finder(r0,c0){
      for(let r=0;r<7;r++)for(let c=0;c<7;c++){
        const edge=(r===0||r===6||c===0||c===6);
        const inner=(r>=2&&r<=4&&c>=2&&c<=4);
        m[r0+r][c0+c]=(edge||inner)?1:0;
      }
    }
    finder(0,0);finder(0,N-7);finder(N-7,0);
    for(let i=8;i<N-8;i++){m[6][i]=i%2===0?1:0;m[i][6]=i%2===0?1:0;}
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const inF=(r<9&&c<9)||(r<9&&c>N-10)||(r>N-10&&c<9);
      if(inF)continue;
      if(r===6||c===6)continue;
      m[r][c]=rnd()>0.48?1:0;
    }
    m[N-8][8]=1;
    ctx.fillStyle='#000';
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      if(m[r][c])ctx.fillRect(Math.round(c*cell),Math.round(r*cell),Math.ceil(cell),Math.ceil(cell));
    }
    let desc=val;
    if(type==='wifi'){const [s,p]=val.split(';');desc='Wi-Fi: '+s+' · пароль: '+(p||'—');}
    else if(type==='pay'){const [ph,sum]=val.split(';');desc='Платёж на '+ph+' · '+sum+' ₽';}
    else if(type==='phone')desc='tel:'+val.replace(/\s/g,'');
    else if(type==='email')desc='mailto:'+val;
    else if(type==='url')desc=/^https?:/.test(val)?val:'https://'+val;
    $('#qr-desc',body).textContent=desc;
    notify('📱','QR-код','Сгенерирован');
  }
  body.addEventListener('click',e=>{

APPS.recorder={name:'Диктофон',icon:'🎤',w:620,h:600,render(body,win){
  let mr=null,chunks=[],stream=null,iv=null,sec=0;
  let recs=LS.get('recordings_meta',[]);
  body.innerHTML=
    '<div style="display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 18px 10px">'+
      '<div id="rc-btn" style="width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#ff375f,#bf5af2);display:grid;place-items:center;font-size:42px;cursor:pointer;box-shadow:0 10px 34px rgba(255,55,95,.4)">🎤</div>'+
      '<div style="font-size:34px;font-weight:200;font-variant-numeric:tabular-nums" id="rc-time">00:00</div>'+
      '<div class="muted" id="rc-hint">Нажмите, чтобы начать запись</div>'+
    '</div>'+
    '<div class="pane" id="rc-list" style="padding-top:0"></div>';
  function drawList(){
    const l=$('#rc-list',body);
    if(!recs.length){l.innerHTML='<div class="empty-note">Записей нет</div>';return;}
    l.innerHTML=recs.map((r,i)=>
      '<div class="card" style="margin-bottom:9px">'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">'+
        '<div style="font-size:19px">🎵</div><div style="flex:1">'+
        '<div style="font-size:12.5px;font-weight:500">'+esc(r.name)+'</div>'+
        '<div class="muted" style="font-size:10.5px">'+r.date+' · '+r.dur+' · '+r.size+'</div></div>'+
        (r.blobUrl?'<button class="btn" data-dl="'+i+'">💾</button>':'')+
        '<button class="btn dan" data-del="'+i+'">🗑️</button>'+
      '</div>'+
      (r.blobUrl?'<audio controls src="'+r.blobUrl+'" style="width:100%;height:32px"></audio>'
                 :'<div class="muted" style="font-size:11px">Аудио недоступно после перезагрузки</div>')+
      '</div>').join('');
  }
  drawList();
  function toggleRec(){
    if(mr&&mr.state==='recording'){mr.stop();return;}
    navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
      stream=s;chunks=[];
      mr=new MediaRecorder(s);
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{
        const blob=new Blob(chunks,{type:'audio/webm'});
        const url=URL.createObjectURL(blob);
        const d=new Date();
        recs.unshift({name:'Запись '+(recs.length+1),date:d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),
          dur:pad(Math.floor(sec/60))+':'+pad(sec%60),size:(blob.size/1024).toFixed(0)+' КБ',blobUrl:url});
        LS.set('recordings_meta',recs.map(r=>({...r,blobUrl:undefined})));
        drawList();notify('🎤','Диктофон','Запись сохранена');
        if(stream)stream.getTracks().forEach(t=>t.stop());
        $('#rc-btn',body).style.animation='';
        $('#rc-hint',body).textContent='Нажмите, чтобы начать запись';
        clearInterval(iv);
      };
      mr.start();sec=0;
      $('#rc-time',body).textContent='00:00';
      $('#rc-btn',body).style.animation='pulse 1.2s infinite';
      $('#rc-hint',body).textContent='Идёт запись...';
      iv=setInterval(()=>{sec++;$('#rc-time',body).textContent=pad(Math.floor(sec/60))+':'+pad(sec%60);},1000);
    }).catch(()=>notify('⚠️','Диктофон','Нет доступа к микрофону'));
  }
  $('#rc-btn',body).addEventListener('click',toggleRec);
  body.addEventListener('click',e=>{
    const dl=e.target.closest('[data-dl]');
    if(dl){const r=recs[+dl.dataset.dl];if(r.blobUrl){const a=document.createElement('a');a.href=r.blobUrl;a.download=r.name+'.webm';a.click();}}
    const del=e.target.closest('[data-del]');
    if(del){recs.splice(+del.dataset.del,1);LS.set('recordings_meta',recs.map(r=>({...r,blobUrl:undefined})));drawList();}
  });
  win.app.onClose=()=>{if(mr&&mr.state==='recording')mr.stop();if(stream)stream.getTracks().forEach(t=>t.stop());clearInterval(iv);};
}};

APPS.music={name:'Музыка',icon:'🎵',w:620,h:660,render(body,win){
  const TRACKS=[
    {t:'Neon Skyline',a:'Nova Waves',d:'3:42',g:'linear-gradient(135deg,#0a84ff,#5e5ce6)'},
    {t:'Midnight Drive',a:'Synth Rider',d:'4:11',g:'linear-gradient(135deg,#bf5af2,#ff375f)'},
    {t:'Ocean Memory',a:'Calm Sense',d:'3:05',g:'linear-gradient(135deg,#30d158,#40c8e0)'},
    {t:'Golden Hour',a:'Luna Ray',d:'4:38',g:'linear-gradient(135deg,#ff9f0a,#ff375f)'},
    {t:'Deep Focus',a:'Ambient Lab',d:'5:22',g:'linear-gradient(135deg,#5e5ce6,#40c8e0)'}
  ];
  let idx=0,playing=false,pos=0,iv=null,vol=S.volume/100;
  body.innerHTML=
    '<div class="music">'+
      '<div class="album" id="m-album">🎵</div>'+
      '<div style="text-align:center"><div style="font-size:17px;font-weight:600" id="m-title"></div>'+
      '<div class="muted" id="m-artist" style="margin-top:3px"></div></div>'+
      '<div class="viz" id="m-viz">'+Array.from({length:24},()=>'<i></i>').join('')+'</div>'+
      '<div class="mprog"><input type="range" id="m-seek" min="0" max="100" value="0">'+
      '<div class="mtimes"><span id="m-cur">0:00</span><span id="m-dur">0:00</span></div></div>'+
      '<div style="display:flex;gap:22px;align-items:center">'+
        '<button class="btn" id="m-prev" style="font-size:19px;padding:9px 14px">⏮️</button>'+
        '<button class="btn pri" id="m-play" style="font-size:23px;padding:11px 20px">▶️</button>'+
        '<button class="btn" id="m-next" style="font-size:19px;padding:9px 14px">⏭️</button>'+
      '</div>'+
      '<div style="width:100%;max-width:340px"><label class="muted" style="font-size:11px">Громкость</label>'+
      '<input type="range" id="m-vol" min="0" max="100" value="'+S.volume+'"></div>'+
    '</div>';
  const album=$('#m-album',body),viz=$$('#m-viz i',body);
  const dur=()=>{const [m,s]=TRACKS[idx].d.split(':').map(Number);return m*60+s;};
  function load(){
    const t=TRACKS[idx];
    $('#m-title',body).textContent=t.t;$('#m-artist',body).textContent=t.a;
    $('#m-dur',body).textContent=t.d;album.style.background=t.g;pos=0;upd();
  }
  function upd(){
    $('#m-cur',body).textContent=Math.floor(pos/60)+':'+pad(Math.floor(pos%60));
    $('#m-seek',body).value=(pos/dur()*100)||0;
  }
  function tick(){
    if(!playing)return;
    pos+=0.25;
    if(pos>=dur()){pos=0;next();return;}
    upd();
    viz.forEach(b=>{b.style.height=(6+Math.random()*46*vol)+'px';});
    iv=setTimeout(tick,250);
  }
  function play(){playing=true;$('#m-play',body).textContent='⏸️';album.classList.add('spin');tick();}
  function pause(){playing=false;$('#m-play',body).textContent='▶️';album.classList.remove('spin');clearTimeout(iv);viz.forEach(b=>b.style.height='6px');}
  function next(){idx=(idx+1)%TRACKS.length;load();if(playing)tick();}
  function prev(){idx=(idx-1+TRACKS.length)%TRACKS.length;load();if(playing)tick();}
  body.addEventListener('click',e=>{
    if(e.target.id==='m-play'){playing?pause():play();}
    if(e.target.id==='m-next')next();
    if(e.target.id==='m-prev')prev();
  });
  $('#m-seek',body).addEventListener('input',e=>{pos=dur()*e.target.value/100;upd();});
  $('#m-vol',body).addEventListener('input',e=>{vol=e.target.value/100;});
  load();
  win.app.onClose=()=>{playing=false;clearTimeout(iv);};
}};

    $('#cln',m).onclick=()=>{

      setTimeout(()=>{$('#cln',m).textContent='🧹 Очистить временные файлы';notify('💾','Память','Освобождено 2.4 ГБ');},1500);

  function sData(m){
    m.innerHTML=
      '<h2 style="font-weight:300;font-size:23px;margin-bottom:6px">Данные</h2>'+
      '<p class="muted" style="margin-bottom:20px">Экспорт и сброс</p>'+
      '<div class="card" style="margin-bottom:14px"><h4>Экспорт / Импорт</h4>'+
        '<div class="row" style="flex-wrap:wrap">'+
        '<button class="btn pri" id="exp">📤 Экспорт</button>'+
        '<button class="btn" id="imp">📥 Импорт</button>'+
        '<input type="file" id="impf" accept="application/json" style="display:none"></div></div>'+
      '<div class="card"><h4>Сброс</h4>'+
        '<p class="muted" style="font-size:12px;margin-bottom:10px">Удаляет все данные.</p>'+
        '<button class="btn dan" id="rst">⚠️ Полный сброс</button></div>';
    $('#exp',m).onclick=()=>{
      const data={};
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k.startsWith('NovaOS_'))data[k]=localStorage.getItem(k);
      }
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='novaos-backup.json';a.click();
      notify('📤','Данные','Экспорт завершён');
    };
    $('#imp',m).onclick=()=>$('#impf',m).click();
    $('#impf',m).onchange=e=>{
      const f=e.target.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const d=JSON.parse(r.result);
          Object.entries(d).forEach(([k,v])=>localStorage.setItem(k,v));
          notify('📥','Данные','Импорт выполнен. Перезагрузка...');
          setTimeout(()=>location.reload(),1200);
        }catch(err){notify('⚠️','Данные','Ошибка файла');}
      };
      r.readAsText(f);
    };
    $('#rst',m).onclick=()=>{
      if(confirm('Удалить ВСЕ данные NovaOS и перезагрузить?')){
        const keys=[];
        for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('NovaOS_'))keys.push(k);}
        keys.forEach(k=>localStorage.removeItem(k));
        location.reload();
      }
    };
  }
