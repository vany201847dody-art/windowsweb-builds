<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Grok">
<meta name="copyright" content="© 2026 Grok">
<meta name="license" content="Proprietary - All Rights Reserved">
<title>AetherOS</title>
<style>
:root{
  --accent:#0a84ff;
  --bg:#1c1c1e;
  --panel:rgba(28,28,30,.75);
  --text:#fff;
  --muted:rgba(255,255,255,.6);
  --border:rgba(255,255,255,.09);
  --win:#1c1c1e;
  --shadow:0 12px 40px rgba(0,0,0,.45);
  --r:10px;
  --icon:48px;
  --wallpaper:url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920&q=80');
}
[data-theme="light"]{
  --bg:#f2f2f7; --panel:rgba(250,250,252,.82); --text:#1c1c1e;
  --muted:rgba(28,28,30,.55); --border:rgba(0,0,0,.08); --win:#f2f2f7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:var(--text);background:#000;user-select:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
img{max-width:100%}
.hidden{display:none!important}
/* BOOT */
#boot{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.logo4{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:72px;height:72px;animation:pop .8s ease}
.logo4 i{background:var(--accent);border-radius:4px;box-shadow:0 0 18px var(--accent);display:block}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #333;border-top-color:var(--accent);animation:spin .8s linear infinite}
#boot p{color:#888;font-size:14px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
/* LOCK */
#lock{position:fixed;inset:0;z-index:9000;background:var(--wallpaper) center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#lock::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.55))}
.lock-inner{position:relative;text-align:center}
#lockClock{font-size:120px;font-weight:200;letter-spacing:-2px;line-height:1}
#lockDate{font-size:22px;opacity:.9;margin-top:8px}
#lockWeather{position:absolute;right:24px;bottom:24px;font-size:18px}
#lockHint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);opacity:.8;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#lock.out{opacity:0;transition:opacity .4s;pointer-events:none}
/* DESKTOP */
#desktop{position:fixed;inset:0 0 48px 0;background:var(--wallpaper) center/cover no-repeat}
.desk-icons{position:absolute;left:12px;top:12px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:8px 16px}
.dicon{width:86px;text-align:center;padding:6px 4px;border-radius:8px;cursor:default}
.dicon .em{font-size:32px;line-height:1.2}
.dicon .lb{font-size:12px;text-shadow:0 1px 3px #000;word-break:break-word}
.dicon.sel{background:rgba(10,132,255,.28);outline:1px solid var(--accent)}
/* TASKBAR */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;padding:0 8px;gap:8px;
  background:var(--panel);backdrop-filter:blur(40px);border-top:1px solid var(--border);z-index:500}
.start-btn{width:40px;height:40px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:8px;border-radius:8px}
.start-btn i{background:var(--accent);border-radius:2px;transition:transform .15s}
.start-btn:hover i{transform:scale(1.15)}
.searchbox{display:flex;align-items:center;gap:6px;background:rgba(128,128,128,.22);border-radius:20px;padding:6px 12px;min-width:180px}
.searchbox input{background:none;border:none;outline:none;width:140px;color:var(--text)}
.pins,.runs{display:flex;gap:4px}
.tbtn{width:40px;height:40px;border-radius:8px;font-size:18px;position:relative}
.tbtn:hover,.tbtn.on{background:rgba(255,255,255,.1)}
.tbtn .ind{position:absolute;bottom:3px;left:10px;right:10px;height:3px;border-radius:2px;background:var(--accent)}
.tray{margin-left:auto;display:flex;align-items:center;gap:2px}
.tray button,.tray .clk{padding:4px 8px;border-radius:6px;font-size:13px}
.badge{background:#e81123;color:#fff;border-radius:8px;font-size:10px;padding:0 4px;position:absolute;top:2px;right:2px}
/* START */
#start{position:fixed;bottom:56px;left:50%;transform:translateX(-50%) translateY(12px);width:640px;max-width:96vw;
  background:var(--panel);backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:14px;padding:16px;
  box-shadow:var(--shadow);z-index:600;opacity:0;pointer-events:none;transition:.2s}
#start.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#start input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.2);margin-bottom:12px;outline:none}
.appgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:360px;overflow:auto}
.appcell{padding:10px 6px;text-align:center;border-radius:10px}
.appcell:hover{background:rgba(255,255,255,.08)}
.appcell .em{font-size:28px}
.appcell .lb{font-size:11px;margin-top:4px}
.power-row{display:flex;justify-content:flex-end;margin-top:8px}
/* FLYOUTS */
.fly{position:fixed;bottom:56px;right:12px;width:340px;background:var(--panel);backdrop-filter:blur(40px);
  border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);z-index:610;display:none}
.fly.show{display:block}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal-grid .today{background:var(--accent);border-radius:50%;color:#fff}
.qs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.qtile{padding:12px 8px;border-radius:10px;background:rgba(255,255,255,.06);text-align:center;font-size:12px}
.qtile.on{background:var(--accent);color:#fff}
.nlist{max-height:180px;overflow:auto;font-size:13px}
.nitem{padding:8px;border-bottom:1px solid var(--border)}
/* WINDOWS */
.win{position:absolute;min-width:320px;min-height:200px;background:var(--win);border-radius:var(--r);
  border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:100}
.win.dim{opacity:.85}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.titlebar{height:36px;display:flex;align-items:center;padding:0 8px;gap:8px;background:rgba(255,255,255,.03);cursor:move;flex-shrink:0}
.titlebar .tt{flex:1;font-size:13px}
.wbtns{display:flex}
.wbtns button{width:40px;height:36px;font-size:12px}
.wbtns button:hover{background:rgba(255,255,255,.1)}
.wbtns .x:hover{background:#e81123;color:#fff}
.body{flex:1;overflow:auto;padding:12px;font-size:14px}
.rs{position:absolute;background:transparent}
.rs.n{top:0;left:8px;right:8px;height:6px;cursor:n-resize}
.rs.s{bottom:0;left:8px;right:8px;height:6px;cursor:s-resize}
.rs.e{right:0;top:8px;bottom:8px;width:6px;cursor:e-resize}
.rs.w{left:0;top:8px;bottom:8px;width:6px;cursor:w-resize}
.rs.ne{top:0;right:0;width:10px;height:10px;cursor:ne-resize}
.rs.nw{top:0;left:0;width:10px;height:10px;cursor:nw-resize}
.rs.se{bottom:0;right:0;width:10px;height:10px;cursor:se-resize}
.rs.sw{bottom:0;left:0;width:10px;height:10px;cursor:sw-resize}
#snap{position:fixed;background:rgba(10,132,255,.25);border:2px solid var(--accent);pointer-events:none;display:none;z-index:90;border-radius:8px}
/* CTX */
#ctx{position:fixed;z-index:800;min-width:180px;background:var(--panel);backdrop-filter:blur(30px);border:1px solid var(--border);
  border-radius:8px;padding:6px;display:none;box-shadow:var(--shadow)}
#ctx button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:6px;font-size:13px}
#ctx button:hover{background:rgba(255,255,255,.1)}
/* TOAST */
#toasts{position:fixed;right:16px;bottom:64px;z-index:850;display:flex;flex-direction:column;gap:8px}
.toast{width:300px;background:var(--panel);backdrop-filter:blur(30px);border:1px solid var(--border);border-radius:10px;padding:12px;
  animation:inr .25s ease}
@keyframes inr{from{transform:translateX(40px);opacity:0}}
/* APPS UI */
.row{display:flex;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.split{display:flex;height:100%;min-height:280px}
.side{width:180px;border-right:1px solid var(--border);padding-right:8px;overflow:auto}
.main{flex:1;padding-left:8px;overflow:auto}
.btn{background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px}
.btn.g{background:rgba(255,255,255,.1);color:var(--text)}
.card{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;padding:12px}
input[type=text],input[type=password],input[type=number],input[type=email],textarea,select{
  background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:8px;padding:6px 8px;outline:none;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px;border-bottom:1px solid var(--border);text-align:left}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.06)}
.tabs button.on{background:var(--accent);color:#fff}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc button{padding:12px;border-radius:8px;background:rgba(255,255,255,.08);font-size:16px}
.term{background:#0b0b0b;color:#9f9;font-family:Consolas,monospace;height:100%;padding:8px;overflow:auto;white-space:pre-wrap}
.term input{background:transparent;border:none;color:#9f9;font-family:inherit;width:70%}
canvas.full{width:100%;height:calc(100% - 40px);background:#111;border-radius:8px;cursor:crosshair}
.bank-cards{display:flex;gap:10px;flex-wrap:wrap}
.bcard{width:220px;height:130px;border-radius:14px;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photo-grid div{height:90px;border-radius:8px}
.mine{display:grid;grid-template-columns:repeat(9,28px);gap:2px}
.mine button{width:28px;height:28px;background:#333;border-radius:3px;font-size:12px}
.g2048{display:grid;grid-template-columns:repeat(4,64px);gap:6px}
.g2048 div{width:64px;height:64px;background:#333;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700}
.mem{display:grid;grid-template-columns:repeat(4,70px);gap:8px}
.mem button{height:70px;font-size:28px;background:#333;border-radius:8px}
.ttt{display:grid;grid-template-columns:repeat(3,70px);gap:6px}
.ttt button{height:70px;font-size:28px;background:#333;border-radius:8px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
#shutdown{position:fixed;inset:0;background:#000;z-index:10000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
</style>
</head>
<body>
<div id="boot">
  <div class="logo4"><i></i><i></i><i></i><i></i></div>
  <div class="spin"></div>
  <p>Запуск AetherOS...</p>
</div>
<div id="lock" class="hidden">
  <div class="lock-inner">
    <div id="lockClock">00:00</div>
    <div id="lockDate"></div>
  </div>
  <div id="lockWeather">☁️ 18° · Москва</div>
  <div id="lockHint">Нажмите, чтобы войти</div>
</div>
<div id="desktop" class="hidden">
  <div class="desk-icons" id="deskIcons"></div>
</div>
<div id="taskbar" class="hidden">
  <button class="start-btn" id="startBtn" title="Пуск"><i></i><i></i><i></i><i></i></button>
  <div class="searchbox">🔍 <input id="tbSearch" placeholder="Поиск"></div>
  <div class="pins" id="pins"></div>
  <div class="runs" id="runs"></div>
  <div class="tray">
    <button id="volBtn" title="Звук">🔊</button>
    <button title="Wi-Fi">📶</button>
    <button title="Батарея">🔋</button>
    <button class="clk" id="clockBtn"></button>
    <button id="notifBtn" style="position:relative">🔔<span class="badge hidden" id="nBadge">0</span></button>
  </div>
</div>
<div id="start">
  <input id="startSearch" placeholder="Поиск приложений">
  <div style="margin-bottom:8px;opacity:.7">Приложения</div>
  <div class="appgrid" id="appGrid"></div>
  <div class="power-row"><button class="btn g" id="powerBtn">⏻ Питание</button></div>
</div>
<div class="fly" id="calFly"></div>
<div class="fly" id="volFly">
  <div style="font-size:36px;text-align:center" id="volIcon">🔊</div>
  <input type="range" id="volRange" min="0" max="100" value="70" style="width:100%">
  <div id="volPct">70%</div>
</div>
<div class="fly" id="notifFly" style="width:380px"></div>
<div id="snap"></div>
<div id="ctx"></div>
<div id="toasts"></div>
<div id="shutdown"><div class="spin"></div><p style="color:#aaa" id="sdText">Завершение работы...</p></div>
<script>
const OS='AetherOS', VER='1.0', BUILD='10.0.26026', YEAR=2026, AUTHOR='Grok';
const LS=k=>localStorage.getItem(OS+'_'+k);
const SS=(k,v)=>localStorage.setItem(OS+'_'+k, typeof v==='string'?v:JSON.stringify(v));
const settings=Object.assign({theme:'dark',accent:'#0a84ff',wallpaper:"url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920&q=80')",iconSize:48,anim:true,h24:true,seconds:true,vol:70,bright:100,wifi:true,bt:false,airplane:false,night:false,focus:false,rec:false,banners:true,cam:true,mic:true}, JSON.parse(LS('settings')||'{}'));
function applySet(){
  document.documentElement.dataset.theme=settings.theme;
  document.documentElement.style.setProperty('--accent',settings.accent);
  document.documentElement.style.setProperty('--wallpaper',settings.wallpaper);
  document.documentElement.style.setProperty('--icon',settings.iconSize+'px');
  SS('settings',settings);
}
applySet();
const APPS=[
  {id:'pc',name:'Этот компьютер',icon:'💻',cat:'util'},
  {id:'bank',name:'AetherBank',icon:'🏦',cat:'prod'},
  {id:'store',name:'Магазин',icon:'🛒',cat:'util'},
  {id:'browser',name:'Браузер',icon:'🌐',cat:'prod'},
  {id:'camera',name:'Камера',icon:'📷',cat:'media'},
  {id:'clock',name:'Часы',icon:'🕐',cat:'util'},
  {id:'qr',name:'QR-код',icon:'📱',cat:'util'},
  {id:'rec',name:'Диктофон',icon:'🎤',cat:'media'},
  {id:'notes',name:'Блокнот',icon:'📝',cat:'prod'},
  {id:'calc',name:'Калькулятор',icon:'🧮',cat:'util'},
  {id:'paint',name:'Paint',icon:'🎨',cat:'media'},
  {id:'music',name:'Музыка',icon:'🎵',cat:'media'},
  {id:'photos',name:'Фотографии',icon:'🖼️',cat:'media'},
  {id:'term',name:'Терминал',icon:'⌨️',cat:'util'},
  {id:'settings',name:'Параметры',icon:'⚙️',cat:'util'},
  {id:'weather',name:'Погода',icon:'☁️',cat:'util'},
  {id:'about',name:'О системе',icon:'ℹ️',cat:'util'},
  {id:'stickyn',name:'Заметки',icon:'📒',cat:'prod'},
  {id:'taskmgr',name:'Диспетчер задач',icon:'📊',cat:'util'},
  {id:'mines',name:'Сапёр',icon:'💣',cat:'game'},
  {id:'snake',name:'Змейка',icon:'🐍',cat:'game'},
  {id:'g2048',name:'2048',icon:'🔢',cat:'game'},
  {id:'memory',name:'Память',icon:'🃏',cat:'game'},
  {id:'ttt',name:'Крестики-нолики',icon:'❌',cat:'game'}
];
let extraApps=JSON.parse(LS('extraApps')||'[]');
function allApps(){return APPS.concat(extraApps)}
let zTop=100, wins={}, selectedIcon=null, notifs=[];
const DAYS=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function fmtDate(d){return DAYS[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]}
function fmtTime(d){
  let h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'), s=String(d.getSeconds()).padStart(2,'0');
  if(!settings.h24){const ap=h>=12?' PM':' AM';h=h%12||12;return settings.seconds?`${h}:${m}:${s}${ap}`:`${h}:${m}${ap}`;}
  return settings.seconds?`${String(h).padStart(2,'0')}:${m}:${s}`:`${String(h).padStart(2,'0')}:${m}`;
}
function tick(){
  const d=new Date();
  const t=fmtTime(d);
  const lockC=document.getElementById('lockClock'); if(lockC) lockC.textContent=t.replace(/:\d{2}$/, m=>settings.seconds?m:'');
  const lockD=document.getElementById('lockDate'); if(lockD) lockD.textContent=fmtDate(d);
  const cb=document.getElementById('clockBtn'); if(cb) cb.innerHTML=t+'<br><span style="font-size:11px;opacity:.7">'+d.getDate()+' '+MON[d.getMonth()]+'</span>';
}
setInterval(tick,1000); tick();
/* BOOT */
setTimeout(()=>{
  document.getElementById('boot').classList.add('hidden');
  document.getElementById('lock').classList.remove('hidden');
},2500);
document.getElementById('lock').onclick=()=>{
  const l=document.getElementById('lock');
  l.classList.add('out');
  setTimeout(()=>{
    l.classList.add('hidden');
    document.getElementById('desktop').classList.remove('hidden');
    document.getElementById('taskbar').classList.remove('hidden');
    renderDesktop();
    renderPins();
    renderStart();
  },400);
};
function renderDesktop(){
  const box=document.getElementById('deskIcons');
  box.innerHTML='';
  allApps().forEach(a=>{
    const el=document.createElement('div');
    el.className='dicon'; el.dataset.id=a.id;
    el.innerHTML=`<div class="em">${a.icon}</div><div class="lb">${a.name}</div>`;
    el.onclick=e=>{e.stopPropagation(); document.querySelectorAll('.dicon').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); selectedIcon=a.id;};
    el.ondblclick=()=>openApp(a.id);
    el.oncontextmenu=e=>{e.preventDefault();e.stopPropagation(); showCtx(e.clientX,e.clientY,[
      ['Открыть',()=>openApp(a.id)],
      ['Свойства',()=>toast(a.icon,a.name,'AetherOS приложение · PROPRIETARY')]
    ]);};
    box.appendChild(el);
  });
}
document.getElementById('desktop').onclick=()=>{document.querySelectorAll('.dicon').forEach(x=>x.classList.remove('sel')); selectedIcon=null; hideFly(); closeStart();};
document.getElementById('desktop').oncontextmenu=e=>{
  if(e.target.id!=='desktop' && !e.target.classList.contains('desk-icons')) return;
  e.preventDefault();
  showCtx(e.clientX,e.clientY,[['Обновить',()=>renderDesktop()],['Параметры',()=>openApp('settings')],['О системе',()=>openApp('about')]]);
};
const PINNED=['pc','browser','bank','store','camera','settings'];
function renderPins(){
  const p=document.getElementById('pins'); p.innerHTML='';
  PINNED.forEach(id=>{
    const a=allApps().find(x=>x.id===id); if(!a) return;
    const b=document.createElement('button'); b.className='tbtn'; b.textContent=a.icon; b.title=a.name;
    b.onclick=()=>openApp(id);
    p.appendChild(b);
  });
}
function renderRuns(){
  const r=document.getElementById('runs'); r.innerHTML='';
  Object.values(wins).forEach(w=>{
    const a=allApps().find(x=>x.id===w.app)||{icon:'📦',name:w.app};
    const b=document.createElement('button'); b.className='tbtn'+(w.el.style.display!=='none'?' on':'');
    b.innerHTML=a.icon+(w.el.style.display!=='none'?'<span class="ind"></span>':'');
    b.onclick=()=>{ if(w.el.style.display==='none'){w.el.style.display='flex'; focusWin(w.id);} else {w.el.style.display='none';} renderRuns(); };
    b.oncontextmenu=e=>{e.preventDefault(); showCtx(e.clientX,e.clientY,[
      ['Свернуть',()=>{w.el.style.display='none';renderRuns();}],
      ['Развернуть',()=>maximize(w)],
      ['Закрыть',()=>closeWin(w.id)]
    ]);};
    r.appendChild(b);
  });
}
function renderStart(filter=''){
  const g=document.getElementById('appGrid'); g.innerHTML='';
  allApps().filter(a=>a.name.toLowerCase().includes(filter.toLowerCase())).forEach(a=>{
    const d=document.createElement('div'); d.className='appcell';

function buildCal(){
  const d=new Date(), view=new Date(calMonth);
  const first=new Date(view.getFullYear(),view.getMonth(),1);
  const start=(first.getDay()+6)%7;
  const days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  let html=`<div style="font-size:28px">${fmtTime(d)}</div><div style="margin-bottom:8px">${fmtDate(d)}</div>
  <div class="row" style="justify-content:space-between"><button class="btn g" id="calPrev">‹</button><b>${MON[view.getMonth()]} ${view.getFullYear()}</b><button class="btn g" id="calNext">›</button></div>

  for(let i=0;i<start;i++) html+='<div style="opacity:.3"> </div>';
  for(let i=1;i<=days;i++){
    const tod=i===d.getDate()&&view.getMonth()===d.getMonth()&&view.getFullYear()===d.getFullYear();
    html+=`<div class="${tod?'today':''}">${i}</div>`;
  }
  html+='</div>';
  document.getElementById('calFly').innerHTML=html;
  document.getElementById('calPrev').onclick=e=>{e.stopPropagation();calMonth.setMonth(calMonth.getMonth()-1);buildCal();};
  document.getElementById('calNext').onclick=e=>{e.stopPropagation();calMonth.setMonth(calMonth.getMonth()+1);buildCal();};
}

function maximize(w){
  if(w.max){ Object.assign(w.el.style,w.prev); w.max=false; w.el.classList.remove('max'); }
  else { w.prev={left:w.el.style.left,top:w.el.style.top,width:w.el.style.width,height:w.el.style.height}; w.el.classList.add('max'); w.max=true; }
}
function setupDrag(w){
  const bar=w.el.querySelector('.titlebar');
  let ox,oy,drag=false;
  bar.onmousedown=e=>{
    if(e.target.closest('.wbtns')) return;
    drag=true; ox=e.clientX-w.el.offsetLeft; oy=e.clientY-w.el.offsetTop;
    const mv=ev=>{
      if(!drag) return;
      let l=ev.clientX-ox, t=ev.clientY-oy;
      const snap=document.getElementById('snap');
      if(ev.clientX<16){snap.style.cssText=`display:block;left:0;top:0;width:50%;height:calc(100% - 48px)`;}
      else if(ev.clientX>innerWidth-16){snap.style.cssText=`display:block;left:50%;top:0;width:50%;height:calc(100% - 48px)`;}
      else if(ev.clientY<12){snap.style.cssText=`display:block;left:0;top:0;width:100%;height:calc(100% - 48px)`;}
      else snap.style.display='none';
      if(!w.max){ w.el.style.left=l+'px'; w.el.style.top=Math.max(0,t)+'px'; }
    };
    const up=ev=>{
      drag=false; document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
      const snap=document.getElementById('snap'); snap.style.display='none';
      if(ev.clientX<16){w.el.style.left='0';w.el.style.top='0';w.el.style.width='50%';w.el.style.height='calc(100% - 48px)';}
      else if(ev.clientX>innerWidth-16){w.el.style.left='50%';w.el.style.top='0';w.el.style.width='50%';w.el.style.height='calc(100% - 48px)';}
      else if(ev.clientY<12){w.el.classList.add('max');w.max=true;}
    };
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  };
}
function setupResize(w){
  w.el.querySelectorAll('.rs').forEach(h=>{
    h.onmousedown=e=>{
      e.stopPropagation();
      const dir=[...h.classList].find(c=>c!=='rs');
      const r=w.el.getBoundingClientRect();
      const mv=ev=>{
        let l=r.left,t=r.top,wd=r.width,ht=r.height;
        if(dir.includes('e')) wd=Math.max(320,ev.clientX-r.left);
        if(dir.includes('s')) ht=Math.max(200,ev.clientY-r.top);
        if(dir.includes('w')){wd=Math.max(320,r.right-ev.clientX);l=ev.clientX;}
        if(dir.includes('n')){ht=Math.max(200,r.bottom-ev.clientY);t=ev.clientY;}
        Object.assign(w.el.style,{left:l+'px',top:t+'px',width:wd+'px',height:ht+'px'});
      };
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
    };
  });
}

      const ctx=c.querySelector('#ac').getContext('2d');
      (function loop(){
        if(!document.body.contains(c)) return;
        const d=new Date(), ctx2=ctx; ctx2.clearRect(0,0,220,220); ctx2.translate(110,110);
        ctx2.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--text')||'#fff';
        for(let i=0;i<60;i++){ctx2.beginPath();ctx2.rotate(Math.PI/30);ctx2.moveTo(0,-96);ctx2.lineTo(0,i%5?-88:-82);ctx2.stroke();}
        function hand(ang,len,w){ctx2.save();ctx2.rotate(ang);ctx2.lineWidth=w;ctx2.beginPath();ctx2.moveTo(0,8);ctx2.lineTo(0,-len);ctx2.stroke();ctx2.restore();}
        hand((d.getHours()%12+d.getMinutes()/60)*Math.PI/6,50,4);
        hand((d.getMinutes()+d.getSeconds()/60)*Math.PI/30,70,3);
        ctx2.strokeStyle='#0a84ff'; hand(d.getSeconds()*Math.PI/30,80,1);

    function marker(x,y){for(let i=0;i<7;i++)for(let j=0;j<7;j++){if(i===0||j===0||i===6||j===6||(i>1&&i<5&&j>1&&j<5)) ctx.fillRect((x+i)*cell,(y+j)*cell,cell,cell);}}
    marker(0,0); marker(n-7,0); marker(0,n-7);

function appMines(body){
  const n=9, mines=10; let grid=[], open=[], flag=[], dead=false, left=n*n-mines;
  function plant(){
    grid=Array(n*n).fill(0); open=Array(n*n).fill(false); flag=Array(n*n).fill(false); dead=false; left=n*n-mines;
    let m=0; while(m<mines){const i=Math.floor(Math.random()*n*n); if(!grid[i]){grid[i]=-1;m++;}}
    for(let i=0;i<n*n;i++) if(grid[i]!==-1){let c=0; neigh(i).forEach(j=>{if(grid[j]===-1)c++;}); grid[i]=c;}
  }
  function neigh(i){const x=i%n,y=Math.floor(i/n),o=[]; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy; if(nx>=0&&nx<n&&ny>=0&&ny<n)o.push(ny*n+nx);} return o;}
  function reveal(i){if(open[i]||flag[i]||dead)return; open[i]=true; if(grid[i]===-1){dead=true;toast('💣','Сапёр','Поражение'); draw(); return;} left--; if(grid[i]===0) neigh(i).forEach(reveal); if(left<=0) toast('💣','Сапёр','Победа!');}
  function draw(){
    body.innerHTML=`<button class="btn g" id="nr">Новая</button><div class="mine" style="margin-top:8px">${grid.map((g,i)=>`<button data-i="${i}">${flag[i]?'🚩':open[i]?(g<0?'💥':g||''):''}</button>`).join('')}</div>`;
    body.querySelector('#nr').onclick=()=>{plant();draw();};
    body.querySelectorAll('[data-i]').forEach(b=>{
      b.onclick=()=>{reveal(+b.dataset.i);draw();};
      b.oncontextmenu=e=>{e.preventDefault(); const i=+b.dataset.i; if(!open[i]) flag[i]=!flag[i]; draw();};
    });
  }
  plant(); draw();
}
function appSnake(body){
  body.innerHTML=`<canvas id="sn" width="300" height="300" style="background:#111;border-radius:8px"></canvas><div>Счёт: <span id="sc">0</span></div>`;
  const c=body.querySelector('#sn'), ctx=c.getContext('2d');
  let snake=[{x:8,y:8}], dir={x:1,y:0}, food={x:12,y:10}, score=0, alive=true;
  document.addEventListener('keydown',e=>{
    const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
    if(m[e.key] && (m[e.key].x+dir.x||m[e.key].y+dir.y)) dir=m[e.key];
  });
  const iv=setInterval(()=>{
    if(!document.body.contains(c)){clearInterval(iv);return;}
    if(!alive) return;
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=20||h.y>=20||snake.some(s=>s.x===h.x&&s.y===h.y)){alive=false;toast('🐍','Змейка','Счёт '+score);return;}
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){score++; body.querySelector('#sc').textContent=score; food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}
    else snake.pop();
    ctx.fillStyle='#111'; ctx.fillRect(0,0,300,300);
    ctx.fillStyle='#0a84ff'; snake.forEach(s=>ctx.fillRect(s.x*15,s.y*15,14,14));
    ctx.fillStyle='#ff3b30'; ctx.fillRect(food.x*15,food.y*15,14,14);
  },140);
}
function app2048(body){
  let g=Array(16).fill(0), score=0;
  function spawn(){const e=g.map((v,i)=>v?null:i).filter(v=>v!==null); if(e.length) g[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4;}
  spawn(); spawn();
  function slide(row){const a=row.filter(Boolean); for(let i=0;i<a.length-1;i++) if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a[i+1]=0;} return a.filter(Boolean).concat([0,0,0,0]).slice(0,4);}
  function move(dir){
    let ng=g.slice(), ch=false;
    const get=d=>{
      const rows=[];
      for(let i=0;i<4;i++){
        let r=[];
        for(let j=0;j<4;j++){
          const idx=d==='l'?i*4+j:d==='r'?i*4+(3-j):d==='u'?j*4+i: (3-j)*4+i;
          r.push(ng[idx]);
        }
        r=slide(r);
        for(let j=0;j<4;j++){
          const idx=d==='l'?i*4+j:d==='r'?i*4+(3-j):d==='u'?j*4+i:(3-j)*4+i;
          if(ng[idx]!==r[j]) ch=true; ng[idx]=r[j];
        }
      }
    };
    get(dir); if(ch){g=ng; spawn(); draw();}
  }
  function draw(){
    body.innerHTML=`<div>Счёт ${score}</div><div class="g2048">${g.map(v=>`<div>${v||''}</div>`).join('')}</div><p>Стрелки клавиатуры</p>`;
  }
  draw();
  const kh=e=>{const m={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}; if(m[e.key]&&document.body.contains(body)) move(m[e.key]);};
  document.addEventListener('keydown',kh);
}
function appMemory(body){
  const icons=['🍎','🍋','🍇','🍓','🍒','🍑','🥝','🍉'];
  let cards=icons.concat(icons).sort(()=>Math.random()-.5), open=[], lock=false, moves=0, t0=Date.now();
  function draw(){
    body.innerHTML=`<div>Ходы: ${moves} · ${Math.floor((Date.now()-t0)/1000)} с</div><div class="mem">${cards.map((c,i)=>`<button data-i="${i}">${open.includes(i)||cards[i]==='ok'?c:'❓'}</button>`).join('')}</div>`;
    body.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i; if(lock||open.includes(i)||cards[i]==='ok') return;
      open.push(i); draw();
      if(open.length===2){
        moves++; lock=true;
        setTimeout(()=>{
          if(cards[open[0]]===cards[open[1]]){cards[open[0]]=cards[open[1]]='ok'; if(cards.every(x=>x==='ok')) toast('🃏','Память','Победа за '+moves+' ходов');}
          open=[]; lock=false; draw();
        },500);
      }
    });
  }
  draw();
}
function appTTT(body){
  let b=Array(9).fill(''), turn='X', over=false;
  const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function winner(br){for(const [a,c,d] of wins) if(br[a]&&br[a]===br[c]&&br[a]===br[d]) return br[a]; return br.every(Boolean)?'draw':'';}
  function ai(){
    for(const mark of ['O','X']){ for(let i=0;i<9;i++) if(!b[i]){const t=b.slice(); t[i]=mark; if(winner(t)===mark) return i;}}
    if(!b[4]) return 4;
    const corners=[0,2,6,8].filter(i=>!b[i]); if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
    return b.findIndex(x=>!x);
  }
  function draw(){
    body.innerHTML=`<div class="ttt">${b.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('')}</div><button class="btn g" id="nr">Заново</button>`;
    body.querySelector('#nr').onclick=()=>{b=Array(9).fill('');over=false;draw();};
    body.querySelectorAll('[data-i]').forEach(btn=>btn.onclick=()=>{
      const i=+btn.dataset.i; if(b[i]||over) return; b[i]='X';
      let w=winner(b); if(w){over=true;toast('❌','Игра',w==='draw'?'Ничья':'Победа '+w); draw(); return;}
      const m=ai(); if(m>=0) b[m]='O';
      w=winner(b); if(w){over=true;toast('❌','Игра',w==='draw'?'Ничья':'Победа '+w);}
      draw();
    });
  }
  draw();
}
